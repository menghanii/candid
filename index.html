    view.style.width = rc.width + 'px'; view.style.height = rc.height + 'px';
    view.style.transform = `translate(${f.left}px, ${f.top}px) scale(${f.k})`;
  };

  loadImg(src).then(im => { if (dead) return; img = im; redraw(); }).catch(() => {});

  host.querySelector('.crot').onclick = e => { e.preventDefault(); e.stopPropagation(); if (!img) return; ed = { rot: (ed.rot + 270) % 360, z: 1, ox: 0, oy: 0 }; redraw(); emit(); };

  const pts = new Map(); let g0 = null, gest = null; // gest: 이번 손동작(손가락 최대 수·움직임) — 두 번 톡 판단용
  const start = () => { const a = [...pts.values()]; const FW = host.clientWidth, FH = host.clientHeight;
    g0 = { ed: { ...ed }, mx: a.reduce((s, p) => s + p.x, 0) / a.length, my: a.reduce((s, p) => s + p.y, 0) / a.length, d: a.length > 1 ? Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) : 0, FW, FH }; };

    const a = [...pts.values()], mx = a.reduce((s, p) => s + p.x, 0) / a.length, my = a.reduce((s, p) => s + p.y, 0) / a.length;
    let z = g0.ed.z; if (a.length > 1 && g0.d) z = Math.max(1, Math.min(6, g0.ed.z * Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) / g0.d));
    // 확대는 손가락 가운데를 기준으로: 그 점이 사진의 같은 곳에 머물게
    const R = host.getBoundingClientRect(), px = g0.mx - R.left - g0.FW / 2, py = g0.my - R.top - g0.FH / 2, r = z / g0.ed.z;
    const ox = (px - (px - g0.ed.ox * g0.FW) * r + (mx - g0.mx)) / g0.FW, oy = (py - (py - g0.ed.oy * g0.FH) * r + (my - g0.my)) / g0.FH;

  return { destroy() { dead = true; ro.disconnect(); } };
}

// ask(문구, { ok, cancel, danger, input }) → 확인 true / 취소 false / input 이 있으면 입력한 글(취소 null)
function ask(msg, o = {}) {
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'askw'; w.setAttribute('role', 'alertdialog'); w.setAttribute('aria-modal', 'true');
    w.innerHTML = `<div class="askc"><p>${esc(msg).replace(/\n/g, '<br>')}</p>${o.input != null ? `<input class="field" value="${esc(o.input)}" placeholder="${esc(o.placeholder || '')}">` : ''}
      <div class="askb"><button data-n>${esc(o.cancel || t('취소'))}</button><button data-y class="${o.danger ? 'danger' : 'ok'}">${esc(o.ok || t('확인'))}</button></div></div>`;
    document.body.appendChild(w);
    const inp = w.querySelector('input'); if (inp) setTimeout(() => inp.focus(), 50);
    const done = v => { w.classList.add('out'); setTimeout(() => w.remove(), 160); res(v); };
    w.querySelector('[data-y]').onclick = () => done(inp ? inp.value : true);
    w.querySelector('[data-n]').onclick = () => done(inp ? null : false);
    w.onclick = e => { if (e.target === w) done(inp ? null : false); };
  });
}

    if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (dx > 90) back(); else { el.style.transition = 'transform .2s'; el.style.transform = ''; setTimeout(() => el.style.transition = '', 220); }
  });
}
// 뒤로가기/앞으로가기: 주소가 바뀐 경우에만 화면 다시 그림(시트 닫기용 히스토리는 무시)
// ---------- 뒤로가기: 그 전 모습 그대로 ----------
// 다른 화면으로 가기 직전의 스크롤·탭·은하·열려 있던 Candids 보기(보던 사진)·사진 페이지를 그 기록에 적어 두고, 돌아오면 되살림
function saveViewState(extra) {
  const st = { ...(history.state || {}), y: Math.round(scrollY), tab: S.tab, og: ORBIT_G, ...extra };
  try { history.replaceState(st, ''); } catch {}
}
function restoreViewState(st) {
  if (!st) return;
  if (Number.isInteger(st.og)) ORBIT_G = st.og;
  if (st.y > 0) { const t0 = Date.now(); const tryY = () => { if (pageKey() !== CUR) return; if (document.documentElement.scrollHeight >= st.y + innerHeight - 4 || Date.now() - t0 > 2500) return scrollTo(0, st.y); requestAnimationFrame(tryY); }; requestAnimationFrame(tryY); }
  if (st.viewer && !document.querySelector('.oreel')) setTimeout(() => openReelViewer({ ...st.viewer, restore: true }), 60);
  else if (st.postId && !document.querySelector('.overlay.page')) { const t0 = Date.now(); const iv = setInterval(() => { if (findAny(st.postId) || Date.now() - t0 > 4000) { clearInterval(iv); if (findAny(st.postId)) openPost(st.postId); } }, 120); }
}
// ---------- 겹쳐 여는 화면의 뒤로가기(공용) ----------
// pushLayer(이름, 닫기): 기록에 이름표를 달고 목록에 올림 → 뒤로가기로 이름표가 사라지면 위에서부터 닫기(fromPop=true)
// dropLayer(이름): 화면이 스스로 닫힐 때 목록에서만 뺌
const LAYERS = [];
function pushLayer(key, close, already) { if (!already) history.pushState({ ...(history.state || {}), [key]: 1 }, ''); dropLayer(key); LAYERS.push({ key, close }); }
function dropLayer(key) { const i = LAYERS.findIndex(l => l.key === key); if (i >= 0) LAYERS.splice(i, 1); }
addEventListener('popstate', () => { for (let i = LAYERS.length - 1; i >= 0; i--) { const l = LAYERS[i]; if (!history.state?.[l.key]) { LAYERS.splice(i, 1); l.close(true); } } });
addEventListener('popstate', () => {
  if (pageKey() === CUR) return;
  closeSheet(); document.querySelector('.overlay')?.remove(); document.querySelectorAll('.oreel').forEach(o => o.remove()); FEED_ADS.hide();
  S.autoOpened = true; // 뒤로 와서 시트가 다시 열리지 않게
  const st = history.state;
  S.tab = st?.tab || tabOf(new URLSearchParams(location.search).get('tab'));
  if (Number.isInteger(st?.og)) ORBIT_G = st.og;
  CUR = pageKey(); route();
  restoreViewState(st);
});
// 앱 안의 링크(<a href="?u=...">)도 새로고침 없이 이동
document.addEventListener('click', e => {
  const a = e.target.closest('a[href]');
  if (!a || a.target || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const u = new URL(a.href, location.href);
  if (u.origin !== location.origin || u.pathname !== location.pathname) return;
  e.preventDefault();
  const pg = a.closest('.overlay.page'), ore = a.closest('.oreel');
  if (ore?._desc) { const R = ore.querySelector('#sreels'), V = R.getBoundingClientRect(); const cur = [...R.querySelectorAll('.reel[data-id]')].find(e => Math.abs(e.getBoundingClientRect().top - V.top) < 40); saveViewState({ viewer: { ...ore._desc, startId: cur?.dataset.id || ore._desc.startId } }); }
  else if (pg?.dataset.pid) saveViewState({ postId: pg.dataset.pid });
  if (a.closest('.overlay, .sheet-wrap')) { document.querySelector('.overlay')?.remove(); closeSheet(); } // 게시물·시트 안의 링크(작성자·댓글 단 사람 등): 닫고 이동
  if (ore) { dropLayer('oreel'); FEED_ADS.hide(); document.querySelectorAll('.oreel').forEach(o => o.remove()); VIEWER = []; } // Candids 보기 안의 링크(from 이름 등): 보기를 닫고 이동(뒤로 오면 다시 열림)
  go(u.href);
});

// ---------- 로그인 ----------
let PREV_LOGIN = null;
const PROVIDER_NAME = { kakao: t('카카오'), google: 'Google', apple: 'Apple' };
function login(provider) {
  // 카톡 안의 카카오 로그인: 이미 카톡에 로그인돼 있어 동의 한 번이면 끝 → 그 자리에서 진행
  // 그 외 인앱(인스타 등)·Google: 인앱에서 막히므로 외부 브라우저로
  if (!IN_APP && inApp && !DEMO && !(inKakao && provider === 'kakao')) return openExternal();
  try { localStorage.setItem('candid_last_login', provider); sessionStorage.setItem('candid_oauth', '1'); } catch {}
  showAuthWait(t('{provider} 로그인으로 이동 중…', { provider: PROVIDER_NAME[provider] || '' }));
  if (IN_APP && provider === 'apple') return nativeApple().catch(e => { cancelAuthWait(); if (!/canceled|replaced/.test(e?.message || e?.code || '')) toast(kerr(e)); });
  if (IN_APP) return nativeOAuth(provider).catch(e => { console.error('[candid] login fail', e?.code, e?.message, JSON.stringify(e)); cancelAuthWait(); toast(kerr(e)); });
  sb.auth.signInWithOAuth({ provider, options: { redirectTo: location.origin + location.pathname } });
}
// 보여 줄 로그인 방법: iOS 앱에서는 iPhone 기본 Apple 로그인을 항상(앱스토어 규정), 웹은 config 의 목록대로
// 로그인 버튼 묶음(첫 화면·초대 화면·공유 링크 공통): 지난번 방법을 맨 위로 + 배지, Apple 포함
function loginButtonsHTML(list) {
  const all = loginProviders();
  const p = list || (inKakao && all.includes('kakao') ? ['kakao'] : LANG === 'ko' ? all : [...all].sort((a, b) => (a === 'google' ? -1 : 0) - (b === 'google' ? -1 : 0)));
  let last = null; try { last = localStorage.getItem('candid_last_login'); } catch {}
  const badge = k => last === k ? `<span class="last-badge">${t('지난번에 이걸로 로그인했어요')}</span>` : '';
  const btn = {
    kakao: `<button class="social kakao" onclick="login('kakao')">${I.kakao} ${t('카카오로 계속하기')}${badge('kakao')}</button>`,
    google: `<button class="social google" onclick="login('google')">${I.google} ${t('Google로 계속하기')}${badge('google')}</button>`,
    apple: `<button class="social apple" onclick="login('apple')">${I.apple} ${t('Apple로 계속하기')}${badge('apple')}</button>`,
  };
  const order = last && p.includes(last) ? [last, ...p.filter(k => k !== last)] : p;
  return order.filter(k => btn[k]).map(k => btn[k]).join('');
}
function loginProviders() {
  const a = cfg.PROVIDERS || ['kakao', 'google'];
  return IN_APP && !a.includes('apple') && window.Capacitor?.isPluginAvailable?.('AppleSignIn') ? [...a, 'apple'] : a;
}
// iOS 앱의 Apple 로그인: iPhone 기본 창(Face ID) → Apple 이 준 토큰으로 Supabase 로그인
async function nativeApple() {
  const raw = [...crypto.getRandomValues(new Uint8Array(24))].map(b => b.toString(16).padStart(2, '0')).join('');
  const hashed = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw)))].map(b => b.toString(16).padStart(2, '0')).join('');
  const r = await capPlugin('AppleSignIn').start({ nonce: hashed });
  const { error } = await sb.auth.signInWithIdToken({ provider: 'apple', token: r.identityToken, nonce: raw });
  if (error) throw error;
  try { if (r.name) sessionStorage.setItem('candid_apple_name', r.name); sessionStorage.removeItem('candid_oauth'); } catch {}
  location.reload();
}
// iOS 앱: 앱 화면 안에서는 Google 등이 로그인을 막음 → iPhone 로그인 창(Safari)으로 열고, 끝나면 candid://auth-callback 으로 앱에 돌아옴
const APP_CB = 'candid://auth-callback';
const capPlugin = name => window.Capacitor?.Plugins?.[name] || window.Capacitor?.registerPlugin?.(name); // 앱 안에서는 Capacitor.Plugins 에 들어 있음
async function nativeOAuth(provider, link) {
  const opts = { provider, options: { redirectTo: APP_CB, skipBrowserRedirect: true } };
  const { data, error } = link ? await sb.auth.linkIdentity(opts) : await sb.auth.signInWithOAuth(opts);
  if (error) throw error;
  // iPhone 로그인 전용 창(AuthSession 플러그인): candid:// 로 돌아오면 창이 닫히고 그 주소를 돌려줌
  const auth = capPlugin('AuthSession');
  try { const r = await auth.start({ url: data.url, scheme: 'candid' }); return finishNativeOAuth(r.url); }
  catch (e) { if (/canceled/.test(e?.message || e?.code || '')) return cancelAuthWait(); if (!/not implemented|UNIMPLEMENTED/i.test(e?.message || e?.code || '')) throw e; }
  await capPlugin('Browser').open({ url: data.url, presentationStyle: 'popover' }); // 예전 앱(플러그인 없음) 대비
}
// 로그인 창에서 앱으로 돌아왔을 때: 받은 코드(또는 토큰)로 로그인 마무리 → 새로 시작
async function finishNativeOAuth(url) {
  capPlugin('Browser').close().catch(() => {});
  const u = new URL(url.replace(APP_CB, 'https://app.local/cb'));
  const h = new URLSearchParams(u.hash.slice(1)), err = u.searchParams.get('error_description') || h.get('error_description');
  if (err) { cancelAuthWait(); return toast(err); }
  let r = { error: null };
  if (u.searchParams.get('code')) r = await sb.auth.exchangeCodeForSession(u.searchParams.get('code'));
  else if (h.get('access_token')) r = await sb.auth.setSession({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token') });
  if (r.error) { cancelAuthWait(); return toast(kerr(r.error)); }
  try { sessionStorage.removeItem('candid_oauth'); } catch {}
  location.reload();
}
if (IN_APP && PERF) { // 점검: 하단 메뉴를 누른 위치·대상과 실제 눌림(click) 기록
  document.addEventListener('touchstart', e => { const b = e.target.closest?.('.bnav'); if (b) { const t0 = e.touches[0]; console.log(`[candid] tap start ${Math.round(t0.clientX)},${Math.round(t0.clientY)} ${e.target.tagName}.${e.target.className?.baseVal ?? e.target.className}`); } }, { passive: true, capture: true });

  let lastF = performance.now(), worst = 0; const fl = () => { const n = performance.now(); worst = Math.max(worst, n - lastF); lastF = n; requestAnimationFrame(fl); }; requestAnimationFrame(fl);
  setInterval(() => { if (worst > 60) console.log('[candid] slow frame ' + Math.round(worst) + 'ms ' + (document.getElementById('orbitv') ? 'orbit' : document.querySelector('.reels') ? 'reels' : 'other')); worst = 0; }, 1000);

if (IN_APP) {
  console.log('[candid] native plugins', ['AuthSession', 'MediaPicker', 'App', 'Browser'].map(n => n + ':' + !!window.Capacitor?.isPluginAvailable?.(n) + '/' + typeof capPlugin(n)?.addListener).join(' '));
  capPlugin('App')?.addListener('appUrlOpen', ({ url }) => { if (url?.startsWith(APP_CB)) finishNativeOAuth(url); else openAppLink(url); });
  capPlugin('App')?.getLaunchUrl?.().then(r => { if (r?.url && !r.url.startsWith(APP_CB)) openAppLink(r.url); }).catch(() => {}); // 링크를 눌러 앱이 새로 켜진 경우
  capPlugin('PushNotifications')?.addListener('pushNotificationActionPerformed', a => { const u = a?.notification?.data?.url; if (u) openAppLink(u); });
  capPlugin('PushNotifications')?.addListener('registration', t => nativePushToken(t.value));
  capPlugin('PushNotifications')?.addListener('registrationError', e => console.error('[candid] push reg', JSON.stringify(e)));
  capPlugin('Browser')?.addListener('browserFinished', () => setTimeout(() => { if (document.querySelector('.authwait') && !me) cancelAuthWait(); }, 600)); // 로그인 창을 그냥 닫음
}
// candid-feed.com 링크(유니버설 링크)·앱 푸시로 앱이 열렸을 때: 앱 안의 그 화면으로(앱 준비가 끝난 뒤)
function openAppLink(url) {
  let u; try { u = new URL(url, SITE); } catch { return; }
  if (!/candid-feed\.com$|candidcrew\.workers\.dev$/.test(u.hostname) && u.protocol !== 'capacitor:' && !(u.protocol === 'candid:' && u.hostname === 'open')) return;
  u.searchParams.delete('v'); // 링크 미리보기용 꼬리표
  const target = location.pathname + (u.search === '?' ? '' : u.search);

// 잡았을 때 폭죽: 화면 위에 잠깐 캔버스를 깔고 불꽃을 터뜨림(중력으로 떨어지며 반짝이다 사라짐). 희귀할수록 크고 화려하게
const FW_COLORS = {
  blue: ['#3d5cff', '#8aa2ff', '#ffffff'], mint: ['#14c8a0', '#7ff0d4', '#ffffff'], pink: ['#ff3d8b', '#ff9cc4', '#ffffff'],
  lemon: ['#ffb300', '#ffe27a', '#ffffff'], purple: ['#9b4dff', '#cfa8ff', '#ffffff'], ink: ['#2a2a33', '#8e8e93', '#ffffff'],
  gold: ['#ffc83c', '#fff3b0', '#ff9f0a', '#ffffff'], rainbow: null,
};
function dotBurst(x, y, kind) {
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches; // '동작 줄이기'를 켠 사람: 작고 짧게
  const c = document.createElement('canvas'), dpr = Math.min(2, devicePixelRatio || 1);
  c.className = 'fwcan'; c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  document.body.appendChild(c); const g = c.getContext('2d'); g.scale(dpr, dpr);
  const big = kind === 'rainbow' || kind === 'gold', P = [];
  const col = i => FW_COLORS[kind] ? FW_COLORS[kind][i % FW_COLORS[kind].length] : `hsl(${(i * 37) % 360} 95% 62%)`;
  const shot = (cx, cy, n, sp, delay = 0) => { for (let i = 0; i < n; i++) {
    const a = Math.PI * 2 * i / n + Math.random() * .25, v = sp * (.55 + Math.random() * .6);
    P.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * .15, life: 0, max: calm ? .45 : .9 + Math.random() * .5, c: col(i), r: 1.6 + Math.random() * 1.8, d: delay, tw: Math.random() * 6 });
  } };
  shot(x, y, calm ? 24 : big ? 90 : 56, calm ? 140 : big ? 330 : 260);
  if (big && !calm) { shot(x - 70, y - 90, 40, 220, .25); shot(x + 80, y - 70, 40, 220, .42); } // 희귀: 연달아 두 번 더
  let flash = 1, last = performance.now();
  const tick = now => {
    const dt = Math.min(.04, (now - last) / 1000); last = now;
    g.clearRect(0, 0, innerWidth, innerHeight);
    if (flash > 0) { g.globalAlpha = flash * .55; g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, 34 + (1 - flash) * 40, 0, 7); g.fill(); flash -= dt * 5; }
    let alive = 0;
    for (const p of P) {
      if (p.d > 0) { p.d -= dt; alive++; continue; }
      p.life += dt; if (p.life > p.max) continue; alive++;
      p.vx *= 1 - dt * 1.6; p.vy = p.vy * (1 - dt * 1.6) + 260 * dt; // 공기 저항 + 중력
      const px = p.x, py = p.y; p.x += p.vx * dt; p.y += p.vy * dt;
      const k = 1 - p.life / p.max, tw = .65 + .35 * Math.sin(p.life * 30 + p.tw);
      g.globalAlpha = Math.max(0, k * tw);
      g.strokeStyle = p.c; g.lineWidth = p.r; g.lineCap = 'round';
      g.beginPath(); g.moveTo(px - p.vx * dt * 2.5, py - p.vy * dt * 2.5); g.lineTo(p.x, p.y); g.stroke(); // 꼬리
      g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r * .9, 0, 7); g.fill();
    }
    g.globalAlpha = 1;
    if (alive) requestAnimationFrame(tick); else c.remove();
  };
  requestAnimationFrame(tick);
  setTimeout(() => c.remove(), 3000); // 안전장치
}

function wanderEngine(w, getBox, { tap = false, speed: SPEED = 34, start = true } = {}) {
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const svg = w.firstElementChild, body = svg.querySelector('.d3-body'), eyes = svg.querySelector('.d3-eyes'), shadow = svg.querySelector('.d3-shadow');
  const pupils = [...svg.querySelectorAll('.d3-pupil')].map(p => [p, +p.getAttribute('cx'), +p.getAttribute('cy')]);
  const box = getBox;
  let B = box(), x = B.x0 + (B.x1 - B.x0) * .7, y = B.y0 + (B.y1 - B.y0) * .55;
  let th = Math.PI, turn = 0, speed = 0, face = -1, phase = 0, mode = 'walk', modeT = 3 + Math.random() * 4, turnT = 0;
  let gaze = [0, 0], gazeT = [0, 0], blinkT = 2 + Math.random() * 3, blink = 0, jump = 0, last = performance.now();
  const set = () => {
    const sp = speed / SPEED, wob = Math.sin(phase);
    const sx = 1 + (.07 * sp + .015) * wob, sy = 1 - (.07 * sp + .015) * wob, tilt = 5 * sp * Math.sin(phase / 2);
    const lift = jump > 0 ? Math.sin(Math.PI * (1 - jump / .6)) * 26 : 0;
    w.style.transform = `translate(${x.toFixed(1)}px, ${(y - lift).toFixed(1)}px)`;
    body.setAttribute('transform', `translate(50 90) rotate(${(tilt * face).toFixed(2)}) scale(${(sx * face).toFixed(3)} ${sy.toFixed(3)}) translate(-50 -90)`);
    shadow.setAttribute('transform', `translate(${lift * .1} ${lift}) scale(${(1 - lift / 90).toFixed(3)} 1)`); shadow.style.opacity = (.35 - lift / 140).toFixed(2);
    eyes.setAttribute('transform', `translate(0 48) scale(1 ${(1 - blink).toFixed(2)}) translate(0 -48)`);
    pupils.forEach(([p, cx, cy]) => { p.setAttribute('cx', (cx + gaze[0]).toFixed(2)); p.setAttribute('cy', (cy + gaze[1]).toFixed(2)); });
  };
  let running = false;
  const tick = now => {
    if (!w.isConnected || !running) { running = false; return; }
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if ((turnT -= dt) <= 0) { turn = (Math.random() - .5) * 2.2; turnT = .6 + Math.random() * 1.4; }
    if ((modeT -= dt) <= 0) { mode = mode === 'walk' ? 'pause' : 'walk'; modeT = mode === 'walk' ? 3 + Math.random() * 5 : 1.2 + Math.random() * 1.8; if (mode === 'pause') gazeT = [(Math.random() - .5) * 4, (Math.random() - .3) * 2.4]; }
    // 벽 가까이 가면 가운데 쪽으로 서서히 방향을 틀기
    const cx = (B.x0 + B.x1) / 2, cy = (B.y0 + B.y1) / 2, mx = 40;
    let steer = turn;
    if (x < B.x0 + mx || x > B.x1 - mx || y < B.y0 + mx * .6 || y > B.y1 - mx * .6) {
      const want = Math.atan2(cy - y, cx - x); let d = want - th; d = Math.atan2(Math.sin(d), Math.cos(d)); steer = d * 2.4;
    }
    th += steer * dt;
    const target = mode === 'walk' && jump <= 0 ? SPEED : 0;
    speed += (target - speed) * Math.min(1, dt * 2.2);
    x = Math.min(B.x1, Math.max(B.x0, x + Math.cos(th) * speed * dt));
    y = Math.min(B.y1, Math.max(B.y0, y + Math.sin(th) * speed * dt * .55));
    phase += dt * (speed > 2 ? 7 + speed / 6 : 2.2);
    if (Math.abs(Math.cos(th)) > .2 && speed > 4) face += ((Math.cos(th) > 0 ? 1 : -1) - face) * Math.min(1, dt * 5); // 방향 바꿀 때 몸이 납작해졌다 뒤집힘
    if (mode === 'walk') gazeT = [1.4 * Math.abs(Math.cos(th)), 1.6 * Math.sin(th)];
    gaze = gaze.map((g, i) => g + (gazeT[i] - g) * Math.min(1, dt * 4));
    if ((blinkT -= dt) <= 0) { blink = 1; blinkT = 2.5 + Math.random() * 3.5; }
    blink = Math.max(0, blink - dt * 7);
    if (jump > 0) jump = Math.max(0, jump - dt);
    set(); requestAnimationFrame(tick);
  };
  set();
  if (tap) w.onclick = () => {
    if (jump > 0) return;
    jump = .6; w.classList.add('happy'); navigator.vibrate?.(8);
    setTimeout(() => w.classList.remove('happy'), 1100);
    if (calm) { set(); }
  };
  const onRs = () => { if (!w.isConnected) return removeEventListener('resize', onRs); B = box(); }; // 화면에서 사라지면 스스로 해제
  addEventListener('resize', onRs, { passive: true });
  setTimeout(() => { B = box(); }, 400); // 글꼴·이미지 뒤에 버튼 위치가 바뀌는 경우
  const play = () => { if (calm || running || !w.isConnected) return; running = true; B = box(); requestAnimationFrame(ts => { last = ts; tick(ts); }); };
  if (start) play();
  return { play, pause: () => { running = false; } };
}

// ---------- 프로필 ----------
function tabOf(t) { return t === 'inbox' ? t : 'grid'; } // 내 피드 탭: 피드 · 보관함(친구·그룹은 위 숫자를 눌러 새 페이지)
const S = { tab: tabOf(new URLSearchParams(location.search).get('tab')) };

async function renderProfile(uid, fresh, quiet) { // quiet: 돌아왔을 때 뒤에서만 갱신(저장된 화면을 다시 그리지 않음)
  CUR = pageKey();
  const myKey = CUR;
  // 한 번 본 피드는 저장해 둔 화면을 바로 보여주고, 최신 데이터는 뒤에서 받아 갱신
  const cached = CACHE.prof.get(uid);
  if (cached && !fresh && !quiet) { Object.assign(S, cached, { uid }); if (!S.isOwner) S.tab = 'grid'; paintProfile(); }
  // 처음 여는 피드: 서버 응답을 기다리는 동안에도 누른 게 바로 보이게(로딩 로고 + 아래 메뉴 표시)
  else if (!cached && !quiet && !document.querySelector('#splash:not(.out)')) { $app.classList.remove('has-nav'); $app.innerHTML = `<div class="authwait"><span class="logo">${LOGO_DOT}</span></div>${navBar(me?.id === uid ? 'feed' : '')}`; }
  let res;
  try {
    res = await withTimeout(Promise.all([
      sb.from('profiles').select('*').eq('id', uid).maybeSingle(),
      sb.from('posts').select(POST_COLS).eq('owner_id', uid).order('created_at', { ascending: false }),
    ]), 10000);
  } catch { return cached ? undefined : renderError(() => renderProfile(uid)); }
  if (pageKey() !== myKey) return; // 그 사이 다른 화면으로 이동함
  const [{ data: prof, error: e1 }, { data: posts, error: e2 }] = res;
  if (e1 || e2) return cached ? undefined : renderError(() => renderProfile(uid)); // 네트워크 오류를 '없는 피드'로 오인하지 않도록
  if (!prof) {
    $app.innerHTML = `<div class="landing"><span class="logo">${LOGO}</span><div class="hero"><div style="margin-bottom:18px">${DOT('look', { size: 76, cls: 'blink' })}</div><h1>Not found<i class="pd">.</i></h1>
      <p class="tagline">${t('존재하지 않는 피드예요. 링크가 정확한지 확인해 주세요.')}</p><button class="btn primary block" onclick="go(location.pathname)">${t('내 피드 만들기')}</button></div></div>`;
    return;
  }
  // 바뀐 게 없는지 비교: 고정·사진 순서·한마디 수정도 포함(빠지면 저장해 둔 예전 화면이 그대로 남아 고정이 풀린 것처럼 보임)
  const sig = JSON.stringify([prof, posts.map(p => [p.id, p.status, p.answer, p.approved_at, p.pinned_at, p.image_path, p.media, p.text, p.edited_at])]);
  if (cached && cached.sig === sig && !fresh) { S.fetchedAt = Date.now(); return; } // 바뀐 게 없으면 다시 그리지 않음
  // 비공개 피드: 주인이 나를 친구로 추가했는지 (서버 규칙과 같은 함수로 확인). 함수가 없으면(19 SQL 전) 게시물이 안 왔는지로 판단
  let locked = false;
  if (prof.is_private && me?.id !== uid) {
    let ok = null, e3 = null; try { ({ data: ok, error: e3 } = await sb.rpc('can_view_feed', { o: uid })); } catch (e) { e3 = e; }
    locked = e3 ? !posts.some(p => p.status === 'approved') : !ok;

  const m = new URLSearchParams(location.search).get('m');
  if (!S.isOwner && m !== null && !S.autoOpened) { S.autoOpened = true; openCompose(0, true, 'media', false); } // 부탁 링크(&m=)로 오면 바로 보내기 화면
}

// 받아둔 데이터(S)로 화면만 다시 그림 — 탭 전환·승인·거절 때 네트워크 요청 없음
const PCOUNT = new Map(); // 친구 피드의 친구·그룹 수(37 SQL profile_counts)
async function loadProfileCounts(uid) {
  try { const { data, error } = await sb.rpc('profile_counts', { p_user: uid }); if (error || !data) return; const r = Array.isArray(data) ? data[0] : data; if (!r) return; PCOUNT.set(uid, { friends: +r.friends, groups: +r.groups }); }
  catch { return; }
  if (S.uid !== uid) return; const c = PCOUNT.get(uid);
  document.querySelectorAll('[data-pc]').forEach(b => { b.textContent = c[b.dataset.pc]; });
}
// ---------- 피드 머리(내 피드·친구 피드·그룹 공통 부품) ----------
// 사진 · 이름 · @아이디 · 공개 여부 · 소개 · 숫자 줄 · 버튼 줄(+⋯) · 안내 · 탭 — 모양과 순서가 언제나 같게
//  stats: [{ n, label, go(누르면 실행할 코드), aria, key(나중에 숫자 채울 이름), badge }]
function feedHead({ cls = '', face, name, nameCls = '', nameStyle = '', handle, isPrivate, extraBadge = '', desc = '', extra = '', stats, statsHidden, acts, more, note = '', tabs }) {
  const stat = st => { const b = `<b${st.key ? ` data-pc="${st.key}"` : ''}>${st.n}</b><span>${st.label}${st.badge ? ` <i class="stat-n">${st.badge}</i>` : ''}</span>`;
    return st.go ? `<button class="stat-btn" onclick="${st.go}" aria-label="${st.aria || ''}">${b}</button>` : `<div>${b}</div>`; };
  return `<section class="head ${cls}">
      <div class="avwrap">${face}</div>
      <div class="name${nameCls}"${nameStyle}>${esc(name)}</div>
      <div class="handle">${handle ? `@${esc(handle)} · ` : ''}<span class="gbadge">${isPrivate ? `${II.lock} ${t('비공개')}` : `${II.globe} ${t('공개')}`}${extraBadge}</span></div>
      ${desc}${extra}
      <div class="stats"${statsHidden ? ' hidden' : ''}>${stats.map(stat).join('')}</div>
    </section>
    <div class="actions">${acts}${more ? `<button class="btn bmore" aria-label="${t('더보기')}" onclick="${more}">${I.more}</button>` : ''}</div>
    ${note}
    ${tabs ? `<nav class="tabs">${tabs}</nav>` : ''}`;
}
function paintProfile() {

  const approved = S.approved.sort((a, b) => (!!b.pinned_at - !!a.pinned_at) || (a.pinned_at && b.pinned_at ? new Date(b.pinned_at) - new Date(a.pinned_at) : new Date(b.approved_at) - new Date(a.approved_at))); // 고정한 사진은 맨 위(나중에 고정한 게 맨 앞)
  const pending = S.pending;

  const y = scrollY;
  const dc = GACHA_ON ? deco(prof) : { stickers: [] }, rf = ringFx(dc.frame), nf = nameFx(dc.name); // 가챠로 장착한 꾸미기(꺼져 있으면 없음)

    ${appTop(isOwner || !me ? null : prof.name)}
    ${coverHTML(dc.theme)}
    ${feedHead({ cls: dc.theme ? 'has-cover' : '',
      face: (isOwner ? `<button class="ring${rf.cls}"${rf.style} onclick="renderSetup(false)" aria-label="${t('프로필 편집')}">${avatar(prof)}</button>` : `<div class="ring${rf.cls}"${rf.style}>${avatar(prof)}</div>`) + stickersHTML(dc.stickers),
      name: prof.name, nameCls: nf.cls, nameStyle: nf.style, handle: prof.handle, isPrivate: prof.is_private,
      desc: prof.bio ? `<div class="desc bio">${esc(prof.bio)}</div>`
        : isOwner ? `<button class="desc bio-empty" onclick="renderSetup(false)">${t('+ 프로필 메시지 추가')}</button>`
        : `<div class="desc">${t('친구들이 만들어주는 {name}의 피드', { name: esc(prof.name) })}</div>`,
      extra: `<div class="dotshelf" data-shelf="${uid}">${dotShelfHTML(uid)}</div>`,
      statsHidden: S.locked,
      stats: [{ n: approved.length, label: t('게시물') },
        { n: friends, label: t('채워준 친구'), go: `go('?fillers=${uid}')`, aria: t('채워준 친구 보기') },
        isOwner ? { n: myFollows.size, label: t('친구'), go: "go('?friends=1')", aria: t('친구 목록 보기') } : { n: PCOUNT.get(uid)?.friends ?? '–', label: t('친구'), key: 'friends' },

             <button class="btn ${myFollows.has(uid) ? '' : 'add'}" style="flex:none;padding-left:18px;padding-right:18px" onclick="toggleFollow('${uid}', this)">${folLabel(myFollows.has(uid))}</button>`

// 🔔 새 소식: 승인함 탭을 열고 탭 위치로 스크롤

// 저장한 순서대로. 순서에 없는 것(새로 추가한 친구·그룹)은 맨 위에 기본 정렬로
function byOrder(list, kind, keyOf = x => x.id) {
  const pos = new Map((ORDER[kind] || []).map((id, i) => [id, i]));
  const fresh = list.filter(x => !pos.has(keyOf(x))), known = list.filter(x => pos.has(keyOf(x))).sort((a, b) => pos.get(keyOf(a)) - pos.get(keyOf(b)));
  return [...fresh, ...known];
}
// 목록 끌어서 순서 바꾸기: 각 줄([data-key]) 오른쪽 손잡이(.dh)를 누른 채 위아래로
function sortable(list, onDone) {
  list.querySelectorAll('.dh').forEach(h => h.addEventListener('pointerdown', e => {
    const row = h.closest('[data-key]'); if (!row || row.parentElement !== list) return;
    e.preventDefault(); h.setPointerCapture(e.pointerId);
    const before = [...list.children].map(x => x.dataset.key);
    const grab = e.clientY - row.getBoundingClientRect().top; let ty = 0, lastY = e.clientY, raf = 0;
    row.classList.add('dragging'); list.classList.add('sorting'); navigator.vibrate?.(8);
    const place = () => {
      const y = lastY;
      let next = row.nextElementSibling, prev = row.previousElementSibling;
      while (next && y > next.getBoundingClientRect().top + next.offsetHeight / 2) { list.insertBefore(next, row); next = row.nextElementSibling; }
      while (prev && y < prev.getBoundingClientRect().top + prev.offsetHeight / 2) { list.insertBefore(row, prev); prev = row.previousElementSibling; }
      const top = row.getBoundingClientRect().top - ty; ty = y - grab - top; row.style.transform = `translateY(${ty}px)`;
    };
    const edge = () => { // 화면 위·아래 끝에 가까우면 천천히 스크롤
      const vh = innerHeight, d = lastY < 90 ? -8 : lastY > vh - 110 ? 8 : 0;
      if (d) { scrollBy(0, d); place(); } raf = requestAnimationFrame(edge);
    };
    raf = requestAnimationFrame(edge);
    const move = ev => { lastY = ev.clientY; place(); };
    const up = () => {
      cancelAnimationFrame(raf); h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
      row.classList.remove('dragging'); list.classList.remove('sorting'); row.style.transform = '';
      const after = [...list.children].map(x => x.dataset.key);
      if (after.join() !== before.join()) onDone(after);
    };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  }));
}

  // 친구(사람)와 그룹을 나눠서, 각각 이름순
  const mixHTML = (people, groups, bare, mine) => {
    const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'ko');
    const ps = people.filter(p => p.id !== me?.id).sort(byName), gs = [...groups].sort(byName);
    const sec = (title, arr, fn) => arr.length ? `<div class="label" style="margin-top:8px">${title} · ${arr.length}</div>${arr.map(fn).join('')}<div style="height:6px"></div>` : '';

  let timer, seq = 0;
  $q.oninput = () => {

const SOC = new Map(); // postId → { likes, liked, comments }
// 게시물 조회 컬럼: select('*') 대신 화면에서 실제 쓰는 칸만 (media jsonb 등 큰 칸이 늘어도 영향 없게)

async function loadSocial(ids) {
  if (!ids.length) return;
  ids.forEach(id => SOC.set(id, { likes: 0, liked: false, comments: 0 }));
  const [l, c] = await Promise.all([
    sb.from('likes').select('post_id, user_id').in('post_id', ids),
    sb.from('comments').select('post_id').in('post_id', ids),
  ]);
  (l.data || []).forEach(r => { const s = SOC.get(r.post_id); s.likes++; if (me && r.user_id === me.id) s.liked = true; });
  (c.data || []).forEach(r => SOC.get(r.post_id).comments++);
}
function paintSoc(id) {
  const s = SOC.get(id); if (!s) return;
  document.querySelectorAll(`[data-like="${id}"]`).forEach(b => { b.querySelector('span').innerHTML = s.liked ? I.heartOn : I.heart; b.querySelector('b').textContent = s.likes || (b.classList.contains('rbtn') ? t('좋아요') : ''); b.setAttribute('aria-pressed', s.liked); });

async function toggleLike(id, only) {

function wireReels($reels) {

  const io = $reels._io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { try { sessionStorage.setItem('candid_reel', e.target.dataset.id); } catch {} } // 이번 세션에서 마지막으로 본 릴스

    if (!e.isIntersecting) return e.target.querySelectorAll('video').forEach(v => v.pause());
    const v = currentVideo(e.target); if (!v) return; // 여러 장이면 지금 보이는 장의 영상만
    v.preload = 'auto'; v.muted = muted; v.play().catch(() => {});

  initCarousels($reels, () => true);
  $reels.querySelectorAll('.rcar .stage').forEach(st => enableZoom(st, { snap: true })); // 사진만 잠깐 확대
  $reels.querySelectorAll('.rcar .stage').forEach(watchReelRatio);

    io.observe(r);
    // 두 번 탭: 좋아요 + 하트 / 한 번 탭(영상): 소리 켜기·끄기
    let last = 0, timer;

      } else { last = now; timer = setTimeout(() => r.querySelector('video') && toggleMute(), 300); }
    });

  });
}

(function pullToRefresh() {

  const ring = ind.querySelector('circle');

  document.body.appendChild(ind);
  const scroller = () => document.querySelector('.reels') || document.scrollingElement;
  const blocked = () => busy || document.querySelector('.sheet-wrap:not(.closing), .overlay, #orbitv, .ostack, .oreel'); // 궤도 화면에서는 당겨서 새로고침 없음

  addEventListener('touchend', async () => {
    if (y0 == null) return; y0 = null;
    if (dy > 120 && !busy) {
      busy = true; ind.classList.add('spin'); ind.style.transform = 'translateY(22px) scale(1)'; ring.style.strokeDasharray = '';
      try { document.querySelector('.reels') ? await renderHome(true) : new URLSearchParams(location.search).get('g') ? await renderGroup(new URLSearchParams(location.search).get('g'), true) : S.uid ? await renderProfile(S.uid, true) : location.reload(); } finally {
        busy = false; ind.classList.remove('spin');

  });
})();

// guard: 배경을 눌러 닫기 전에 호출, false 를 돌려주면 닫지 않음
// opts.top: 위에서 내려오는 패널(상단 메뉴에서 여는 친구 검색 등)
function sheet(html, guard, opts = {}) {
  closeSheet();
  const w = document.createElement('div');
  w.className = 'sheet-wrap' + (opts.top ? ' from-top' : '');
  w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true');
  w.innerHTML = opts.top ? `<div class="sheet">${html}<div class="grab"></div></div>` : `<div class="sheet"><div class="grab"></div>${html}</div>`;
  w._guard = guard || (() => true);
  w.onclick = e => { if (e.target === w && w._guard()) closeSheet(); };
  document.body.appendChild(w);
  dragToClose(w);
  return w;
}
// 시트를 끌어서 닫기: 아래 시트는 아래로, 위 패널은 위로. 110px 이상 또는 빠르게 튕기면 닫힘
function dragToClose(w) {
  const sh = w.querySelector('.sheet');
  const dir = w.classList.contains('from-top') ? -1 : 1;
  // 손가락 아래부터 시트까지, 스크롤되는 칸(시트 안 목록 등)이 하나라도 끝에 있지 않으면 닫기 대신 스크롤
  const edgeOf = el => dir === 1 ? el.scrollTop <= 0 : el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
  let tgt = null;
  const atEdge = () => { for (let el = tgt; el && el !== sh; el = el.parentElement) if (el.scrollHeight > el.clientHeight + 1 && /auto|scroll/.test(getComputedStyle(el).overflowY) && !edgeOf(el)) return false; return edgeOf(sh); };
  let y0 = null, x0 = 0, t0 = 0, dy = 0, dragging = false;
  sh.addEventListener('touchstart', e => {
    tgt = e.target;
    const fromGrab = e.target.closest('.grab');
    if (!fromGrab && (!atEdge() || e.target.closest('textarea, .chips, .epm, .ogrid, .mstrip'))) return y0 = null; // 끌어서 순서 바꾸는 곳은 시트를 끌지 않음
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; t0 = Date.now(); dy = 0; dragging = false;
  }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (y0 == null) return;
    const ny = (e.touches[0].clientY - y0) * dir, nx = e.touches[0].clientX - x0;
    if (!dragging) {
      if (Math.abs(nx) > 10 && Math.abs(nx) > Math.abs(ny)) return y0 = null; // 가로 스와이프(칩 등)는 양보
      if (ny > 6 && atEdge()) { dragging = true; sh.style.transition = 'none'; document.activeElement?.blur?.(); } else return;
    }
    e.preventDefault();
    dy = Math.max(0, ny);
    sh.style.transform = `translateY(${dy * dir}px)`;
    w.style.backgroundColor = `rgba(10,10,10,${0.45 * (1 - Math.min(1, dy / 400))})`;
  }, { passive: false });
  sh.addEventListener('touchend', () => {
    if (!dragging) return y0 = null;
    const fast = dy / Math.max(1, Date.now() - t0) > 0.5;
    y0 = null; dragging = false;
    if ((dy > 110 || (fast && dy > 30)) && w._guard()) return closeSheet();
    sh.style.transition = 'transform .25s cubic-bezier(.32,.72,0,1)'; sh.style.transform = ''; w.style.backgroundColor = '';
  });
}
// 닫기: 아래로 미끄러지며 사라짐 (닫히는 중인 시트는 다른 곳에서 '열린 시트'로 보지 않음)
function closeSheet() {
  const w = document.querySelector('.sheet-wrap:not(.closing)'); if (!w) return;
  const done = w._onClose; w._onClose = null;
  w.classList.add('closing');
  const sh = w.querySelector('.sheet');
  sh.style.transition = 'transform .22s cubic-bezier(.32,.72,0,1)'; sh.style.transform = w.classList.contains('from-top') ? 'translateY(-100%)' : 'translateY(100%)';
  setTimeout(() => w.remove(), 230);
  done?.();
}
addEventListener('keydown', e => { if (e.key === 'Escape') { const w = document.querySelector('.sheet-wrap:not(.closing)'); if (w) { if (w._guard()) closeSheet(); } else document.querySelector('.overlay')?.remove(); } });

// 공급자(광고 회사)를 우선순위대로 꽂아 쓰는 구조: 앞 공급자가 광고를 못 주면 다음 공급자로.
// 새 광고 회사(카카오 애드핏·Meta 등)는 ADS.register({ name, priority, available(), init?(), show(placement) → true/false }) 하나로 추가
// 설정: config.js 의 ADS { enabled, every(몇 장마다), minGapSec(최소 간격), dailyCap(하루 최대), admob { iosInterstitial, testing } }
const ADS = {
  cfg: cfg.ADS || {}, providers: [], count: 0, lastAt: 0, started: false,
  get on() { return !!this.cfg.enabled && !DEMO; },
  register(p) { this.providers.push(p); this.providers.sort((a, b) => a.priority - b.priority); },
  today() { const k = 'candid_ads_' + new Date().toISOString().slice(0, 10); try { return +localStorage.getItem(k) || 0; } catch { return 0; } },
  bumpToday() { const k = 'candid_ads_' + new Date().toISOString().slice(0, 10); try { localStorage.setItem(k, this.today() + 1); } catch {} },
  async start() { if (!this.on || !me || this.started) return; this.started = true; for (const p of this.providers) if (p.available()) await p.init?.().catch(e => console.log('[candid] ad init ' + p.name + ' ' + (e?.message || e))); },
  // Candids 한 장을 봤을 때(1초 이상) 부름: N장마다, 최소 간격·하루 한도 안에서 광고
  async viewed(placement = 'candids') {
    if (!this.on || !me || this.cfg.interstitial === false) return; // 전면 광고 끔(피드 광고만)
    if (++this.count < (this.cfg.every || 8)) return;
    if (Date.now() - this.lastAt < (this.cfg.minGapSec || 90) * 1000 || this.today() >= (this.cfg.dailyCap || 12)) return;
    if (document.querySelector('.sheet-wrap:not(.closing), .composer, .overlay.page')) return; // 무언가 하는 중이면 미룸
    this.count = 0; await this.show(placement);
  },
  async show(placement) {
    for (const p of this.providers) {
      if (!p.available()) continue;
      try { if (await p.show(placement)) { this.lastAt = Date.now(); this.bumpToday(); this.log(p.name, 'impression', placement); return true; } }
      catch (e) { console.log('[candid] ad fail ' + p.name + ' ' + (e?.message || e)); }
    }
    return false;
  },
  log(provider, kind, placement, adId = null) { if (PERF) console.log(`[candid] ad ${kind} ${provider} ${placement}`); sb.rpc('log_ad_event', { p_provider: provider, p_kind: kind, p_placement: placement, p_ad: adId }).then(() => {}, () => {}); },
};
// 하우스 광고 목록(10분 보관) → 가중치로 하나
let HOUSE = { list: null, at: 0 };
async function pickHouseAd() {
  if (!HOUSE.list || Date.now() - HOUSE.at > 10 * 60e3) { const { data, error } = await sb.from('house_ads').select('id, title, body, image_url, url, cta, weight').eq('active', true); HOUSE = { list: error ? [] : data || [], at: Date.now() }; }
  const L = HOUSE.list.filter(a => a.weight > 0); if (!L.length) return null;
  let r = Math.random() * L.reduce((n, a) => n + a.weight, 0); for (const a of L) { if ((r -= a.weight) < 0) return a; } return L[0];
}

ADS.register({
  name: 'admob', priority: 10, ready: false, npa: true,
  testing() { return ADS.cfg.admob.testing ?? !cfg.RELEASE; }, // 개발용 앱에서 실제 광고를 누르면 AdMob 정책 위반 → 시험 광고
  available() { return IN_APP && !!window.Capacitor?.isPluginAvailable?.('AdMob') && !!ADS.cfg.admob?.iosInterstitial; },
  async init() {
    const A = capPlugin('AdMob');
    await A.initialize({ initializeForTesting: this.testing() });
    // 맞춤 광고 동의(앱 추적 투명성, iOS 14+): 아직 안 물어봤으면 한 번 물어봄. 거절해도 일반 광고는 나옴
    let st = (await A.trackingAuthorizationStatus().catch(() => ({})))?.status;
    if (st === 'notDetermined') { await A.requestTrackingAuthorization().catch(() => {}); st = (await A.trackingAuthorizationStatus().catch(() => ({})))?.status; }
    this.npa = st !== 'authorized';
    A.addListener('interstitialAdDismissed', () => { setTimeout(() => this.prepare(), 800); });
    A.addListener('interstitialAdFailedToShow', () => { this.ready = false; this.prepare(); });
    await this.prepare();

  async prepare() {

    catch (e) { this.ready = false; console.log('[candid] admob load ' + (e?.message || e?.code || e)); }
  },
  async show() {
    if (!this.ready) { this.prepare(); return false; } // 아직 못 받았으면 다음 공급자(하우스 광고)로
    this.ready = false; document.querySelectorAll('video').forEach(v => v.pause());

// ---------- 피드 광고: Candids 사진 사이의 광고 자리 ----------
// 자리를 먼저 끼워 두고(feed.first 장 뒤, 그다음 feed.every 장마다), 자리가 가까워지면 공급자 순서대로 채움:
//   ① Google 네이티브 광고(iOS 앱, NativeAds 플러그인이 그 자리 위에 겹쳐 그림) → ② 하우스 광고(웹으로 그 자리에) → 없으면 자리를 뺌
const FEED_ADS = {
  pool: [], loading: false, swipeOn: false,
  admob() { return ADS.providers.find(p => p.name === 'admob'); },
  nativeOk() { const a = this.admob(); return IN_APP && !!window.Capacitor?.isPluginAvailable?.('NativeAds') && (a?.testing() || !!ADS.cfg.admob?.iosNative); },
  async fill() {
    if (!ADS.on || !this.nativeOk() || this.loading || this.pool.length >= 2) return;
    this.loading = true;
    try { const a = this.admob(); const r = await capPlugin('NativeAds').load({ adId: ADS.cfg.admob?.iosNative || '', testing: a.testing(), count: 3, npa: a.npa }); this.pool.push(...(r?.ids || [])); }
    catch (e) { if (PERF) console.log('[candid] native load ' + (e?.message || e?.code || e)); }
    finally { this.loading = false; }
  },
  // 게시물 목록 HTML 사이에 광고 자리 끼우기
  // 광고 자리는 매번 무작위: 첫 광고는 first±1 장 뒤, 그다음은 every-1 ~ every+2 장 간격
  weave(list, render) {
    const f = ADS.cfg.feed; if (!ADS.on || !me || !f) return list.map(render).join('');
    const first = f.first ?? 3, every = f.every ?? 5, rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    let next = Math.max(1, first + rnd(-1, 1));
    return list.map((p, i) => {
      let h = render(p);
      if (i + 1 === next && i < list.length - 1) { h += `<section class="reel adslot"><div class="adph"><span>${t('광고')}</span></div></section>`; next += Math.max(2, every + rnd(-1, 2)); }
      return h;
    }).join('');
  },
  // 한 번 본 광고는 지나가면 없앰(다시 올라와도 안 보임). 위쪽 광고를 없앨 땐 지금 보던 사진이 움직이지 않게 스크롤을 같이 당김
  drop(sec, $reels) {
    if (!sec.isConnected) return;
    const above = sec.offsetTop < $reels.scrollTop, h = sec.offsetHeight;
    if (sec.dataset.kind === 'native') this.hide();
    const snap = $reels.style.scrollSnapType; $reels.style.scrollSnapType = 'none';
    const top = $reels.scrollTop; sec.remove(); if (above) $reels.scrollTo({ top: top - h, behavior: 'instant' });
    requestAnimationFrame(() => { $reels.style.scrollSnapType = snap; });
  },
  async bind(sec) {
    if (sec.dataset.kind) return; sec.dataset.kind = 'wait';
    if (!this.pool.length) await this.fill();
    if (this.pool.length) { sec.dataset.kind = 'native'; sec.dataset.ad = this.pool.shift(); this.fill(); return; }
    const ad = ADS.cfg.house ? await pickHouseAd().catch(() => null) : null;
    if (ad) {
      sec.dataset.kind = 'house';

    setTimeout(maybeShowInstall, 800); // 링크로 들어오면 작성 화면이 먼저 떠서 배너가 밀려 있었음 → 닫은 뒤에 보여줌
  };
  pushLayer('compose', close);
  $('[data-x]').onclick = () => close(false);

  const refresh = () => {
    const opts = [...el.querySelectorAll('#opts input')].map(i => i.value.trim()).filter(Boolean);
    $send.disabled = !(mode === 'media' ? media : mode === 'poll' ? $('#pq').value.trim().length >= 2 && opts.length >= 2 : $('#qq').value.trim().length >= 2);
  };
  const setMode = m => {

    el.querySelectorAll('[data-sec]').forEach(s => s.hidden = s.dataset.sec !== m);
    refresh();
  };
  el.querySelectorAll('.cmp-modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  // 투표 선택지 2~5개
  const addOpt = () => {
    const box = $('#opts'), n = box.children.length; if (n >= 5) return;
    const d = document.createElement('div'); d.className = 'optrow';
    d.innerHTML = `<span>${n + 1}</span><input class="field" maxlength="30" placeholder="${t('선택지 {n}', { n: n + 1 })}">${n >= 2 ? `<button aria-label="${t('선택지 삭제')}">${II.x}</button>` : ''}`;
    d.querySelector('input').oninput = refresh;
    const x = d.querySelector('button'); if (x) x.onclick = () => { d.remove(); [...box.children].forEach((r, i) => r.querySelector('span').textContent = i + 1); $('#addopt').hidden = false; refresh(); };
    box.appendChild(d); $('#addopt').hidden = box.children.length >= 5;
  };
  addOpt(); addOpt();
  $('#addopt').onclick = () => { addOpt(); refresh(); };
  $('#pq').oninput = refresh; $('#qq').oninput = refresh;

  // 여러 장 선택(최대 10장): 한 장씩 준비하고, 2장 이상이면 좌우로 넘기는 미리보기
  // 고른 사진·영상 처리(웹: 파일 입력 / iOS 앱: iPhone 사진 선택창이 준비해 준 목록 preReady)
  const handlePick = async preReady => {
    let files = preReady || [...$file.files]; if (!files.length) return;
    if (files.length > 10) { files = files.slice(0, 10); toast(t('한 번에 10장까지 보낼 수 있어요. 앞 10장만 골랐어요')); }
    const pk = $('#pick');
    pk.classList.remove('has'); pk.classList.add('busy');
    pk.innerHTML = `<span class="cmp-empty"><b>${t('준비 중…')}</b></span>`; pk.appendChild($file);
    $send.disabled = true;
    // 사진은 원본을 바로 미리보기로 보여주고, 줄이기(압축)는 뒤에서 2장씩 진행 → 보내기 누를 때 끝난 걸 씀
    // 영상만 길이·대표 이미지가 있어야 구간 선택을 보여줄 수 있어서 기다림
    const ready = preReady ? [...files] : [], vids = preReady ? 0 : files.filter(f => f.type.startsWith('video/')).length; let vi = 0;
    for (const f of preReady ? [] : files) {
      if (!f.type.startsWith('video/')) { ready.push(quickImage(f)); continue; }
      vi++; pk.querySelector('.cmp-empty b').textContent = vids > 1 ? t('영상 준비 중 ({i}/{n})', { i: vi, n: vids }) : t('영상 준비 중…');
      try { ready.push(await prepareVideoMeta(f)); } catch {}
    }
    pk.classList.remove('busy');
    if (!ready.length) { media = null; pk.querySelector('.cmp-empty').innerHTML = `${I.camera}<b>${t('다시 선택해 주세요')}</b><small>${t('이 파일은 열 수 없어요')}</small>`; return refresh(); }
    if (ready.length < files.length) toast(t('{n}개는 열 수 없어서 뺐어요', { n: files.length - ready.length }));
    freeMedia(media); media = ready;
    media.forEach(m => { if (m.kind === 'video') { m.start = 0; m.end = Math.min(m.duration, MAX_VIDEO_SEC); } });
    paintPicked(0);
  };
  // 고른 사진 그리기(순서 바꾸기·자르기 뒤에도 다시 부름)
  let curPick = 0, cropper = null;
  function paintPicked(goIdx = curPick) {
    const pk = $('#pick');
    curPick = Math.max(0, Math.min(media.length - 1, goIdx));
    const m = media[curPick];
    cropper?.destroy(); cropper = null;
    pk.classList.add('has');
    pk.classList.remove('frame9');
    pk.innerHTML = m.kind === 'video'
      ? `<video src="${m.previewUrl}" poster="${m._tu ||= URL.createObjectURL(m.thumb)}" muted playsinline autoplay loop></video><span class="vbadge">${t('{s}초', { s: Math.round((m.end - m.start) * 10) / 10 })}</span>`
      : `<div class="ccrop"></div>`;
    pk.insertAdjacentHTML('beforeend', `<span class="repick">${t(media.length > 1 ? '다시 고르기' : '바꾸기')}</span>`);
    pk.appendChild($file);
    pk.classList.toggle('frame9', m.kind === 'image');
    if (m.kind === 'image') { m.src0 ||= m.previewUrl; cropper = mountFramer(pk.querySelector('.ccrop'), m.src0, m.edit, async ed => { m.edit = ed; m.edited = true; const r = await renderFrame(m.src0, ed); if (m.edit === ed) { if (m._tu) try { URL.revokeObjectURL(m._tu); } catch {} Object.assign(m, { main: r.main, thumb: r.thumb, job: null, _tu: null }); } paintStrip(); }); }
    paintStrip();
    // 영상 구간 자르기: 지금 보이는 장이 영상이면 아래에 구간 선택 바 표시
    const curIdx = () => curPick;
    const curVideoEl = () => pk.querySelector('video');
    showTrim();
    refresh();
    function showTrim() {
      const m = media[curIdx()], box = $('#trim');
      if (!m || m.kind !== 'video' || !(m.duration > 1)) { box.hidden = true; return; }
      box.hidden = false;
      const D = m.duration, fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
      box.innerHTML = `<div class="trim-head"><b>${t('영상 구간')}</b><span id="trimv"></span></div>
        <div class="trim-bar"><div class="trim-sel" id="tsel"></div>
          <input type="range" class="tr" id="ta" min="0" max="${D}" step="0.1" value="${m.start}" aria-label="${t('시작')}">
          <input type="range" class="tr" id="tb" min="0" max="${D}" step="0.1" value="${m.end}" aria-label="${t('끝')}"></div>
        <small>${t('양쪽 손잡이를 끌어 올릴 부분을 골라요 · 최대 {n}초', { n: MAX_VIDEO_SEC })}</small>`;
      const ta = box.querySelector('#ta'), tb = box.querySelector('#tb'), v = curVideoEl();
      const paint = () => {
        box.querySelector('#tsel').style.left = (m.start / D * 100) + '%';
        box.querySelector('#tsel').style.width = ((m.end - m.start) / D * 100) + '%';
        box.querySelector('#trimv').textContent = `${fmt(m.start)} – ${fmt(m.end)} · ${t('{s}초', { s: Math.round((m.end - m.start) * 10) / 10 })}`;
        const badge = (pk.querySelectorAll('.slide')[curIdx()] || pk).querySelector('.vbadge'); if (badge) badge.textContent = t('{s}초', { s: Math.round((m.end - m.start) * 10) / 10 });
      };
      const onMove = which => {
        let a = +ta.value, b = +tb.value;
        if (which === 'a') { a = Math.min(a, b - 1); if (b - a > MAX_VIDEO_SEC) b = a + MAX_VIDEO_SEC; }
        else { b = Math.max(b, a + 1); if (b - a > MAX_VIDEO_SEC) a = b - MAX_VIDEO_SEC; }
        m.start = Math.max(0, a); m.end = Math.min(D, b); ta.value = m.start; tb.value = m.end;
        if (v) { v.currentTime = which === 'a' ? m.start : Math.max(m.start, m.end - 1); }
        paint();
      };
      ta.oninput = () => onMove('a'); tb.oninput = () => onMove('b');
      // 미리보기는 고른 구간만 반복
      if (v && !v._trimLoop) { v._trimLoop = true; v.addEventListener('timeupdate', () => { const mm = media[curIdx()]; if (mm?.kind === 'video' && (v.currentTime >= mm.end || v.currentTime < mm.start - 0.3)) v.currentTime = mm.start; }); }

    }
  }
  // 아래 줄: 작은 사진들(끌어서 순서 바꾸기, 누르면 그 장으로) + 자르기·회전
  function paintStrip() {

  // 자르기 틀을 만지는 동안에는 사진 칸을 눌러도 사진첩이 열리지 않게

  if (IN_APP && window.Capacitor?.isPluginAvailable?.('MediaPicker')) $('#pick').addEventListener('click', async e => {
    if (e.target.closest('input[type=range], .trim, .ccrop')) return;

    const items = LIB_ON() ? await openLibrary(10) : await nativePick(); if (items?.length) handlePick(items);
  });
  // iOS 앱: 카메라로 바로 찍기(사진 또는 10초 영상)
  const $cam = $('#camb');
  if ($cam) $cam.onclick = async e => { e.preventDefault(); e.stopPropagation(); const items = await nativePick(true); if (items?.length) handlePick(items); };
  // 보내는 사람 선택 버튼
  let who = 'name';
  const setWho = w => {
    const typedNow = $('#author')?.value;
    who = w;
    el.querySelectorAll('.cmp-seg button').forEach(b => { b.classList.toggle('on', b.dataset.who === w); b.setAttribute('aria-checked', b.dataset.who === w); });
    $('#whoval').innerHTML = w === 'anon'
      ? `<div class="who-card"><span class="who-ic anon">${ANON_AV}</span><span><b>${t('익명의 친구')}</b><small>${t('누가 보냈는지 {name}님도 알 수 없어요', { name })}</small></span></div>`
      : me
        ? `<div class="who-card">${avatar(myProf, 'xs')}<span><b>${esc(myProf?.name || '')}</b><small>${myProf?.handle ? '@' + esc(myProf.handle) + ' · ' : ''}${t('내 프로필 이름으로 보내요')}</small></span></div>`
        : `<input class="field" id="author" maxlength="12" placeholder="${t('내 이름 (예: 지수)')}" value="${esc(typedNow ?? nick)}" autocomplete="off">`;
  };
  el.querySelectorAll('.cmp-seg button').forEach(b => b.onclick = () => setWho(b.dataset.who));
  // 한마디: 자동 높이 + 글자 수 + 추천 문구(누르면 채움) + 엔터는 입력 끝
  const $t = $('#text');
  const capFit = () => { $t.style.height = 'auto'; $t.style.height = $t.scrollHeight + 'px'; $('#capcnt').textContent = `${$t.value.length}/80`; $('#capcnt').classList.toggle('on', !!$t.value); };
  $t.oninput = capFit;
  $t.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $t.blur(); } };
  el.querySelectorAll('#sugs button').forEach(b => b.onclick = () => { $t.value = b.textContent; capFit(); el.querySelectorAll('#sugs button').forEach(x => x.classList.toggle('on', x === b)); });
  const capAv = () => {
    const typed = $('#author')?.value.trim();
    $('#capav').innerHTML = who === 'anon' ? ANON_AV : me ? avatar(myProf, 'xs') : esc((typed || t('나')).slice(0, 1));
  };
  el.addEventListener('input', e => { if (e.target.id === 'author') capAv(); });
  el.querySelectorAll('.cmp-seg button').forEach(b => b.addEventListener('click', capAv));
  setWho('name'); capAv();
  setMode(mode);
  if (mode === 'media' && (pick || LIB_ON())) { if (LIB_ON()) openLibrary(10).then(items => { if (items?.length) handlePick(items); }); else $file.click(); } // 누르자마자 사진첩 (웹은 버튼 터치 안에서만 열 수 있음)

  $send.onclick = async () => {
    if (mode === 'media') unlockMedia(media); // iPhone: 누른 순간에 재생 권한 확보(소리 포함 압축용)
    // 보내는 사람: 이름(로그인=내 프로필 / 비로그인=입력한 이름) 또는 익명(로그인이어도 내 계정 정보를 남기지 않음)
    const typed = $('#author')?.value.trim() || '';
    const author = who === 'anon' ? '익명의 친구' : me ? (myProf?.name || '친구').slice(0, 12) : (typed || '익명의 친구');
    const by = who === 'anon' ? { author_name: '익명의 친구', author_id: null } : { author_name: author };
    $send.disabled = true;
    const status = x => { $send.textContent = x; };
    let ins;
    try {
      if (mode === 'poll') {
        status(t('보내는 중…'));
        const opts = [...el.querySelectorAll('#opts input')].map(i => i.value.trim()).filter(Boolean);
        ins = await sb.from('posts').insert({ owner_id: S.uid, media_type: 'poll', mission: '투표', text: $('#pq').value.trim(), poll_options: opts, ...by });
      } else if (mode === 'question') {
        status(t('보내는 중…'));
        ins = await sb.from('posts').insert({ owner_id: S.uid, media_type: 'question', mission: '질문', text: $('#qq').value.trim(), ...by });
      } else {
        // 한 장씩 (영상은 줄인 뒤) 올리고 media 배열로 저장. 첫 장은 image_path 에도 넣어 예전 화면과 호환
        const list = [], n = media.length;
        for (const [i, m] of media.entries()) {
          const tag = n > 1 ? ` (${i + 1}/${n})` : '';
          if (m.job) { status(t('사진 준비 중{tag}…', { tag })); await m.job; } // 뒤에서 줄이던 사진이 아직이면 기다림
          let main = m.main;
          if (m.kind === 'video') {
            status(t('영상 줄이는 중{tag} {p}%', { tag, p: 0 }));
            main = await compressVideo(m, p => status(t('영상 줄이는 중{tag} {p}%', { tag, p: Math.round(p * 100) })));
            if (main.silent) toast(t('이 기기에서는 소리를 담지 못해 소리 없이 올라가요'));
          }
          status(t('올리는 중{tag}…', { tag }));
          const id = crypto.randomUUID();
          const dir = GT ? GT.id : S.uid; // 그룹은 그룹 폴더에
          const path = `${dir}/${id}.${extOf(main)}`, tpath = `${dir}/${id}_t.${extOf(m.thumb)}`;
          await Promise.all([uploadBlob(path, main), uploadBlob(tpath, m.thumb)]);
          list.push({ p: path, t: tpath, k: m.kind });
        }
        ins = GT ? await sb.from('posts').insert({
          group_id: GT.id, author_id: me.id, author_name: (myProf?.name || '친구').slice(0, 12), status: 'approved',
          image_path: list[0].p, thumb_path: list[0].t, media_type: list[0].k, ...(n > 1 ? { media: list } : {}), text: $('#text').value.trim(),
        }) : await sb.from('posts').insert({
          owner_id: S.uid, image_path: list[0].p, thumb_path: list[0].t, media_type: list[0].k,
          ...(n > 1 ? { media: list } : {}), // 1장은 media 칸 없이 (09 SQL 실행 전에도 동작)
          mission: null, text: $('#text').value.trim(), ...by,

    if (GT) { // 그룹: 바로 올라감 → 완료 화면 대신 그룹 화면을 새로 그림

      <button class="btn primary block" id="more">${t('{what} 하나 더 보내기', { what })}</button>
      ${me && !S.isOwner && !myFollows.has(S.uid) ? `<button class="btn add block" id="fol">${t('{name} 친구 추가 · 새 소식을 홈에서 보기', { name })}</button>` : ''}

      ${canInstall() ? `<button class="btn block" id="inst">${t('candid. 앱으로 쓰기')}</button>` : ''}
      <button class="btn block" style="border:0;background:none;color:var(--sub)" id="done">${t('닫기')}</button></div>`;

    const mine = $('#mine'); if (mine) mine.onclick = () => { try { localStorage.setItem('candid_ref', JSON.stringify({ uid: S.uid, name: S.prof.name })); } catch {} location.href = location.pathname; };

// ---------- 푸시 알림 ----------
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

// iOS 앱: iPhone 푸시(APNs). 기기 토큰을 서버(device_tokens, 32 SQL)에 저장하면 notify-owner 가 iPhone 으로도 보냄
const NPUSH = () => IN_APP && window.Capacitor?.isPluginAvailable?.('PushNotifications') ? capPlugin('PushNotifications') : null;
let NPUSH_WAIT = null;
async function nativePushToken(tok) {
  if (PERF) console.log('[candid] apns token ' + tok); // 개발용 앱 점검(시험 알림 보내기용)
  try { localStorage.setItem('candid_apns', tok); } catch {}
  if (me && !DEMO) { const { error } = await sb.rpc('register_device', { p_token: tok }); if (error) console.error('[candid] register_device', error.message); }
  NPUSH_WAIT?.(tok); NPUSH_WAIT = null;
}
async function pushState() {
  if (NPUSH()) {
    const p = (await NPUSH().checkPermissions()).receive;
    if (p === 'denied') return 'denied';
    let on = false; try { on = !!localStorage.getItem('candid_apns') && localStorage.getItem('candid_apns_off') !== '1'; } catch {}
    return p === 'granted' && on ? 'on' : 'off';
  }
  if (inApp) return 'in-app';
  if (isIOS && !isStandalone) return 'ios-install';
  if (!pushSupported || !cfg.VAPID_PUBLIC_KEY) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  return sub ? 'on' : 'off';
}
async function updateBell() {
  const b = document.getElementById('bell'); if (!b) return;
  const st = await pushState().catch(() => 'off');
  b.innerHTML = st === 'on' ? I.bellOn : I.bell + (st === 'unsupported' ? '' : '<span class="dot"></span>');

// 알림 구독(권한 요청 포함). 권한 요청은 버튼을 누른 순간에만 가능(브라우저 규칙)
async function enablePush() {

    try { localStorage.removeItem('candid_apns_off'); } catch {}
    const got = new Promise((res, rej) => { NPUSH_WAIT = res; setTimeout(() => rej(new Error(t('알림 설정 실패'))), 15000); });
    await NPUSH().register();
    await got; return;
  }
  if (Notification.permission !== 'granted' && await Notification.requestPermission() !== 'granted') throw new Error(t('알림 권한이 허용되지 않았어요'));
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(cfg.VAPID_PUBLIC_KEY) });
  const j = sub.toJSON();
  const { error } = await sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_id: me.id });

}

// ---------- 알림 (종 아이콘) ----------
// 따로 저장하는 테이블 없이 모아서 보여줌: 받은 게시물(승인 대기)·좋아요·댓글·스티커 꾸미기·나를 친구 추가. 최근 30일

const notiSeen = () => { try { return +localStorage.getItem(notiKey()) || 0; } catch { return 0; } };
async function fetchNotis(force) {
  if (!me) return [];

  // 서버에서 한 번에(26 SQL). 없으면 아래 예전 방식(여러 번 차례로 조회)
  if (NOTI.rpc !== false) {
    const { data, error } = await sb.rpc('my_notifications', { p_limit: 60 });
    if (!error && Array.isArray(data)) return finishNotis(data.map(r => ({ k: r.k, at: r.at, uid: r.uid, body: r.body, post: r.post, group: r.group, prof: r.prof, name: r.nm })));
    if (error) NOTI.rpc = false; // 26 SQL 전(함수 없음) 등: 예전 방식으로
  }

  const NCOLS = 'id, status, author_name, author_id, mission, media_type, image_path, thumb_path, media, text, created_at';
  const { data: own, error } = await sb.from('posts').select(NCOLS).eq('owner_id', me.id).order('created_at', { ascending: false }).limit(100);
  if (error) throw error;
  // 그룹: 내가 올린 그룹 사진(좋아요·댓글·꾸미기) + 내가 방장인 그룹의 참여 신청. 18 SQL 전이면 건너뜀
  await loadMyGroups().catch(() => {});
  const ownedG = myGroupList().filter(g => g.owner_id === me.id).map(g => g.id);
  const [gp, gj] = MYG.ok ? await Promise.all([
    sb.from('posts').select(NCOLS + ', group_id').eq('author_id', me.id).not('group_id', 'is', null).order('created_at', { ascending: false }).limit(60),
    ownedG.length ? sb.from('group_members').select('group_id, user_id, created_at').in('group_id', ownedG).eq('status', 'pending').limit(50) : Promise.resolve({ data: [] }),
  ]).catch(() => [{}, {}]) : [{}, {}];
  const posts = [...own, ...(gp.data || [])];
  const byId = new Map(posts.map(p => [p.id, p]));
  const ids = posts.filter(p => p.status === 'approved').map(p => p.id);
  const q = (t, cols) => ids.length ? sb.from(t).select(cols).in('post_id', ids).neq('user_id', me.id).gte('created_at', since).order('created_at', { ascending: false }).limit(100) : Promise.resolve({ data: [] });
  const [lk, cm, st, fl] = await Promise.all([
    q('likes', 'post_id, user_id, created_at'),
    q('comments', 'post_id, user_id, body, created_at'),
    q('post_stickers', 'post_id, user_id, created_at'),
    sb.from('follows').select('follower_id, created_at').eq('followee_id', me.id).gte('created_at', since).order('created_at', { ascending: false }).limit(50),
  ]);

  (lk.data || []).forEach(r => items.push({ k: 'like', at: r.created_at, uid: r.user_id, post: byId.get(r.post_id) }));
  (cm.data || []).forEach(r => items.push({ k: 'comment', at: r.created_at, uid: r.user_id, post: byId.get(r.post_id), body: r.body }));
  // 스티커: 같은 사람이 같은 사진에 10분 안에 붙인 건 하나로

    const key = r.user_id + r.post_id, g = grp.get(key), ts = new Date(r.created_at).getTime();
    if (g && g.first - ts < 6e5) { g.n++; g.first = ts; return; }
    const it = { k: 'sticker', at: r.created_at, uid: r.user_id, post: byId.get(r.post_id), n: 1, first: ts };
    grp.set(key, it); items.push(it);
  });
  (fl.data || []).forEach(r => items.push({ k: 'follow', at: r.created_at, uid: r.follower_id }));
  (gj.data || []).forEach(r => items.push({ k: 'gjoin', at: r.created_at, uid: r.user_id, group: MYG.groups.get(r.group_id) }));

  const profs = new Map();
  if (uids.length) { const { data } = await sb.from('profiles').select('id, name, handle, avatar_url').in('id', uids); (data || []).forEach(p => profs.set(p.id, p)); }

}
// 알림 정리(공통): 스티커는 같은 사람·같은 사진·10분 안이면 하나로, 이름, 최신순 60개, 안 읽은 수
function finishNotis(raw, grouped) {
  let items = raw;
  if (!grouped) {
    items = []; const grp = new Map();
    [...raw].sort((a, b) => new Date(b.at) - new Date(a.at)).forEach(r => {
      if (r.k !== 'sticker') return items.push(r);
      const key = r.uid + (r.post?.id || ''), g = grp.get(key), ts = new Date(r.at).getTime();
      if (g && g.first - ts < 6e5) { g.n++; g.first = ts; return; }
      const it = { ...r, n: 1, first: ts }; grp.set(key, it); items.push(it);
    });
  }
  items = items.filter(i => !i.uid || !BLOCKED.has(i.uid)); // 차단한 사람의 알림은 숨김
  items.forEach(i => { i.name = i.prof?.name || (i.name === '익명의 친구' ? t(i.name) : i.name) || t('친구'); });
  items.sort((a, b) => new Date(b.at) - new Date(a.at));
  NOTI.items = items.slice(0, 60); NOTI.at = Date.now();
  const seen = notiSeen();
  NOTI.unread = NOTI.items.filter(i => new Date(i.at).getTime() > seen).length;
  return NOTI.items;
}

async function openNotis() {

      const p = i.post, thumb = p && !isText(p) && mediaOf(p).length ? `<img class="nthumb" src="${thumbUrl(p)}" alt="" loading="lazy">` : '';
      const av = i.prof ? avatar(i.prof, 'xs') : `<div class="av xs">${esc((i.name || '?').slice(0, 1))}</div>`;
      const fol = i.k === 'follow' && !myFollows.has(i.uid) ? `<button class="btn add nfol" data-fol="${i.uid}">${t('맞친구')}</button>`
        : i.k === 'ginvite' && i.group ? `<span class="ninv"><button class="btn primary nfol" data-acc="${x}">${t('수락')}</button><button class="btn nfol" data-dec="${x}">${t('거절')}</button></span>` : '';
      return `<button class="nrow${new Date(i.at).getTime() > seen ? ' new' : ''}" data-i="${x}">${av}<span class="ntx">${notiText(i)}<small>${ago(i.at)}</small></span>${fol || thumb}</button>`;
    }).join('');
    $l.querySelectorAll('[data-fol]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleFollow(b.dataset.fol); b.remove(); });
    $l.querySelectorAll('[data-acc], [data-dec]').forEach(b => b.onclick = e => { e.stopPropagation(); const it = items[+(b.dataset.acc ?? b.dataset.dec)]; b.closest('.ninv').remove(); answerInvite(it.group.id, !!b.dataset.acc, it.group.handle); });
    $l.querySelectorAll('.nrow').forEach(b => b.onclick = () => openNoti(items[+b.dataset.i]));
  };
  if (NOTI.items) paint(NOTI.items);
  try { paint(await fetchNotis(true)); }
  catch (e) { if (!NOTI.items && el.isConnected) $l.innerHTML = `<p class="hint" style="padding:24px 20px">${esc(kerr(e))}</p>`; }
}
// 알림 하나를 눌렀을 때: 그 화면·그 게시물로
function openNoti(i) {
  if (i.k === 'follow') { closeSheet(); return go(feedUrl(i.uid)); }
  if (i.k === 'post') { closeSheet(); return i.post?.id ? go(`${location.pathname}?u=${me.id}&tab=inbox&p=${i.post.id}`) : openInbox(); }
  if (i.k === 'gjoin') { closeSheet(); return i.group && go(`${gUrl(i.group)}&manage=1`); }
  if (i.k === 'ginvite') { closeSheet(); return go('?groups=1'); } // 내 그룹 페이지 맨 위 '받은 초대'에서 수락·거절
  if (!i.post) return toast(t('지금은 볼 수 없는 게시물이에요'));
  if (i.post.group_id) { // 그룹 사진: 그룹으로 가서 그 사진 열기
    const g = MYG.groups.get(i.post.group_id) || (i.post.ghandle ? { id: i.post.group_id, handle: i.post.ghandle } : null);
    if (!g) return toast(t('지금은 볼 수 없는 게시물이에요'));
    closeSheet(); return go(`${gUrl(g)}&p=${i.post.id}`);
  }
  closeSheet();
  withMyFeed(() => {
    if (!findPost(i.post.id)) return toast(t('지금은 볼 수 없는 게시물이에요'));
    openPost(i.post.id);
    if (i.k === 'comment') setTimeout(() => { const c = document.querySelector('.overlay .pbtn[data-cmt]'); if (c) focusPostComments(c); }, 300);
  });
}

// ---------- 앱 초대 ----------
// 초대 링크 ?invite=아이디(또는 id): 받은 사람은 '앱 설치하고 시작하기' 한 번 → 설치 안내, 가입하면 초대한 친구와 자동으로 친구
const INVITE = (() => {
  const v = new URLSearchParams(location.search).get('invite');
  if (v && /^[A-Za-z0-9_-]{3,40}$/.test(v)) { try { localStorage.setItem('candid_invite', v); } catch {} return v; }
  return null;
})();
// 메시지+링크 복사용: 메시지 바로 다음 줄에 링크. (카톡으로 보내기는 글에 링크를 넣지 않고 url 로 따로 넘겨 미리보기 카드로만)
const withLink = (msg, url) => `${msg.trim()}\n${url}`;
const inviteUrl = () => `${SITE}${location.pathname}?invite=${encodeURIComponent(myProf?.handle || me.id)}&v=${OGV}`;
async function findInviter(key) {
  const isId = /^[0-9a-f-]{36}$/i.test(key);
  const { data } = await sb.from('profiles').select('id, name, handle, avatar_url').eq(isId ? 'id' : 'handle', isId ? key : key.toLowerCase()).maybeSingle();
  return data || null;
}
async function renderInvite(key) {
  let inviter = null; try { inviter = await withTimeout(findInviter(key), 6000); } catch {}
  renderLanding(inviter);
}
// 설치 버튼: 카톡 등 인앱 → Safari·Chrome 으로(설치 안내 + 초대 정보 유지), 그 외 → 바로 설치/안내
function installNow() {
  if (installed()) return toast(t('이미 앱으로 쓰고 있어요'));
  if (inApp) return openExternal(installUrl());
  if (installEvt) return startInstall();
  showInstallGuide();
  if (!isIOS && !/android/i.test(UA)) toast(t('브라우저 메뉴에서 "앱 설치" 또는 "홈 화면에 추가"를 눌러 주세요'));
}
// 로그인 후: 초대한 친구를 내 친구로 (한 번만)
async function applyInvite() {
  let key = null; try { key = localStorage.getItem('candid_invite'); } catch {}
  if (!key || !me) return false;
  try { localStorage.removeItem('candid_invite'); } catch {}
  const inv = await findInviter(key).catch(() => null);
  if (!inv || inv.id === me.id || myFollows.has(inv.id)) return false;
  const { error } = await sb.from('follows').insert({ follower_id: me.id, followee_id: inv.id });
  if (error) return false;
  myFollows.add(inv.id);
  setTimeout(() => toast(t('{name}님과 친구가 됐어요', { name: inv.name })), 1200);
  return true;
}
// 초대 보내기
function openInvite() {
  if (!me) return;
  const msg = t('candid. 같이 하자 📸\n서로 찍어 준 사진으로 피드를 채우는 앱이야. 이 링크로 들어오면 우리 바로 친구 돼!');
  msgShareSheet({ head: 'Invite friends', hint: t('이 링크로 가입하면 나와 자동으로 친구가 돼요.'), msg, url: inviteUrl });
}

// 전체 화면 설치 안내: Android 는 '설치' 버튼 한 번, iPhone 은 공유 버튼 위치를 화살표로
function showInstallGuide() {
  if (installed() || inApp || document.querySelector('.iguide')) return;
  const iosVer = +((UA.match(/OS (\d+)_/) || [])[1] || 0);
  const chromeIOS = /CriOS/i.test(UA);
  const otherIOS = isIOS && /CriOS|FxiOS|EdgiOS|Whale|NAVER|DaumApps|SamsungBrowser|OPiOS|YaBrowser/i.test(UA); // Safari 가 아닌 iPhone 브라우저
  const android = /android/i.test(UA);
  if (!isIOS && !android) return; // 데스크톱은 하단 배너·메뉴로 충분
  const el = document.createElement('div'); el.className = 'iguide'; el.setAttribute('role', 'dialog');
  const step = (n, html) => `<li><span class="k">${n}</span><span>${html}</span></li>`;
  const sh = `<b class="ib">${I.iosShare}</b>`;
  let steps, arrow = '';
  if (android) {
    steps = step(1, t('아래 <b>앱 설치</b> 버튼을 눌러요')) + step(2, t('홈 화면의 <b>candid.</b> 아이콘으로 열어요')) + step(3, t('카카오로 <b>한 번만</b> 로그인하면 끝!'));
  } else if (chromeIOS) {
    steps = step(1, t('주소창 오른쪽 공유 {icon} 를 눌러요', { icon: sh })) + step(2, t('<b>홈 화면에 추가</b>를 눌러요')) + step(3, t('홈 화면의 <b>candid.</b>을 열고 카카오로 <b>한 번만</b> 로그인'));
    arrow = 'top';
  } else if (iosVer >= 26) {
    steps = step(1, t('오른쪽 아래 <b class="ib">⋯</b> 를 눌러요')) + step(2, t('<b>공유</b> {icon} → <b>홈 화면에 추가</b>', { icon: sh })) + step(3, t('<b>추가</b>를 누르고, 홈 화면의 <b>candid.</b>을 열어 카카오로 <b>한 번만</b> 로그인'));
    arrow = 'right';
  } else {
    steps = step(1, t('아래 가운데 공유 {icon} 를 눌러요', { icon: sh })) + step(2, t('목록을 내려 <b>홈 화면에 추가</b>')) + step(3, t('<b>추가</b>를 누르고, 홈 화면의 <b>candid.</b>을 열어 카카오로 <b>한 번만</b> 로그인'));
    arrow = 'center';
  }
  el.innerHTML = `<button class="ig-x" aria-label="${t('닫기')}">${I.close}</button>
    <img class="ig-ic" src="brand/icon-180.png?v=3" alt="">
    <h2>${t('홈 화면에 추가하기')}</h2>
    <p>${t('앱처럼 바로 열리고, 친구가 사진을 보내면 알림이 와요.')}</p>
    ${otherIOS ? `<button class="btn primary block" id="igsafari" style="margin-bottom:18px">${t('Safari로 열기 (추천)')}</button><p class="ig-sub" style="margin:-8px 0 20px">${t('안 열리면 아래 방법으로 여기서 바로 추가해도 돼요')}</p>` : ''}
    <ol>${steps}</ol>
    ${android ? `<button class="btn primary block" id="iginst"${installEvt ? '' : ' disabled'}>${installEvt ? t('앱 설치') : t('설치 준비 중…')}</button>
      <p class="ig-sub" id="igalt"${installEvt ? ' hidden' : ''}>${t('버튼이 계속 안 눌리면 오른쪽 위 <b>⋮</b> → <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>')}</p>` : ''}
    ${arrow ? `<div class="ig-arrow ${arrow}" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M5 12l7 7 7-7"/></svg></div>` : ''}`;
  el.querySelector('.ig-x').onclick = () => el.remove();
  const sf = el.querySelector('#igsafari');
  if (sf) sf.onclick = () => tryOpen(safariUrl(installUrl()), () => toast(t('Safari를 열 수 없어요. 아래 방법으로 추가해 주세요')));
  document.body.appendChild(el);
  if (android) {

// ---------- 로그인 방법 연결 (카카오 + Google 을 한 계정에) ----------
// 연결해 두면 둘 중 아무거나로 로그인해도 같은 계정. Supabase Auth 설정에서 Manual linking 을 켜야 동작
async function openLinks() {
  const w = sheet(`<h3>Sign-in methods<i class="pd">.</i></h3>
    <p class="hint">${t('여러 로그인 방법을 이 계정에 연결해 두면, 어떤 방법으로 로그인해도 같은 피드로 들어와요.')}</p>
    <div id="lk"><p class="hint">${t('불러오는 중…')}</p></div>`);
  const $l = w.querySelector('#lk');
  if (!sb.auth.getUserIdentities) return $l.innerHTML = `<p class="hint">${t('데모 모드에서는 사용할 수 없어요.')}</p>`;
  const { data, error } = await sb.auth.getUserIdentities();
  if (error) return $l.innerHTML = `<p class="hint">${esc(kerr(error))}</p>`;
  const have = new Set((data?.identities || []).map(i => i.provider));
  const rows = (cfg.PROVIDERS || ['kakao', 'google']).map(p => `
    <div class="frow"><span class="lk-ic ${p}">${I[p] || I.google}</span><span style="flex:1"><b>${PROVIDER_NAME[p]}</b><small>${t(have.has(p) ? '연결됨' : '연결 안 됨')}</small></span>
      ${have.has(p) ? `<span class="lk-ok">${II.check}</span>` : `<button class="btn add" data-p="${p}">${t('연결하기')}</button>`}</div>`).join('');
  $l.innerHTML = rows + `<p class="hint" style="font-size:12px;margin-top:12px">${t("'이미 다른 계정에서 사용 중'이라고 나오면, 그 로그인 방법으로 만들어진 다른 계정이 있다는 뜻이에요. 그 계정을 먼저 삭제해야 연결할 수 있어요.")}</p>`;
  $l.querySelectorAll('[data-p]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = t('이동 중…');
    try { localStorage.setItem('candid_last_login', b.dataset.p); } catch {}
    const { error } = IN_APP ? await nativeOAuth(b.dataset.p, true).then(() => ({ error: null }), e => ({ error: e }))
      : await sb.auth.linkIdentity({ provider: b.dataset.p, options: { redirectTo: location.origin + location.pathname } });
    if (error) {
      b.disabled = false; b.textContent = t('연결하기');
      toast(/manual linking|disabled/i.test(error.message) ? t('아직 연결 기능이 꺼져 있어요(관리자 설정 필요)')
        : /already|exists|linked/i.test(error.message) ? t('이미 다른 계정에서 사용 중인 로그인이에요') : kerr(error));
    }
  });
}

  if (!FILLS.has(url)) FILLS.set(url, new Promise(res => {

      const avg = (y0, y1) => { const d = x.getImageData(0, y0, N, y1 - y0).data; let r = 0, g = 0, b = 0, n = 0; for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; } return [r / n, g / n, b / n].map(v => Math.round(v * .85)); }; // 살짝 어둡게(글씨가 잘 보이게)

// 썸네일 → 원본 교체: 지금 보이는 장과 다음 장만(나머지는 넘길 때)
function upgradeFull(root, idx = 0) {
  const slides = root.querySelectorAll('.slide');
  const targets = slides.length ? [slides[idx], slides[idx + 1]].filter(Boolean).map(s => s.querySelector('img[data-full]')) : [root.querySelector('img[data-full]')];
  targets.filter(Boolean).forEach(img => {
    const full = img.dataset.full; delete img.dataset.full;
    const pre = new Image(); pre.decoding = 'async';
    pre.onload = () => { img.src = full; img.classList.remove('lq'); };
    pre.src = full;

}
// 썸네일에 손가락이 닿는 순간(떼기 전) 원본을 미리 받기 시작
addEventListener('pointerdown', e => {
  const b = e.target.closest('[onclick*="openPost("]'); if (!b) return;
  const id = b.getAttribute('onclick').match(/openPost\('([^']+)'/)?.[1]; const p = id && findPost(id); if (!p) return;
  const m = mediaOf(p)[0]; if (m && m.k !== 'video') { const i = new Image(); i.src = photoUrl(m.p); }

// 여러 장이면 좌우로 넘기는 슬라이드(인스타처럼 점 + 1/3)
function mediaCarousel(p, mode) {

  if (items.length <= 1) return `<div class="carwrap" data-idx="0"><div class="stage">${items[0] ? mediaEl(items[0], mode, alt) : ''}${stickerLayer(p.id, 0)}</div></div>`;
  return `<div class="carwrap multi" data-idx="0">
    <div class="car" data-car>${items.map((m, i) => `<div class="slide"><div class="stage">${mediaEl(m, mode, alt)}${stickerLayer(p.id, i)}</div>${mode === 'reel' ? `<span class="rmulti" aria-label="${t('{n}장 중 {i}번째', { n: items.length, i: i + 1 })}">${I.multi}<b>${i + 1}/${items.length}</b></span>` : ''}</div>`).join('')}</div>
    <span class="car-n">1/${items.length}</span>

// 현재 보이는 장의 영상만 재생
const currentVideo = scope => { const w = scope.querySelector('.carwrap'); if (!w) return null; const slides = w.querySelectorAll('.slide'); return (slides.length ? slides[+w.dataset.idx || 0] : w).querySelector('video'); };
function initCarousels(root, autoplay) {
  root.querySelectorAll('[data-car]').forEach(car => {
    const w = car.closest('.carwrap');
    let last = 0;
    // 항상 첫 장부터: 사진이 늦게 불러와져 칸 크기가 바뀌면 iPhone 은 다른 장으로 맞춰 버림(scroll-snap 재정렬)
    // → 사용자가 직접 넘기기 전까지는 크기가 바뀔 때마다 첫 장으로 되돌림
    let touched = false;
    const mark = () => { touched = true; };
    ['pointerdown', 'touchstart', 'wheel', 'keydown'].forEach(ev => car.addEventListener(ev, mark, { passive: true, once: true }));
    const first = () => { if (!touched && car.scrollLeft) car.scrollLeft = 0; };
    first(); requestAnimationFrame(first); setTimeout(first, 150); setTimeout(first, 500);
    car.querySelectorAll('img, video').forEach(m => m.addEventListener(m.tagName === 'IMG' ? 'load' : 'loadedmetadata', first, { once: true }));

    car.addEventListener('scroll', () => {
      const i = Math.round(car.scrollLeft / car.clientWidth); if (i === last) return; last = i;
      w.dataset.idx = i;
      if (w.querySelector('img[data-full]')) upgradeFull(w, i);

}

  const $ = s => el.querySelector(s);
  // 최신 상태 불러오기(그 사이 다른 친구가 붙인 것도 보이게) — select('*') 라 아직 안 생긴 칸이 있어도 동작

    sb.from('post_stickers').select('*').eq('post_id', postId),
    GACHA_ON ? sb.from('inventory').select('item_id').eq('user_id', me.id) : Promise.resolve({ data: [] }),
  ]);

  const who = new Map();

    const { data } = await sb.from('profiles').select('id, name, handle').in('id', [...new Set(others.map(r => r.user_id))]);

  };
  // 트레이: 움직이는 이모지 + 이모지 (+ 가챠 스티커). 은퇴한 스티커(텍스트·미니 그림 등)는 안 보임
  const tile = i => `<button class="dts${i.data.anim ? ' anim' : ''}" data-item="${i.id}" aria-label="${t('{name} 붙이기', { name: esc(i.name) })}">${glyph(i)}</button>`;
  const live = FREE_STICKERS.filter(i => !i.data.retired);
  $('#dtray').innerHTML =
    `<div class="dsec">${t('움직이는 이모지')}</div><div class="dgrid">${live.filter(i => i.data.anim).map(tile).join('')}</div>` +
    (owned.length ? `<div class="dsec">${t('내가 뽑은 스티커')}</div><div class="dgrid">${owned.map(tile).join('')}</div>` : '') +
    `<div class="dsec">${t('이모지')}</div><div class="dgrid">${live.filter(i => !i.data.anim).map(tile).join('')}</div>` +
    `<p class="dcredit">Animated emoji: Google Noto Emoji · CC BY 4.0</p>`;

  // 한 게시물에 1개: 이미 붙인 게 있으면 같은 자리에서 모양만 바꿈(저장할 때 예전 것을 떼고 새로 붙임)
  const pick = item_id => {
    const cur = mine.find(r => r.id === sel) || mine[0];
    if (cur) {

      const r = { ...cur, id: newId(), item_id, tmp: true };
      if (!cur.tmp) removed.add(cur.id);

    if (totalPost - removed.size >= MAX_POST) return toast(t('이 게시물은 스티커가 꽉 찼어요({n}개)', { n: MAX_POST }));

  const setRot = (r, a) => { a = ((a + 180) % 360 + 360) % 360 - 180; r.rot = Math.round(a); spanOf(r.id)?.style.setProperty('--r', r.rot + 'deg'); };

      step = '옮기기';
      for (const r of mine.filter(r => !r.tmp)) {
        const o = orig.get(r.id), patch = {};
        KEYS.forEach(k => { if ((o?.[k] ?? null) !== (r[k] ?? null)) patch[k] = k === 'x' || k === 'y' ? +r[k].toFixed(4) : r[k]; });
        if (!Object.keys(patch).length) continue;
        patch.updated_at = new Date().toISOString();
        const { error } = await sb.from('post_stickers').update(patch).eq('id', r.id);
        if (error) throw error;
      }
      await loadStickers([postId]); refreshStickerLayers(postId);
      el.remove(); toast(t('꾸몄어요'));
    } catch (err) {
      btn.disabled = false; btn.textContent = t('저장');
      const msg = String(err?.message || err), code = err?.code ? `[${err.code}] ` : '';
      console.error('sticker save failed', step, err);
      toast(/row-level|42501/i.test(msg) ? t('스티커를 붙일 수 없어요(한 게시물에 1개, 전체 100개까지예요)')
        // 칸이 없다는 오류만 '준비 중'으로(예전엔 'text' 가 들어간 다른 오류까지 잘못 걸렸음). 그 외엔 원인을 그대로 보여줌
        : /(could not find|does not exist).*\b(rot|text|style)\b/i.test(msg) ? t('텍스트·회전 기능 준비 중이에요') + ` ${code}`
        : `${t('저장 실패')}(${t(step)}): ${code}${msg}`.slice(0, 160));
    }
  };
  paint();
}
