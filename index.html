    const pill = (label, active, fn) => `<button onclick="${fn}" style="border:0;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;white-space:nowrap;background:${active ? 'var(--bg)' : 'transparent'};color:${active ? 'var(--fg)' : 'var(--bg)'}">${label}</button>`;
    bar.innerHTML = `<span style="opacity:.6;margin-right:6px">DEMO</span>${pill('주인장 시점', on, "demoView(1)")}${pill('친구 시점', !on, "demoView(0)")}${pill('↺', false, "demoReset()")}`;
    document.body.appendChild(bar);
    document.getElementById('toast').style.bottom = '76px';
    document.body.style.paddingBottom = '72px';
  });
  window.demoView = v => { ss.set('demo_login', v ? '1' : '0'); location.href = location.pathname + '?u=demo'; };
  window.demoReset = () => { try { sessionStorage.clear(); } catch {} location.href = location.pathname; };

  return {
    auth: {
      getSession: async () => ({ data: { session: loggedIn() ? { user: ME } : null } }),
      signInWithOAuth: async () => { ss.set('demo_login', '1'); location.href = location.pathname; },
      signOut: async () => ss.set('demo_login', '0'),
    },
    from, rpc,
    storage: { from: () => ({
      getPublicUrl: p => ({ data: { publicUrl: files[p] || p } }),
      upload: async (p, blob) => { files[p] = await toDataUrl(blob); return { error: null }; },
      remove: async () => ({ error: null }),
    }) },
    _files: files,
  };
}

// ---------- 미디어 최적화 (업로드 전 휴대폰에서 압축) ----------
const MAX_VIDEO_SEC = 10;
// 캔버스를 이미지로: WebP 지원 기기는 WebP(더 작음), 아니면 JPEG
async function canvasBlob(c, q) {
  const webp = await new Promise(r => c.toBlob(r, 'image/webp', q));
  if (webp && webp.type === 'image/webp') return webp;
  return new Promise(r => c.toBlob(r, 'image/jpeg', q + 0.04));
}
function drawScaled(src, w0, h0, max) {
  const s = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}
const extOf = b => ({ 'image/webp': 'webp', 'image/jpeg': 'jpg', 'video/mp4': 'mp4', 'video/webm': 'webm', 'video/quicktime': 'mov' })[b.type.split(';')[0]] || 'bin';

// 사진: 본문 1080px(약 150~300KB) + 그리드용 썸네일 480px(약 25~40KB)
async function prepareImage(file) {
  const img = await decodeFile(file);
  const main = await canvasBlob(drawScaled(img, img.width, img.height, 1080), 0.8);
  const thumb = await canvasBlob(drawScaled(img, img.width, img.height, 480), 0.7);
  return { kind: 'image', main, thumb, previewUrl: URL.createObjectURL(main) };
}

// iPhone Safari 는 재생 전엔 영상 데이터를 안 불러와서 무한 대기할 수 있음 → 모든 단계에 시간제한
const within = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), ms))]);
function loadVideo(file) {
  return within(new Promise((ok, no) => {
    const v = document.createElement('video');
    v.preload = 'auto'; v.muted = true; v.playsInline = true;
    v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
    v.onloadedmetadata = () => ok(v); v.onerror = () => no(new Error('video'));
    v.src = URL.createObjectURL(file); v.load();
  }), 8000);
}
const seek = (v, t) => within(new Promise(r => { v.onseeked = () => r(); v.currentTime = t; }), 3000);
// 첫 장면을 그릴 수 있게 데이터 불러오기: 소리 없이 잠깐 재생했다 멈춤
async function primeVideo(v) {
  try { await within(v.play(), 2000); } catch {}
  v.pause();
  if (v.readyState < 2) await within(new Promise(r => v.addEventListener('loadeddata', r, { once: true })), 2500).catch(() => {});
}
// 대표 이미지를 못 뽑았을 때 쓰는 기본 이미지(어두운 배경 + ▶)
async function fallbackPoster() {
  const c = document.createElement('canvas'); c.width = 480; c.height = 600; const g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 480, 600); bg.addColorStop(0, '#1a1f3a'); bg.addColorStop(1, '#2b50ff'); g.fillStyle = bg; g.fillRect(0, 0, 480, 600);
  g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.moveTo(205, 255); g.lineTo(205, 345); g.lineTo(285, 300); g.closePath(); g.fill();
  return canvasBlob(c, 0.8);
}

// 영상 고르기: 미리보기용 정보와 대표 이미지(포스터)만 먼저 준비. 실제 압축은 '보내기' 누를 때(소리 녹음에 사용자 터치가 필요)
async function prepareVideoMeta(file) {
  let v = null, thumb = null;
  try {
    v = await loadVideo(file);
    await primeVideo(v);
    await seek(v, Math.min(0.15, (isFinite(v.duration) ? v.duration : 1) / 2)).catch(() => {});
    if (v.videoWidth) thumb = await canvasBlob(drawScaled(v, v.videoWidth, v.videoHeight, 720), 0.72);
  } catch {}
  if (!thumb || thumb.size < 2000) thumb = await fallbackPoster(); // 검은 화면이거나 실패
  const duration = v && isFinite(v.duration) ? v.duration : MAX_VIDEO_SEC;
  return { kind: 'video', file, duration, w: v?.videoWidth || 0, h: v?.videoHeight || 0, thumb, previewUrl: v?.src || URL.createObjectURL(file), main: null };
}

// 영상 압축: 720p·약 1.6Mbps 로 다시 인코딩(앞 10초까지). 10초 기준 약 2~3MB
async function compressVideo(meta, onProgress) {
  const limit = Math.min(meta.duration || MAX_VIDEO_SEC, MAX_VIDEO_SEC);
  const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = window.MediaRecorder && HTMLCanvasElement.prototype.captureStream && types.find(t => MediaRecorder.isTypeSupported(t));
  const original = () => {
    if (meta.duration <= MAX_VIDEO_SEC + 0.5 && meta.file.size <= 10 * 1024 * 1024 && /^video\/(mp4|webm|quicktime)/.test(meta.file.type)) return meta.file;
    throw new Error('이 기기에서는 영상을 줄일 수 없어요. 10초·10MB 이하 영상으로 골라 주세요');
  };
  if (!mime) return original();

  let v; try { v = await loadVideo(meta.file); } catch { return original(); }
  if (!v.videoWidth) { await primeVideo(v); if (!v.videoWidth) return original(); }
  v.muted = false; v.volume = 1; // 소리는 녹음용 오디오 그래프로만 보내고 스피커엔 연결하지 않음
  const c = drawScaled(v, v.videoWidth, v.videoHeight, 720), g = c.getContext('2d');
  const stream = c.captureStream(30);
  let actx;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const dest = actx.createMediaStreamDestination();
    actx.createMediaElementSource(v).connect(dest);
    dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    await actx.resume();
  } catch {}
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1_600_000, audioBitsPerSecond: 96_000 });
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);

  let stop = false;
  const draw = () => {
    if (stop) return;
    g.drawImage(v, 0, 0, c.width, c.height);
    onProgress?.(Math.min(1, v.currentTime / limit));
    if (v.currentTime >= limit || v.ended) { stop = true; v.pause(); rec.state !== 'inactive' && rec.stop(); return; }
    v.requestVideoFrameCallback ? v.requestVideoFrameCallback(draw) : requestAnimationFrame(draw);
  };
  await seek(v, 0).catch(() => {});
  rec.start(250);
  try { await v.play(); } catch { stop = true; rec.stop(); await done; actx?.close(); return original(); }
  draw();
  const guard = setTimeout(() => { if (!stop) { stop = true; v.pause(); rec.state !== 'inactive' && rec.stop(); } }, (limit + 6) * 1000);
  await done; clearTimeout(guard); actx?.close();
  const out = new Blob(chunks, { type: mime.split(';')[0] });
  // 다시 인코딩한 게 더 크면(이미 작은 영상) 원본 사용
  if (!out.size) return original();
  try { if (out.size >= meta.file.size) return original(); } catch {}
  return out;
}

// 업로드: 경로는 랜덤 UUID라 내용이 안 바뀜 → 브라우저 캐시 1년(재방문 시 전송량 0)
async function uploadBlob(path, blob) {
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType: blob.type.split(';')[0], cacheControl: '31536000' });
  if (error) throw error;
}
const thumbUrl = p => photoUrl(p.thumb_path || p.image_path);
const isVideo = p => p.media_type === 'video';

// 정사각형으로 가운데 잘라서 축소 (프로필 사진용)
async function resizeSquare(file, size) {
  const img = await decodeFile(file), side = Math.min(img.width, img.height);
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

// 글자 단위 줄바꿈 (한글은 띄어쓰기가 적어서 글자 단위가 자연스러움), 넘치면 말줄임
function wrapLines(g, text, maxW, maxLines) {
  const lines = []; let cur = '';
  for (const ch of [...text]) {
    if (g.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch.trimStart(); } else cur += ch;
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].replace(/.$/, '…'); }
  return lines;
}

// 투표·질문 스토리: 사진 자리에 블루 카드로 내용 그리기
function drawTextCard(g, p, x, y, w, h) {
  g.fillStyle = p.media_type === 'poll' ? '#2b50ff' : '#0a0a0a'; g.fillRect(x, y, w, h);
  g.fillStyle = 'rgba(255,255,255,.6)'; g.font = '800 28px Pretendard, sans-serif'; g.fillText(p.media_type === 'poll' ? 'POLL' : 'Q&A', x + 48, y + 80);
  g.fillStyle = '#fff'; g.font = '800 54px Pretendard, sans-serif';
  const ql = wrapLines(g, (p.media_type === 'question' ? 'Q. ' : '') + p.text, w - 96, 4);
  ql.forEach((ln, i) => g.fillText(ln, x + 48, y + 170 + i * 68));
  let yy = y + 190 + ql.length * 68;
  if (p.media_type === 'poll') {
    const s = POLL.get(p.id) || { counts: p.poll_options.map(() => 0), total: 0 };
    p.poll_options.forEach((o, i) => {
      const pct = s.total ? Math.round(s.counts[i] / s.total * 100) : 0;
      g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x + 48, yy, w - 96, 72);
      g.fillStyle = 'rgba(255,255,255,.45)'; g.fillRect(x + 48, yy, (w - 96) * pct / 100, 72);
      g.fillStyle = '#fff'; g.font = '700 30px Pretendard, sans-serif'; g.fillText(wrapLines(g, o, w - 260, 1)[0], x + 72, yy + 47);
      g.textAlign = 'right'; g.fillText(pct + '%', x + w - 72, yy + 47); g.textAlign = 'left';
      yy += 86;
    });
  } else if (p.answer) {
    g.fillStyle = 'rgba(255,255,255,.75)'; g.font = '600 40px Pretendard, sans-serif';
    wrapLines(g, 'A. ' + p.answer, w - 96, 5).forEach((ln, i) => g.fillText(ln, x + 48, yy + 20 + i * 54));
  }
}

// 인스타 스토리용 1080x1920 이미지 — 위 250px/아래 300px은 인스타 UI가 덮으므로 비워 둠
async function makeStory(id) {
  closeSheet();
  const p = S.approved.find(x => x.id === id); if (!p) return;
  toast('스토리 이미지를 만드는 중…');
  await Promise.all([document.fonts.load('800 80px "Bricolage Grotesque"'), document.fonts.load('800 40px Pretendard')]).catch(() => {});
  let img = null;
  if (!isText(p)) { try { img = await loadImg(isVideo(p) ? thumbUrl(p) : photoUrl(p.image_path)); } catch { return toast('사진을 불러오지 못했어요. 다시 시도해 주세요'); } }
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
  const g = c.getContext('2d');
  const cover = (W, H) => { const r = Math.max(W / img.width, H / img.height), sw = W / r, sh = H / r; return [(img.width - sw) / 2, (img.height - sh) / 2, sw, sh]; };

  // 배경: 사진을 아주 작게 그렸다 키워서 블러 효과 → 사진마다 다른 톤 (모든 브라우저에서 동작)
  if (img) {
    const t = document.createElement('canvas'); t.width = 27; t.height = 48;
    t.getContext('2d').drawImage(img, ...cover(27, 48), 0, 0, 27, 48);
    g.imageSmoothingQuality = 'high'; g.drawImage(t, 0, 0, 1080, 1920);
    g.fillStyle = 'rgba(255,255,255,.72)'; g.fillRect(0, 0, 1080, 1920);
  } else { const bg = g.createLinearGradient(0, 0, 1080, 1920); bg.addColorStop(0, '#eef1ff'); bg.addColorStop(1, '#ffffff'); g.fillStyle = bg; g.fillRect(0, 0, 1080, 1920); }

  // 로고 + 부제
  g.textAlign = 'left'; g.font = '800 80px "Bricolage Grotesque", sans-serif';
  const lw = g.measureText('candid').width, dw = g.measureText('.').width, lx = 540 - (lw + dw) / 2;
  g.fillStyle = '#0a0a0a'; g.fillText('candid', lx, 330); g.fillStyle = '#2b50ff'; g.fillText('.', lx + lw, 330);
  g.textAlign = 'center'; g.fillStyle = '#3a3a3c'; g.font = '700 34px Pretendard, sans-serif';
  g.fillText(`친구가 본 ${S.prof.name}`, 540, 392);

  // 폴라로이드 카드 (랜딩 콜라주와 같은 구조)
  g.save(); g.translate(540, 960); g.rotate(-0.02);
  g.shadowColor = 'rgba(0,0,0,.18)'; g.shadowBlur = 70; g.shadowOffsetY = 24;
  g.fillStyle = '#fff'; g.fillRect(-360, -510, 720, 1040); g.shadowColor = 'transparent';
  if (img) g.drawImage(img, ...cover(640, 800), -320, -470, 640, 800);
  else drawTextCard(g, p, -320, -470, 640, 800);
  g.textAlign = 'left'; g.fillStyle = '#2b50ff'; g.font = '800 26px Pretendard, sans-serif';
  g.fillText(p.mission || '', -320, 382);
  g.fillStyle = '#0a0a0a'; g.font = '800 44px Pretendard, sans-serif';
  const lines = p.text && !isText(p) ? wrapLines(g, p.text, 640, 2) : [];
  lines.forEach((ln, i) => g.fillText(ln, -320, 438 + i * 54));
  g.fillStyle = '#8e8e93'; g.font = '600 26px Pretendard, sans-serif';
  g.fillText(`— ${p.author_name}`, -320, lines.length > 1 ? 512 : lines.length ? 488 : 430);
  g.restore();

  // 하단 CTA 알약 — 인스타 링크 스티커를 여기에 붙이면 좋음
  g.fillStyle = '#2b50ff'; g.beginPath(); g.roundRect ? g.roundRect(170, 1560, 740, 96, 48) : g.rect(170, 1560, 740, 96); g.fill();
  g.fillStyle = '#fff'; g.font = '700 32px Pretendard, sans-serif'; g.textAlign = 'center';
  g.fillText('나한테도 사진 보내줘 → 링크 클릭', 540, 1619);

  const blob = await new Promise(res => c.toBlob(res, 'image/png'));
  const file = new File([blob], 'candid-story.png', { type: 'image/png' });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch {} }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  toast('이미지를 저장했어요. 스토리에 올리고 링크 스티커로 내 피드 링크를 붙여 보세요');
}
