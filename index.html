<style>
  :root {
    --bg:#fff; --card:#fff; --fg:#0a0a0a; --sub:#8e8e93; --line:#ececec; --soft:#f5f5f5; --accent:#2b50ff; --danger:#ff3b30;
    --display:"Bricolage Grotesque", "Pretendard", sans-serif;
    --sans:"Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#000; --card:#141416; --fg:#f5f5f7; --sub:#8e8e93; --line:#2c2c30; --soft:#1c1c1f; --accent:#5c7cff; --danger:#ff6961;
  } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font-family:var(--sans); font-size:14px; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; cursor:pointer; }
  svg { display:block; }
  .app { max-width:480px; margin:0 auto; min-height:100vh; }
  .display { font-family:var(--display); font-weight:700; letter-spacing:-.03em; }
  .logo { font-family:var(--display); font-weight:800; font-size:26px; background:none; border:0; padding:0; letter-spacing:-.05em; }
  .logo i { color:var(--accent); font-style:normal; }

  /* 상단바 */
  .top { position:sticky; top:0; z-index:5; display:flex; align-items:center; height:calc(56px + env(safe-area-inset-top)); padding:env(safe-area-inset-top) 20px 0; background:color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .top .sp { flex:1; }
  .icon-btn { position:relative; background:none; border:0; padding:8px; margin-left:4px; border-radius:50%; }
  .icon-btn:hover { background:var(--soft); }
  .dot { position:absolute; top:4px; right:4px; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 2px var(--bg); }
  .dot.red { top:5px; right:6px; width:9px; height:9px; background:#ff3b30; }

  /* 프로필 */
  .head { text-align:center; padding:20px 20px 0; }
  .ring { display:inline-block; padding:3px; border-radius:50%; border:1.5px solid var(--accent); }
  .av { width:88px; height:88px; border-radius:50%; object-fit:cover; display:flex; align-items:center; justify-content:center; background:var(--soft); font-family:var(--display); font-weight:700; font-size:34px; color:var(--sub); }
  .av.sm { width:34px; height:34px; font-size:16px; flex:none; }
  .av-def { overflow:hidden; padding:0; }
  .av-def svg { display:block; }
  .setup { padding:12px 20px 40px; }
  .setup h1 { font-family:var(--display); font-weight:800; font-size:40px; line-height:1; letter-spacing:-.05em; margin:12px 0 10px; }
  .setup h1 em { color:var(--accent); font-style:normal; }
  .setup .hint { color:var(--sub); margin:0 0 8px; line-height:1.55; }
  .avopts { display:flex; gap:18px; margin:0 0 24px; }
  .avopt { display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:0; padding:0; font-size:12px; color:var(--sub); cursor:pointer; }
  .avopt .sel { display:block; padding:3px; border-radius:50%; border:2px solid transparent; transition:border-color .15s; }
  .avopt .av { width:64px; height:64px; overflow:hidden; color:var(--sub); }
  .avopt.on { color:var(--fg); font-weight:600; }
  .avopt.on .sel { border-color:var(--accent); }
  .name { font-family:var(--display); font-weight:700; font-size:30px; line-height:1.1; letter-spacing:-.03em; margin:14px 0 4px; }
  .desc { color:var(--sub); font-size:13px; }
  .desc.bio { color:var(--fg); font-size:14px; line-height:1.45; max-width:300px; margin:0 auto; word-break:keep-all; white-space:pre-line; }
  .bio-empty { background:none; border:1px dashed var(--line); border-radius:999px; padding:6px 14px; margin-top:2px; }
  .stats { display:flex; margin:22px 0 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .stats > div { flex:1; padding:14px 0; }
  .stats > div + div { border-left:1px solid var(--line); }
  .stats b { display:block; font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:-.02em; margin-bottom:4px; line-height:1; }
  .stats span { font-size:11px; color:var(--sub); letter-spacing:.04em; }
  .actions { display:flex; gap:8px; padding:18px 20px; }
  .btn { flex:1; border:1px solid var(--line); border-radius:999px; padding:12px 16px; font-weight:600; font-size:14px; background:var(--card); transition:transform .1s; }
  .btn:active { transform:scale(.98); }
  .btn.primary { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .btn.block { display:block; width:100%; }
  .btn:disabled { opacity:.5; }

  /* 탭 */
  .tabs { display:flex; gap:24px; padding:0 20px; border-bottom:1px solid var(--line); }
  .tabs button { background:none; border:0; border-bottom:1.5px solid transparent; margin-bottom:-1px; padding:12px 0; color:var(--sub); font-size:13px; font-weight:600; }
  .tabs button.on { color:var(--fg); border-bottom-color:var(--fg); }
  .tabs .n { color:var(--accent); margin-left:3px; }

  /* 그리드 */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding-top:2px; }
  .grid button { padding:0; border:0; aspect-ratio:4/5; background:var(--soft); overflow:hidden; }
  .grid img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s, opacity .3s; }
  .grid button:hover img { transform:scale(1.03); opacity:.92; }

  /* 빈 상태 */
  .empty { padding:48px 28px 56px; text-align:center; }
  .empty h2 { font-family:var(--display); font-weight:700; font-size:28px; letter-spacing:-.04em; margin:0 0 8px; line-height:1.15; }
  .empty p { color:var(--sub); margin:0 0 24px; line-height:1.6; }
  .ideas { display:flex; flex-direction:column; gap:8px; margin:0 0 24px; text-align:left; }
  .idea { display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:14px; }
  .idea .k { font-family:var(--display); font-weight:800; color:var(--accent); font-size:18px; width:18px; }

  /* 승인함 */
  .note { padding:14px 20px; color:var(--sub); font-size:12px; }
  .row { display:flex; gap:14px; margin:0 20px 10px; padding:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .row img { width:60px; height:75px; object-fit:cover; border-radius:8px; flex:none; cursor:pointer; }
  .row .meta { flex:1; min-width:0; line-height:1.45; }
  .row .meta .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .meta small { color:var(--sub); }
  .row .ab { display:flex; flex-direction:column; gap:6px; }
  .row .ab .btn { padding:7px 14px; flex:none; font-size:13px; }
  .mtag { display:inline-block; font-size:11px; font-weight:600; color:var(--accent); letter-spacing:.02em; }

  /* 게시물 상세 */
  .overlay { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.62); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; animation:fade .2s; }
  @keyframes fade { from { opacity:0; } }
  .post { width:100%; max-width:440px; max-height:100vh; overflow:auto; background:var(--card); }
  @media (min-width:481px) { .post { border-radius:20px; max-height:92vh; } }
  .post-h { display:flex; align-items:center; gap:10px; padding:12px 12px 12px 16px; }
  .post-h .who { flex:1; line-height:1.3; }
  .post-h .who b { display:block; font-size:14px; }
  .post-img { width:100%; aspect-ratio:4/5; object-fit:cover; display:block; background:var(--soft); }
  .post-c { padding:20px 20px 8px; }
  .quote { font-family:var(--display); font-weight:600; font-size:24px; line-height:1.3; letter-spacing:-.03em; margin:6px 0 10px; word-break:keep-all; }
  .quote::before { content:"“"; color:var(--accent); }
  .quote::after { content:"”"; color:var(--accent); }
  .by { color:var(--sub); font-size:13px; }
  .post-f { display:flex; align-items:center; padding:8px 12px 14px 20px; color:var(--sub); font-size:12px; }
  .post-f .sp { flex:1; }

  /* 바텀시트 */
  .sheet-wrap { position:fixed; inset:0; z-index:30; background:rgba(10,10,10,.45); display:flex; align-items:flex-end; justify-content:center; animation:fade .2s; }
  .sheet { width:100%; max-width:480px; max-height:94vh; overflow:auto; background:var(--bg); border-radius:24px 24px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom)); animation:up .34s cubic-bezier(.32,.72,0,1); }
  @keyframes up { from { transform:translateY(100%); } }
  .grab { width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 18px; }
  .sheet h3 { font-family:var(--display); font-weight:700; font-size:28px; letter-spacing:-.04em; margin:0 0 4px; line-height:1.1; }
  .sheet .hint { color:var(--sub); margin:0 0 20px; font-size:13px; }
  .label { font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.08em; margin:0 0 8px; }
  .chips { display:flex; gap:6px; overflow-x:auto; margin:0 -20px 20px; padding:0 20px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:13px; white-space:nowrap; }
  .chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .pick { display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center; aspect-ratio:4/5; max-height:46vh; margin:0 auto 16px; border-radius:16px; border:1.5px dashed var(--line); background:var(--card); color:var(--sub); cursor:pointer; overflow:hidden; font-size:13px; }
  .pick img { width:100%; height:100%; object-fit:cover; }
  .field { width:100%; padding:14px 16px; font:inherit; font-size:16px; border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--fg); margin-bottom:10px; outline:none; }
  .field:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .menu { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:10px; }
  .menu-item { display:block; width:100%; text-align:center; padding:16px; border:0; border-top:1px solid var(--line); background:none; font-size:15px; }
  .menu-item:first-child { border-top:0; }
  .menu-item.danger { color:var(--danger); font-weight:600; }

  /* 랜딩 */
  .landing { min-height:100vh; display:flex; flex-direction:column; padding:28px 24px calc(28px + env(safe-area-inset-bottom)); }
  .landing .hero { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .snap:nth-child(2) { animation-delay:.1s; } .snap:nth-child(3) { animation-delay:.2s; }
  .snap small { color:#8e8e93 !important; }
  .snap .mt { display:block; margin:8px 2px 0; font-size:9px; font-weight:700; color:#2b50ff; }
  .snap .mt + p { margin-top:2px; }
  @keyframes drop { from { opacity:0; translate:0 -28px; } }
  @media (prefers-reduced-motion: reduce) { .snap, .sheet, .grid button.fresh { animation:none !important; } }
  .collage { position:relative; height:280px; margin:8px 0 32px; }
  .snap { position:absolute; width:150px; padding:8px 8px 12px; background:#fff; color:#0a0a0a; animation:drop .7s cubic-bezier(.2,1.3,.4,1) backwards; border-radius:4px; box-shadow:0 10px 30px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06); }
  .snap .ph { aspect-ratio:4/5; border-radius:2px; }
  .snap p { margin:8px 2px 0; font-size:12px; font-weight:600; }
  .snap small { display:block; margin:2px 2px 0; color:var(--sub); font-size:10px; }
  .snap:nth-child(1) { left:2%; top:26px; transform:rotate(-7deg); }
  .snap:nth-child(2) { left:50%; top:0; transform:translateX(-50%) rotate(2deg); z-index:2; }
  .snap:nth-child(3) { right:2%; top:38px; transform:rotate(8deg); }
  .snap:nth-child(1) .ph { background:linear-gradient(160deg,#f6d5c4,#e9967a); }
  .snap:nth-child(2) .ph { background:linear-gradient(160deg,#d9dfe8,#8fa3bf); }
  .snap:nth-child(3) .ph { background:linear-gradient(160deg,#e8e2c8,#b8a970); }
  .landing h1 { font-family:var(--display); font-weight:800; font-size:50px; line-height:.95; margin:0 0 14px; letter-spacing:-.055em; }
  .landing h1 em, .empty h2 em { color:var(--accent); font-style:normal; }
  .landing .tagline { color:var(--sub); line-height:1.6; margin:0 0 32px; font-size:15px; }
  .social { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border-radius:999px; padding:15px; font-weight:600; font-size:15px; margin-bottom:10px; border:0; }
  .social.kakao { background:#FEE500; color:rgba(0,0,0,.85); }
  .social.google { background:var(--card); border:1px solid var(--line); }
  .fine { color:var(--sub); font-size:12px; margin:14px 0 0; text-align:center; line-height:1.6; }

  .toast { position:fixed; left:50%; bottom:32px; transform:translate(-50%, 10px); z-index:50; background:var(--fg); color:var(--bg); padding:12px 18px; border-radius:999px; font-size:13px; font-weight:600; opacity:0; transition:.25s; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; transform:translate(-50%, 0); }
  .toast.show.act { pointer-events:auto; }
  .toast-act { background:none; border:0; padding:0 0 0 10px; margin-left:8px; border-left:1px solid color-mix(in srgb, var(--bg) 30%, transparent); color:inherit; font-weight:800; text-decoration:underline; text-underline-offset:3px; }
  /* 인앱 브라우저 안내 */
  .inapp { display:flex; gap:10px; align-items:flex-start; padding:14px 16px; margin:0 0 16px; border-radius:16px; background:var(--soft); text-align:left; font-size:13px; line-height:1.5; }
  .inapp b { display:block; font-size:14px; margin-bottom:2px; }
  .inapp .btn { flex:none; padding:8px 12px; font-size:12px; }
  /* 업로드 시트: 보내기 버튼 하단 고정 */
  .sheet-foot { position:sticky; bottom:calc(-24px - env(safe-area-inset-bottom)); margin:6px -20px calc(-24px - env(safe-area-inset-bottom)); padding:12px 20px calc(16px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); }
  .pick { position:relative; }
  .pick video { width:100%; height:100%; object-fit:cover; }
  .vbadge { position:absolute; left:10px; top:10px; padding:5px 10px; border-radius:999px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; font-weight:700; }
  .repick { position:absolute; right:10px; bottom:10px; padding:6px 12px; border-radius:999px; background:rgba(0,0,0,.6); color:#fff; font-size:12px; font-weight:600; backdrop-filter:blur(6px); }
  .asked { margin:-8px 0 16px; padding:10px 14px; border-radius:12px; background:var(--soft); font-size:13px; }
  .asked b { color:var(--accent); }
  .row .ab .btn { min-height:40px; }
  .chip { min-height:38px; }
  .pending-acts { display:flex; gap:8px; padding:4px 16px 16px; }
  .thumb { flex:none; padding:0; border:0; background:none; border-radius:10px; overflow:hidden; }
  .row img { width:72px; height:90px; border-radius:10px; }
  .row.leaving { transition:opacity .2s, transform .2s; opacity:0; transform:translateX(-24px); }
  /* 그리드: 보낸 친구 이름 */
  .grid button { position:relative; }
  .grid button::after { content:""; position:absolute; inset:auto 0 0; height:38%; background:linear-gradient(transparent, rgba(0,0,0,.32)); pointer-events:none; }
  .vplay { position:absolute; right:7px; top:7px; z-index:1; color:#fff; filter:drop-shadow(0 1px 4px rgba(0,0,0,.4)); }
  .grid .from { position:absolute; left:7px; right:7px; bottom:6px; z-index:1; font-size:10px; font-weight:600; line-height:1.2; color:#fff; text-align:left; text-shadow:0 1px 6px rgba(0,0,0,.35); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grid button.fresh { animation:fresh 1.4s ease-out; }
  .grid button.fresh { outline:3px solid transparent; outline-offset:-3px; }
  @keyframes fresh { 0%,40% { outline-color:var(--accent); } 100% { outline-color:transparent; } }
  .grid button:active img { transform:scale(.97); }
  .mchip { display:inline-block; padding:3px 9px; border-radius:999px; background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent); font-size:11px; font-weight:700; }
  .msg-box { width:100%; min-height:84px; resize:none; line-height:1.5; font-size:15px; }
  .spin { display:flex; justify-content:center; padding:120px 0; }
  /* 친구 추가 버튼 */
  .btn.add { background:transparent; color:var(--accent); border-color:var(--accent); }
  .av.xs { width:30px; height:30px; flex:none; font-size:13px; }
  .frow { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .frow a { flex:1; display:flex; align-items:center; gap:12px; color:inherit; text-decoration:none; min-width:0; }
  .frow .av.xs { width:44px; height:44px; }
  .frow small { display:block; color:var(--sub); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .frow .btn { flex:none; padding:8px 14px; font-size:13px; }
  /* 댓글 */
  .clist { min-height:120px; }
  .crow { display:flex; gap:10px; padding:10px 0; font-size:14px; line-height:1.45; }
  .crow small { color:var(--sub); font-size:11px; }
  .cdel { flex:none; align-self:center; background:none; border:0; color:var(--sub); font-size:12px; }
  .cbar { display:flex; gap:8px; align-items:center; }
  .cbar .field { flex:1; }
  .cbar .btn { flex:none; }
  /* 게시물 상세 좋아요·댓글 */
  .psoc { display:flex; gap:16px; padding:2px 16px 0; }
  .pbtn { display:flex; align-items:center; gap:6px; background:none; border:0; padding:6px 4px; font-weight:700; font-size:14px; }
  .pbtn svg { width:24px; height:24px; }

  /* 홈 릴스 */
  .reels { position:fixed; inset:0 0 auto 0; top:0; z-index:10; overflow-y:auto; scroll-snap-type:y mandatory; background:#000; color:#fff; overscroll-behavior:contain; scrollbar-width:none; }
  .reels::-webkit-scrollbar { display:none; }
  .rtop { position:fixed; top:0; left:50%; transform:translateX(-50%); z-index:12; width:100%; max-width:480px; display:flex; align-items:center; gap:4px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px 18px; background:linear-gradient(rgba(0,0,0,.45), transparent); }
  .rtop .sp { flex:1; } .rtop .logo { color:#fff; } .rtop .icon-btn { color:#fff; }
  .rme { display:block; margin-left:6px; border-radius:50%; box-shadow:0 0 0 2px #fff; }
  .reel { position:relative; height:100vh; height:100dvh; max-width:480px; margin:0 auto; overflow:hidden; scroll-snap-align:start; scroll-snap-stop:always; }
  .rbg { position:absolute; inset:-60px; background-size:cover; background-position:center; filter:blur(36px) brightness(.5); }
  .rmedia { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .reel::after { content:""; position:absolute; inset:auto 0 0; height:42%; background:linear-gradient(transparent, rgba(0,0,0,.65)); pointer-events:none; }
  .rinfo { position:absolute; z-index:2; left:16px; right:84px; bottom:calc(26px + env(safe-area-inset-bottom)); text-shadow:0 1px 8px rgba(0,0,0,.4); }

      <p class="hmsg" id="hmsg">영문 소문자·숫자·밑줄(_) 3~20자. 친구 검색과 공유 링크에 쓰여요.</p>` : ''}
      <div class="label">MESSAGE</div>
      <input class="field" id="bio" maxlength="60" value="${esc(myProf.bio || '')}" placeholder="예: 굴욕샷 환영, 단 너무 심한 건 거절함 📸">
      <div style="height:10px"></div>
      <button class="btn primary block" id="done">${first ? '시작하기' : '저장'}</button>
    </div>`;

  const $ = s => $app.querySelector(s);
  // 아이디 실시간 확인: 형식 → 예약어 → 중복(0.3초 뒤 서버 확인)
  let hdOk = true;
  const hdState = (msg, ok) => {
    const m = $('#hmsg'); if (!m) return;
    m.textContent = msg; m.className = 'hmsg' + (ok === true ? ' ok' : ok === false ? ' bad' : '');
    hdOk = ok === true; $('#done').disabled = !hdOk;
  };
  const $hd = $('#hd');
  if ($hd) {
    let t, seq = 0;
    $hd.oninput = () => {
      const v = $hd.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
      if (v !== $hd.value) $hd.value = v;
      clearTimeout(t); seq++;
      if (v === myProf.handle) return hdState('지금 쓰고 있는 아이디예요', true);
      if (!HANDLE_RE.test(v)) return hdState('영문 소문자·숫자·밑줄(_) 3~20자로 만들어 주세요', false);
      if (RESERVED.includes(v)) return hdState('쓸 수 없는 아이디예요', false);
      hdState('확인 중…', null);
      const my = seq;
      t = setTimeout(async () => {
        const { data, error } = await sb.from('profiles').select('id').eq('handle', v).maybeSingle();
        if (my !== seq) return;
        if (error) return hdState(kerr(error), false);
        data && data.id !== me.id ? hdState('이미 있는 아이디예요', false) : hdState('사용할 수 있어요 ✓', true);
      }, 300);
    };
  }
  const currentUrl = () => choice === 'social' ? social : choice === 'custom' ? customUrl : null;
  const paint = () => {
    $('#preview').innerHTML = avatar({ avatar_url: currentUrl() });
    $('#customThumb').innerHTML = customUrl ? `<img class="av" src="${esc(customUrl)}" alt="">` : `<span class="av">${I.camera}</span>`;
    $app.querySelectorAll('.avopt').forEach(o => o.classList.toggle('on', o.dataset.c === choice));
  };
  paint();
  $app.querySelectorAll('button.avopt').forEach(o => o.onclick = () => { choice = o.dataset.c; paint(); });
  $('#avfile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    customBlob = await resizeSquare(f, 400);
    customUrl = URL.createObjectURL(customBlob); choice = 'custom'; paint();
  };
  $('#skip').onclick = async () => {
    if (first) { await sb.from('profiles').update({ onboarded: true }).eq('id', me.id); myProf.onboarded = true; }
    route();
  };
  $('#done').onclick = async e => {
    e.target.disabled = true; e.target.textContent = '저장 중…';
    try {
      let url = currentUrl();
      if (choice === 'custom' && customBlob) {
        const path = `${me.id}/${crypto.randomUUID()}.jpg`;
        const up = await sb.storage.from('avatars').upload(path, customBlob, { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
        url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      }
      const patch = { name: $('#nm').value.trim() || myProf.name, bio: $('#bio').value.trim() || null, avatar_url: url, onboarded: true };
      if ($('#hd') && hdOk && $('#hd').value !== myProf.handle) patch.handle = $('#hd').value;
      const { error } = await sb.from('profiles').update(patch).eq('id', me.id);
      if (error && /23505|duplicate|unique/i.test((error.code || '') + error.message)) { hdState('이미 있는 아이디예요. 다른 걸로 해주세요', false); throw new Error('dup'); }
      if (error) throw error;
      if (patch.handle) { HANDLES.set(patch.handle, me.id); CACHE.prof.delete(me.id); }
      Object.assign(myProf, patch);
      toast(first ? '환영해요!' : '프로필을 저장했어요');
      route();
    } catch (err) { e.target.disabled = false; e.target.textContent = first ? '시작하기' : '저장'; if (err.message !== 'dup') toast(kerr(err)); }
  };
}

function tabOf(t) { return t === 'inbox' || t === 'friends' ? t : 'grid'; }
const S = { tab: tabOf(new URLSearchParams(location.search).get('tab')) };

async function renderProfile(uid, fresh) {
  CUR = pageKey();
  const myKey = CUR;
  // 한 번 본 피드는 저장해 둔 화면을 바로 보여주고, 최신 데이터는 뒤에서 받아 갱신
  const cached = CACHE.prof.get(uid);
  if (cached && !fresh) { Object.assign(S, cached, { uid }); if (!S.isOwner) S.tab = 'grid'; paintProfile(); }
  let res;
  try {
    res = await withTimeout(Promise.all([
      sb.from('profiles').select('*').eq('id', uid).maybeSingle(),
      sb.from('posts').select('*').eq('owner_id', uid).order('created_at', { ascending: false }),
    ]), 10000);
  } catch { return cached ? undefined : renderError(() => renderProfile(uid)); }
  if (pageKey() !== myKey) return; // 그 사이 다른 화면으로 이동함
  const [{ data: prof, error: e1 }, { data: posts, error: e2 }] = res;
  if (e1 || e2) return cached ? undefined : renderError(() => renderProfile(uid)); // 네트워크 오류를 '없는 피드'로 오인하지 않도록
  if (!prof) {
    $app.innerHTML = `<div class="landing"><span class="logo">${LOGO}</span><div class="hero"><h1>Not found<i class="pd">.</i></h1>
      <p class="tagline">존재하지 않는 피드예요. 링크가 정확한지 확인해 주세요.</p><button class="btn primary block" onclick="go(location.pathname)">내 피드 만들기</button></div></div>`;
    return;
  }
  const sig = JSON.stringify([prof, posts.map(p => [p.id, p.status, p.answer, p.approved_at])]);
  if (cached && cached.sig === sig && !fresh) { S.fetchedAt = Date.now(); return; } // 바뀐 게 없으면 다시 그리지 않음
  S.uid = uid; S.prof = prof; S.isOwner = me?.id === uid; S.fetchedAt = Date.now();
  S.approved = posts.filter(p => p.status === 'approved');
  S.pending = posts.filter(p => p.status === 'pending');
  await loadPolls(S.approved).catch(() => {});
  await loadStickers(S.approved.filter(p => !isText(p)).map(p => p.id)).catch(() => {});
  if (!S.isOwner) S.tab = 'grid';
  CACHE.prof.set(uid, { prof, isOwner: S.isOwner, approved: S.approved, pending: S.pending, sig });
  paintProfile();
  // 공유 링크(?m=미션번호)로 들어온 친구: 사진 보내기 시트를 바로 열어줌 (한 번만)
  const m = new URLSearchParams(location.search).get('m');
  if (!S.isOwner && m !== null && !S.autoOpened) { S.autoOpened = true; openCompose(Math.max(0, Math.min(MISSIONS.length - 1, +m || 0)), true, 'media', false); }
}

      <div class="stats">

        : me

          ? `<button class="btn ${myFollows.has(uid) ? '' : 'add'}" onclick="toggleFollow('${uid}', this)">${myFollows.has(uid) ? '친구 ✓' : '친구 추가'}</button>`
          // 로그인 안 한 친구(공유 링크로 들어옴): 하단 바가 없으니 보내기 버튼 유지
          : `<button class="btn primary" onclick="openCompose()">📷 ${esc(prof.name)} 피드 채워주기</button>`}
    </div>
    ${!isOwner && !me ? `<p style="text-align:center;margin:-6px 0 16px;font-size:13px;color:var(--sub)">나도 친구들한테 받아보고 싶다면? <a href="${location.pathname}" style="color:var(--fg);font-weight:600">내 피드 만들기</a></p>` : ''}
    <nav class="tabs">
      <button class="${S.tab === 'grid' ? 'on' : ''}" onclick="setTab('grid')">피드</button>
      ${isOwner ? `<button class="${S.tab === 'inbox' ? 'on' : ''}" onclick="setTab('inbox')">대기 피드${pending.length ? `<span class="n">${pending.length}</span>` : ''}</button>` : ''}
    </nav>

  $app.classList.toggle('has-nav', !!me);
  renderBody();

  if (isOwner) refreshTickets();
}

        <div class="ideas">${MISSIONS.slice(0, 3).map((m, i) => `<div class="idea"><span class="k">${i + 1}</span><span class="it">내 ${m} 하나만 보내줘</span></div>`).join('')}</div>
        <button class="btn primary block" onclick="shareFeed()">친구에게 첫 사진 부탁하기</button></div>`
    : `<div class="empty"><h2>Be the <em>first.</em></h2>
        <p>${esc(prof.name)}의 피드가 아직 비어 있어요.<br>첫 사진을 보내주세요.</p>

// ---------- 친구 ----------
let myFollows = new Set();
async function loadFollows() {
  myFollows = new Set();
  if (!me) return;
  const { data, error } = await sb.from('follows').select('followee_id').eq('follower_id', me.id);
  if (!error) data.forEach(r => myFollows.add(r.followee_id)); // social.sql 실행 전이면 조용히 빈 목록
}
async function toggleFollow(uid, btn) {
  if (!me) return toast('로그인하면 친구를 추가할 수 있어요');
  const on = myFollows.has(uid);
  on ? myFollows.delete(uid) : myFollows.add(uid);
  if (btn) { btn.textContent = on ? '친구 추가' : '친구 ✓'; btn.classList.toggle('add', on); }
  const { error } = on
    ? await sb.from('follows').delete().eq('follower_id', me.id).eq('followee_id', uid)
    : await sb.from('follows').insert({ follower_id: me.id, followee_id: uid });
  if (error) { on ? myFollows.add(uid) : myFollows.delete(uid); if (btn) { btn.textContent = on ? '친구 ✓' : '친구 추가'; btn.classList.toggle('add', !on); } return toast(kerr(error)); }
  toast(on ? '친구에서 뺐어요' : '친구로 추가했어요. 새 사진이 홈에 떠요');
}

// 유튜브 스타일: 떠 있는 캡슐 바, 아이콘만, 현재 탭은 알약 배경

    `<button class="${active === key ? 'on' : ''}" onclick="${onclick}" aria-label="${label}"${active === key ? ' aria-current="page"' : ''}>${icon}</button>`;
  return `<nav class="bnav ${active === 'reels' ? 'dark' : ''}">
    ${item('reels', '릴스', I.reelsNav, "go(location.pathname+'?home=1')")}
    ${item('create', '만들기', I.create, 'openCreate()')}
    ${item('feed', '내 피드', `<span class="bav">${avatar(myProf, 'xs')}</span>`, `go('${feedUrl(me.id)}')`)}
  </nav>`;
}
// ⊕ 만들기: 친구 피드에서는 그 친구에게 보내기, 그 외(내 피드·릴스)에서는 내 피드 부탁하기
function openCreate() {
  // 릴스: 지금 화면에 보이는 릴스의 피드 주인에게 보내기
  const reels = document.getElementById('reels');
  if (reels) {
    const cur = [...reels.querySelectorAll('.reel[data-id]')].find(r => Math.abs(r.offsetTop - reels.scrollTop) < r.clientHeight / 2);
    const post = cur && HOME.posts.find(p => p.id === cur.dataset.id);
    if (post && post.owner_id !== me.id) return fillFriend(post.owner_id);
  }
  const onFriendFeed = !document.querySelector('.reels') && S.uid && S.prof && !S.isOwner;
  if (onFriendFeed) return openCompose();
  if (S.isOwner && !document.querySelector('.reels')) return shareFeed();
  go(feedUrl(me.id)); setTimeout(shareFeed, 80);
}

// 내 피드 > 친구 탭: 친구 목록 화면
async function renderFriendsTab($b) {
  const ids = [...myFollows];
  if (!ids.length) {
    $b.innerHTML = `<div class="empty"><h2>No friends, <em>yet.</em></h2><p>오른쪽 위 🔍에서 이름으로 친구를 찾아 추가해 보세요.<br>추가한 친구의 새 사진이 릴스에 떠요.</p>
      <button class="btn primary block" onclick="openSearch()">친구 찾기</button></div>`;
    return;
  }
  $b.innerHTML = `<div class="flist"><p class="hint" style="padding:16px 20px">불러오는 중…</p></div>`;
  const { data, error } = await sb.from('profiles').select('*').in('id', ids);
  if (S.tab !== 'friends' || !document.body.contains($b)) return;
  if (error) return $b.innerHTML = `<div class="empty"><p>${esc(kerr(error))}</p></div>`;
  data.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  const head = `<div class="fhead"><button onclick="setTab('grid')" aria-label="피드로 돌아가기">←</button><b>내 친구 ${data.length}</b></div>`;
  $b.innerHTML = head + `<div class="flist">${data.map(p => `
    <div class="frow"><a href="${feedUrl(p.id)}">${avatar(p, 'xs')}<span><b>${esc(p.name)}</b><small>${p.handle ? `@${esc(p.handle)}` : ''}${p.handle && p.bio ? ' · ' : ''}${esc(p.bio || '')}</small></span></a>
      <button class="btn" onclick="toggleFollow('${p.id}', this)">친구 ✓</button></div>`).join('')}</div>`;
}

// ---------- 친구 검색 (검색어가 없으면 내 친구 목록) ----------
async function openSearch() {
  const w = sheet(`<div class="shead"><h3>Find friends<i class="pd">.</i></h3><button class="icon-btn" aria-label="닫기" onclick="closeSheet()">${I.close}</button></div>
    <div class="sbox">${I.search}<input class="field" id="sq" type="search" placeholder="이름 또는 @아이디로 친구 찾기" autocomplete="off" autocapitalize="off" enterkeyhint="search"></div>
    <div id="sr"><p class="hint">불러오는 중…</p></div>`, null, { top: true });
  const $q = w.querySelector('#sq'), $r = w.querySelector('#sr');
  const row = p => `<div class="frow"><a href="${feedUrl(p.id)}">${avatar(p, 'xs')}<span><b>${esc(p.name)}</b><small>${p.handle ? `@${esc(p.handle)}` : ''}${p.handle && p.bio ? ' · ' : ''}${esc(p.bio || '')}</small></span></a>
    ${p.id === me?.id ? '<small style="color:var(--sub)">나</small>' : `<button class="btn ${myFollows.has(p.id) ? '' : 'add'}" onclick="toggleFollow('${p.id}', this)">${myFollows.has(p.id) ? '친구 ✓' : '친구 추가'}</button>`}</div>`;
  const showFriends = async () => {
    const ids = [...myFollows];
    if (!ids.length) return $r.innerHTML = '<p class="hint" style="padding:16px 0">아직 추가한 친구가 없어요. 위에서 이름으로 찾아보세요.</p>';
    const { data, error } = await sb.from('profiles').select('*').in('id', ids);
    if (error) return $r.innerHTML = `<p class="hint">${esc(kerr(error))}</p>`;
    $r.innerHTML = `<div class="label" style="margin-top:8px">MY FRIENDS · ${data.length}</div>${data.map(row).join('')}`;
  };
  let timer, seq = 0;
  $q.oninput = () => {
    clearTimeout(timer);
    const term = $q.value.trim();
    if (!term) return showFriends();
    timer = setTimeout(async () => {
      const my = ++seq;
      // 이름 또는 아이디로 검색 (@로 시작하면 아이디만). 검색식을 깨는 특수문자는 제거
      const clean = term.replace(/^@/, '').replace(/[,()".:\\%_*]/g, '');
      if (!clean) return;
      const q = term.startsWith('@') ? `handle.ilike.%${clean.toLowerCase()}%` : `name.ilike.%${clean}%,handle.ilike.%${clean.toLowerCase()}%`;
      const { data, error } = await sb.from('profiles').select('*').or(q).eq('onboarded', true).limit(20);
      if (my !== seq) return; // 늦게 도착한 이전 검색 결과는 무시
      if (error) return $r.innerHTML = `<p class="hint">${esc(kerr(error))}</p>`;
      $r.innerHTML = data.length ? `<div class="label" style="margin-top:8px">RESULTS</div>${data.map(row).join('')}` : `<p class="hint" style="padding:16px 0">'${esc(term)}'(으)로 찾은 친구가 없어요.</p>`;
    }, 250);
  };
  showFriends();
  setTimeout(() => $q.focus(), 350);
}
const openFriends = openSearch;

// ---------- 좋아요·댓글 (홈 릴스와 게시물 상세에서 공유) ----------
const SOC = new Map(); // postId → { likes, liked, comments }
async function loadSocial(ids) {
  if (!ids.length) return;
  ids.forEach(id => SOC.set(id, { likes: 0, liked: false, comments: 0 }));
  const [l, c] = await Promise.all([
    sb.from('likes').select('post_id, user_id').in('post_id', ids),
    sb.from('comments').select('post_id').in('post_id', ids),
  ]);
  (l.data || []).forEach(r => { const s = SOC.get(r.post_id); s.likes++; if (me && r.user_id === me.id) s.liked = true; });
  (c.data || []).forEach(r => SOC.get(r.post_id).comments++);
}
function paintSoc(id) {
  const s = SOC.get(id); if (!s) return;
  document.querySelectorAll(`[data-like="${id}"]`).forEach(b => { b.querySelector('span').innerHTML = s.liked ? I.heartOn : I.heart; b.querySelector('b').textContent = s.likes || ''; b.setAttribute('aria-pressed', s.liked); });
  document.querySelectorAll(`[data-cmt="${id}"] b`).forEach(b => b.textContent = s.comments || '');
}
async function toggleLike(id, only) {
  if (!me) return toast('로그인하면 좋아요를 남길 수 있어요');
  const s = SOC.get(id); if (!s || (only && s.liked)) return;
  s.liked = !s.liked; s.likes += s.liked ? 1 : -1; paintSoc(id);
  if (s.liked) navigator.vibrate?.(8);
  const { error } = s.liked
    ? await sb.from('likes').insert({ post_id: id, user_id: me.id })
    : await sb.from('likes').delete().eq('post_id', id).eq('user_id', me.id);
  if (error) { s.liked = !s.liked; s.likes += s.liked ? 1 : -1; paintSoc(id); toast(kerr(error)); }
}
async function openComments(id, ownerId) {
  const w = sheet(`<h3>Comments<i class="pd">.</i></h3><div id="cl" class="clist"><p class="hint">불러오는 중…</p></div>
    <div class="sheet-foot cbar">${me
      ? `<input class="field" id="cin" maxlength="200" placeholder="따뜻한 한마디 남기기" style="margin:0"><button class="btn primary" id="cgo">게시</button>`
      : `<button class="btn primary block" onclick="closeSheet();location.href=location.pathname">로그인하고 댓글 달기</button>`}</div>`);
  const paint = async () => {
    const { data, error } = await sb.from('comments').select('id, body, created_at, user_id, profiles(name, avatar_url)').eq('post_id', id).order('created_at', { ascending: true });
    if (error) return w.querySelector('#cl').innerHTML = `<p class="hint">${esc(kerr(error))}</p>`;
    const s = SOC.get(id); if (s) { s.comments = data.length; paintSoc(id); }
    w.querySelector('#cl').innerHTML = data.length ? data.map(c => `
      <div class="crow">${avatar(c.profiles, 'xs')}<div style="flex:1;min-width:0"><b>${esc(c.profiles?.name || '친구')}</b> <small>${ago(c.created_at)}</small><div>${esc(c.body)}</div></div>
        ${me && (c.user_id === me.id || ownerId === me.id) ? `<button class="cdel" data-del="${c.id}" aria-label="댓글 삭제">삭제</button>` : ''}</div>`).join('')
      : '<p class="hint" style="text-align:center;padding:24px 0">첫 댓글을 남겨 보세요</p>';
    w.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const { error } = await sb.from('comments').delete().eq('id', b.dataset.del);
      error ? toast(kerr(error)) : paint();
    });
  };
  paint();
  const go = w.querySelector('#cgo'), inp = w.querySelector('#cin');
  if (go) {
    const send = async () => {
      const body = inp.value.trim(); if (!body) return;
      go.disabled = true;
      const { error } = await sb.from('comments').insert({ post_id: id, user_id: me.id, body });
      go.disabled = false;
      if (error) return toast(kerr(error));
      inp.value = ''; paint();
    };
    go.onclick = send; inp.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) send(); };
  }
}

// ---------- 홈: 친구 피드의 최신 사진을 릴스로 ----------
let muted = true;
async function fetchHome() {
  const ids = [...myFollows];
  const r = await withTimeout(sb.from('posts').select('*').in('owner_id', ids).eq('status', 'approved').order('approved_at', { ascending: false }).limit(40), 10000);
  if (r.error) throw r.error;
  const o = await sb.from('profiles').select('*').in('id', ids);
  await loadSocial(r.data.map(p => p.id));
  await loadPolls(r.data).catch(() => {});
  await loadStickers(r.data.filter(p => !isText(p)).map(p => p.id)).catch(() => {});
  return { posts: r.data, owners: new Map((o.data || []).map(p => [p.id, p])) };
}
// 홈: 저장해 둔 릴스를 바로 보여주고 뒤에서 갱신. fresh=true(당겨서 새로고침)면 새로 받아 다시 그림
async function renderHome(fresh) {
  CUR = pageKey(); const myKey = CUR;
  $app.classList.remove('has-nav');
  if (CACHE.home && !fresh) {
    paintHome(CACHE.home);
    fetchHome().then(d => {
      const same = d.posts.map(p => p.id).join() === CACHE.home.posts.map(p => p.id).join();
      CACHE.home = d;
      const r = document.querySelector('.reels');
      if (!same && pageKey() === myKey && r && r.scrollTop < 10) paintHome(d); // 맨 위에 있을 때만 조용히 교체
    }).catch(() => {});
    return;
  }
  if (!CACHE.home) $app.innerHTML = `<div class="reels"><div class="spin" style="padding-top:45vh"><span class="logo" style="color:#fff">${LOGO}</span></div></div>${navBar('reels')}`;
  try { CACHE.home = await fetchHome(); } catch { return CACHE.home ? undefined : renderError(renderHome); }
  if (pageKey() !== myKey) return;
  paintHome(CACHE.home);
}
// 릴스에서 바로 그 친구 피드 채워주기: 페이지 이동 없이 작성 화면 + 사진첩
function fillFriend(uid) {
  const o = HOME.owners?.get(uid); if (!o) return go(`${feedUrl(uid)}&m=0`);
  Object.assign(S, { uid, prof: o, isOwner: me?.id === uid });
  openCompose(0, false, 'media');
}
function paintHome({ posts, owners }) {
  HOME.posts = posts; HOME.owners = owners;
  const top = `<header class="rtop"><button class="logo" onclick="go(location.pathname)">${LOGO}</button><div class="sp"></div>
    <button class="icon-btn" aria-label="친구 검색" onclick="openSearch()">${I.search}</button></header>`;
  if (!posts.length) {
    $app.innerHTML = `<div class="reels">${top}<section class="reel rempty"><div>
      <h2>Quiet for now<i class="pd">.</i></h2><p>친구들 피드에 새 사진이 올라오면 여기 떠요.<br>친구 피드에 사진을 먼저 보내 보는 건 어때요?</p>
      <button class="btn primary block" onclick="openSearch()">친구 찾기</button><div style="height:8px"></div>
      <a class="btn block" href="${feedUrl(me.id)}" style="display:block;text-decoration:none;text-align:center">내 피드로 가기</a></div></section></div>${navBar('reels')}`;
    return;
  }
  $app.innerHTML = `<div class="reels" id="reels">${top}${posts.map(p => {
    const o = owners.get(p.owner_id) || { name: '친구' }, s = SOC.get(p.id);
    return `<section class="reel" data-id="${p.id}">
      ${isText(p) ? `<div class="rbg rbg-${p.media_type}"></div><div class="rmedia rtc">${textCard(p)}</div>` : `<div class="rbg" style="background-image:url('${thumbUrl(p)}')"></div>`}
      ${isText(p) ? '' : `<div class="rmedia rcar">${mediaCarousel(p, 'reel')}</div>
        ${mediaOf(p).some(m => m.k === 'video') ? `<button class="rmute" aria-label="소리 켜기/끄기">${muted ? I.mute : I.sound}</button>` : ''}`}
      <div class="rburst">${I.heartOn}</div>
      <div class="rinfo">
        <a class="rowner" href="${feedUrl(p.owner_id)}">${avatar(o, 'xs')}<b>${esc(o.name)}</b><span>의 피드</span></a>
        <div class="rfrom">from <b>${esc(p.author_name)}</b> ${p.mission ? `<span class="mchip">${esc(p.mission)}</span>` : ''}</div>
        ${p.text && !isText(p) ? `<div class="rtext">“${esc(p.text)}”</div>` : ''}
        <small>${ago(p.approved_at)}</small>
      </div>
      <div class="rside">
        <button class="rbtn" data-like="${p.id}" aria-label="좋아요" aria-pressed="${s.liked}" onclick="toggleLike('${p.id}')"><span>${s.liked ? I.heartOn : I.heart}</span><b>${s.likes || ''}</b></button>
        <button class="rbtn" data-cmt="${p.id}" aria-label="댓글" onclick="openComments('${p.id}','${p.owner_id}')"><span>${I.comment}</span><b>${s.comments || ''}</b></button>

      </div>
    </section>`;
  }).join('')}
    <section class="reel rempty"><div><h2>All caught <em>up.</em></h2><p>친구들 새 사진을 다 봤어요.<br>이번엔 내가 친구 피드를 채워줄 차례!</p>
      <button class="btn primary block" onclick="openFriends()">친구 피드에 사진 보내기</button></div></section></div>${navBar('reels')}`;

  // 마지막으로 본 릴스부터 이어서 보기 (+ 위로 새 게시물이 있으면 '최신으로' 버튼)
  let last = null; try { last = localStorage.getItem('candid_reel'); } catch {}
  const lastEl = last && document.querySelector(`.reel[data-id="${last}"]`);
  const $reels = document.getElementById('reels');
  if (lastEl && lastEl.offsetTop > 0) {
    $reels.scrollTop = lastEl.offsetTop;
    const up = document.createElement('button'); up.className = 'rtop-pill'; up.textContent = '↑ 최신으로';
    up.onclick = () => $reels.scrollTo({ top: 0, behavior: 'smooth' });
    $reels.appendChild(up);
    $reels.addEventListener('scroll', () => up.classList.toggle('hide', $reels.scrollTop < 10), { passive: true });
  }
  // 화면에 보이는 영상만 재생
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { try { localStorage.setItem('candid_reel', e.target.dataset.id); } catch {} } // 마지막으로 본 릴스 기억
    if (!e.isIntersecting) return e.target.querySelectorAll('video').forEach(v => v.pause());
    const v = currentVideo(e.target); if (!v) return; // 여러 장이면 지금 보이는 장의 영상만
    v.preload = 'auto'; v.muted = muted; v.play().catch(() => {});
  }), { threshold: 0.6 });
  initCarousels(document.getElementById('reels'), () => true);
  document.querySelectorAll('.reel[data-id]').forEach(r => {
    io.observe(r);
    // 두 번 탭: 좋아요 + 하트 / 한 번 탭(영상): 소리 켜기·끄기
    let last = 0, timer;
    r.querySelector('.rmedia').addEventListener('click', () => {
      const now = Date.now();
      if (now - last < 300) {
        clearTimeout(timer); last = 0;
        const b = r.querySelector('.rburst'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
        toggleLike(r.dataset.id, true);
      } else { last = now; timer = setTimeout(() => r.querySelector('video') && toggleMute(), 300); }
    });
    r.querySelector('.rmute')?.addEventListener('click', toggleMute);
  });
}
function toggleMute() {
  muted = !muted;
  document.querySelectorAll('.reel video').forEach(v => v.muted = muted);
  document.querySelectorAll('.rmute').forEach(b => b.innerHTML = muted ? I.mute : I.sound);
}
function shareOther(uid, handle) {
  const url = `${handle ? shareUrl({ handle }) : feedUrl(uid)}&m=0`;
  if (navigator.share) return navigator.share({ title: 'candid.', url }).catch(() => {});
  navigator.clipboard.writeText(url).then(() => toast('피드 링크를 복사했어요')).catch(() => prompt('이 링크를 복사해 주세요', url));
}

// ---------- 투표·질문 ----------
const isText = p => p.media_type === 'poll' || p.media_type === 'question';
// 그리드·승인함 썸네일용 카드
const textTile = p => `<div class="ttile ${p.media_type}"><span class="tk">${p.media_type === 'poll' ? 'POLL' : 'Q&amp;A'}</span><p>${esc(p.text)}</p>${p.media_type === 'question' && p.answer ? `<small>A. ${esc(p.answer)}</small>` : ''}</div>`;

// 투표자 키: 로그인 'u:<id>' / 비로그인은 기기마다 랜덤 'g:<uuid>' (기기당 1표)
function voterKey() {
  if (me) return 'u:' + me.id;
  let k = ''; try { k = localStorage.getItem('candid_voter') || ''; } catch {}
  if (!k) { k = 'g:' + crypto.randomUUID(); try { localStorage.setItem('candid_voter', k); } catch {} }
  return k;
}
const POLL = new Map(); // postId → { counts[], total, mine }
async function loadPolls(posts) {
  const polls = posts.filter(p => p.media_type === 'poll' && p.status === 'approved');
  if (!polls.length) return;
  polls.forEach(p => POLL.set(p.id, { counts: p.poll_options.map(() => 0), total: 0, mine: null }));
  const { data } = await sb.from('poll_votes').select('post_id, voter_key, option').in('post_id', polls.map(p => p.id));
  const key = voterKey();
  (data || []).forEach(v => { const s = POLL.get(v.post_id); if (!s || s.counts[v.option] == null) return; s.counts[v.option]++; s.total++; if (v.voter_key === key) s.mine = v.option; });
}
function pollHTML(p) {
  const s = POLL.get(p.id) || { counts: (p.poll_options || []).map(() => 0), total: 0, mine: null };
  const owner = me && me.id === p.owner_id;
  const canVote = p.status === 'approved' && !owner && s.mine == null;
  const opts = (p.poll_options || []).map((o, i) => {
    if (canVote) return `<button class="popt" onclick="vote('${p.id}', ${i})">${esc(o)}</button>`;
    const pct = s.total ? Math.round(s.counts[i] / s.total * 100) : 0;
    return `<div class="popt res ${s.mine === i ? 'mine' : ''}"><i style="width:${pct}%"></i><b>${esc(o)}${s.mine === i ? ' ✓' : ''}</b><em>${pct}%</em></div>`;
  }).join('');
  const foot = p.status !== 'approved' ? '승인하면 친구들이 투표할 수 있어요'
    : owner ? `${s.total}명 참여 · 내 피드의 투표엔 참여할 수 없어요`
    : canVote ? '눌러서 투표하기' : `${s.total}명 참여`;
  return `<div class="poll" data-poll="${p.id}">${opts}<small>${foot}</small></div>`;
}
async function vote(id, i) {
  const s = POLL.get(id); if (!s || s.mine != null) return;
  s.mine = i; s.counts[i]++; s.total++;
  const repaint = () => document.querySelectorAll(`[data-poll="${id}"]`).forEach(el => {
    const p = findAny(id); if (p) el.outerHTML = pollHTML(p);
  });
  repaint(); navigator.vibrate?.(8);
  const { error } = await sb.from('poll_votes').insert({ post_id: id, voter_key: voterKey(), user_id: me?.id ?? null, option: i });
  if (error) {
    s.mine = null; s.counts[i]--; s.total--; repaint();
    toast(/duplicate|23505/i.test(error.message + error.code) ? '이미 투표했어요' : kerr(error));
  }
}
const qaHTML = p => `<div class="qa"><div class="q"><span>Q.</span>${esc(p.text)}</div>${p.answer
  ? `<div class="a"><span>A.</span>${esc(p.answer)}</div>`

(function pullToRefresh() {
  let y0 = null, dy = 0, busy = false;
  // 인디케이터: 얇은 원형 링이 당긴 만큼 채워지고, 놓으면 회전
  const ind = document.createElement('div'); ind.className = 'ptr';
  ind.innerHTML = '<svg viewBox="0 0 36 36" width="30" height="30" aria-hidden="true"><circle cx="18" cy="18" r="14" pathLength="100"/></svg>';
  const ring = ind.querySelector('circle');
  let buzzed = false;
  document.body.appendChild(ind);
  const scroller = () => document.querySelector('.reels') || document.scrollingElement;
  const blocked = () => busy || document.querySelector('.sheet-wrap:not(.closing), .overlay');
  addEventListener('touchstart', e => { y0 = !blocked() && scroller().scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (scroller().scrollTop > 0) { y0 = null; dy = 0; }
    const p = Math.min(1, dy / 120);
    ring.style.strokeDasharray = `${p * 82} 100`;
    ind.style.opacity = Math.min(1, dy / 40);
    ind.style.transform = `translateY(${Math.min(dy * 0.35, 42) - 20}px) scale(${0.6 + 0.4 * p})`;
    if (p >= 1 && !buzzed) { buzzed = true; navigator.vibrate?.(6); }
    if (p < 1) buzzed = false;
  }, { passive: true });
  addEventListener('touchend', async () => {
    if (y0 == null) return; y0 = null;
    if (dy > 120 && !busy) {
      busy = true; ind.classList.add('spin'); ind.style.transform = 'translateY(22px) scale(1)'; ring.style.strokeDasharray = '';
      try { document.querySelector('.reels') ? await renderHome(true) : S.uid ? await renderProfile(S.uid, true) : location.reload(); } finally {
        busy = false; ind.classList.remove('spin');
      }
    }
    ind.style.opacity = 0; ind.style.transform = 'translateY(-20px) scale(.6)'; dy = 0; buzzed = false;
  });
})();

// ---------- 바텀시트 ----------
// guard: 배경을 눌러 닫기 전에 호출, false 를 돌려주면 닫지 않음
// opts.top: 위에서 내려오는 패널(상단 메뉴에서 여는 친구 검색 등)
function sheet(html, guard, opts = {}) {
  closeSheet();
  const w = document.createElement('div');
  w.className = 'sheet-wrap' + (opts.top ? ' from-top' : '');
  w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true');
  w.innerHTML = opts.top ? `<div class="sheet">${html}<div class="grab"></div></div>` : `<div class="sheet"><div class="grab"></div>${html}</div>`;
  w._guard = guard || (() => true);
  w.onclick = e => { if (e.target === w && w._guard()) closeSheet(); };
  document.body.appendChild(w);
  dragToClose(w);
  return w;
}
// 시트를 끌어서 닫기: 아래 시트는 아래로, 위 패널은 위로. 110px 이상 또는 빠르게 튕기면 닫힘
function dragToClose(w) {
  const sh = w.querySelector('.sheet');
  const dir = w.classList.contains('from-top') ? -1 : 1;
  const atEdge = () => dir === 1 ? sh.scrollTop <= 0 : sh.scrollTop + sh.clientHeight >= sh.scrollHeight - 1;
  let y0 = null, x0 = 0, t0 = 0, dy = 0, dragging = false;
  sh.addEventListener('touchstart', e => {
    const fromGrab = e.target.closest('.grab');
    if (!fromGrab && (!atEdge() || e.target.closest('textarea, .chips'))) return y0 = null;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; t0 = Date.now(); dy = 0; dragging = false;
  }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (y0 == null) return;
    const ny = (e.touches[0].clientY - y0) * dir, nx = e.touches[0].clientX - x0;
    if (!dragging) {
      if (Math.abs(nx) > 10 && Math.abs(nx) > Math.abs(ny)) return y0 = null; // 가로 스와이프(칩 등)는 양보
      if (ny > 6 && atEdge()) { dragging = true; sh.style.transition = 'none'; document.activeElement?.blur?.(); } else return;
    }
    e.preventDefault();
    dy = Math.max(0, ny);
    sh.style.transform = `translateY(${dy * dir}px)`;
    w.style.backgroundColor = `rgba(10,10,10,${0.45 * (1 - Math.min(1, dy / 400))})`;
  }, { passive: false });
  sh.addEventListener('touchend', () => {
    if (!dragging) return y0 = null;
    const fast = dy / Math.max(1, Date.now() - t0) > 0.5;
    y0 = null; dragging = false;
    if ((dy > 110 || (fast && dy > 30)) && w._guard()) return closeSheet();
    sh.style.transition = 'transform .25s cubic-bezier(.32,.72,0,1)'; sh.style.transform = ''; w.style.backgroundColor = '';
  });
}
// 닫기: 아래로 미끄러지며 사라짐 (닫히는 중인 시트는 다른 곳에서 '열린 시트'로 보지 않음)
function closeSheet() {
  const w = document.querySelector('.sheet-wrap:not(.closing)'); if (!w) return;
  const done = w._onClose; w._onClose = null;
  w.classList.add('closing');
  const sh = w.querySelector('.sheet');
  sh.style.transition = 'transform .22s cubic-bezier(.32,.72,0,1)'; sh.style.transform = w.classList.contains('from-top') ? 'translateY(-100%)' : 'translateY(100%)';
  setTimeout(() => w.remove(), 230);
  done?.();
}

        : `<input class="field" id="author" maxlength="12" placeholder="내 이름 (예: 지수)" value="${esc(typedNow ?? nick)}" autocomplete="off">`;
  };
  el.querySelectorAll('.cmp-seg button').forEach(b => b.onclick = () => setWho(b.dataset.who));
  setWho('name');
  setMode(mode);
  if (mode === 'media' && pick) $file.click(); // 누르자마자 사진첩 (버튼 터치 안에서만 열 수 있음)

  $send.onclick = async () => {
    // 보내는 사람: 이름(로그인=내 프로필 / 비로그인=입력한 이름) 또는 익명(로그인이어도 내 계정 정보를 남기지 않음)
    const typed = $('#author')?.value.trim() || '';
    const author = who === 'anon' ? '익명의 친구' : me ? (myProf?.name || '친구').slice(0, 12) : (typed || '익명의 친구');
    const by = who === 'anon' ? { author_name: '익명의 친구', author_id: null } : { ...by };
    $send.disabled = true;
    const status = t => { $send.textContent = t; };
    let ins;
    try {
      if (mode === 'poll') {
        status('보내는 중…');
        const opts = [...el.querySelectorAll('#opts input')].map(i => i.value.trim()).filter(Boolean);
        ins = await sb.from('posts').insert({ owner_id: S.uid, media_type: 'poll', mission: '투표', text: $('#pq').value.trim(), poll_options: opts, ...by });
      } else if (mode === 'question') {
        status('보내는 중…');
        ins = await sb.from('posts').insert({ owner_id: S.uid, media_type: 'question', mission: '질문', text: $('#qq').value.trim(), ...by });
      } else {
        // 한 장씩 (영상은 줄인 뒤) 올리고 media 배열로 저장. 첫 장은 image_path 에도 넣어 예전 화면과 호환
        const list = [], n = media.length;
        for (const [i, m] of media.entries()) {
          const tag = n > 1 ? ` (${i + 1}/${n})` : '';
          let main = m.main;
          if (m.kind === 'video') { status(`영상 줄이는 중${tag} 0%`); main = await compressVideo(m, p => status(`영상 줄이는 중${tag} ${Math.round(p * 100)}%`)); }
          status(`올리는 중${tag}…`);
          const id = crypto.randomUUID();
          const path = `${S.uid}/${id}.${extOf(main)}`, tpath = `${S.uid}/${id}_t.${extOf(m.thumb)}`;
          await Promise.all([uploadBlob(path, main), uploadBlob(tpath, m.thumb)]);
          list.push({ p: path, t: tpath, k: m.kind });
        }
        ins = await sb.from('posts').insert({
          owner_id: S.uid, image_path: list[0].p, thumb_path: list[0].t, media_type: list[0].k,
          ...(n > 1 ? { media: list } : {}), // 1장은 media 칸 없이 (09 SQL 실행 전에도 동작)
          mission: asked ? MISSIONS[mi] : null, text: $('#text').value.trim(), ...by,
        });
      }
    } catch (err) { ins = { error: err }; }
    if (ins.error) { $send.disabled = false; status('다시 보내기'); return toast(/줄일 수 없어요/.test(ins.error.message) ? ins.error.message : kerr(ins.error)); }
    try { if (!me && who === 'name' && typed) localStorage.setItem('candid_author', typed); } catch {}
    media = null; el.querySelectorAll('textarea, #opts input').forEach(i => i.value = '');
    const what = mode === 'poll' ? '투표' : mode === 'question' ? '질문' : '사진·영상';
    removeEventListener('popstate', onPop);
    el.innerHTML = `<div class="cmp-done">
      <div class="cmp-check">✓</div><h2>Sent<i class="pd">.</i></h2>
      <p>${mode === 'question' ? `${name}님이 답하면 질문과 함께 피드에 올라가요.` : `${name}님이 승인하면 피드에 올라가요.`}<br>누가 보냈는지는 이름으로만 보여요.</p>
      <button class="btn primary block" id="more">${what} 하나 더 보내기</button>
      ${me && !S.isOwner && !myFollows.has(S.uid) ? `<button class="btn add block" id="fol">${name} 친구 추가 · 새 소식을 홈에서 보기</button>` : ''}
      ${S.isOwner ? '' : me ? '' : `<button class="btn block" id="mine">나도 받아볼래 — 내 피드 만들기</button>`}
      <button class="btn block" style="border:0;background:none;color:var(--sub)" id="done">닫기</button></div>`;
    const done = () => { el.remove(); if (history.state?.compose) history.back(); };
    $('#done').onclick = done;
    $('#more').onclick = () => { el.remove(); openCompose(0, false, mode); };
    const fol = $('#fol'); if (fol) fol.onclick = () => { toggleFollow(S.uid); fol.remove(); };
    const mine = $('#mine'); if (mine) mine.onclick = () => { try { localStorage.setItem('candid_ref', JSON.stringify({ uid: S.uid, name: S.prof.name })); } catch {} location.href = location.pathname; };
  };
}

// ---------- 푸시 알림 ----------
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

async function pushState() {
  if (inApp) return 'in-app';
  if (isIOS && !isStandalone) return 'ios-install';
  if (!pushSupported || !cfg.VAPID_PUBLIC_KEY) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  return sub ? 'on' : 'off';
}
async function updateBell() {
  const b = document.getElementById('bell'); if (!b) return;
  const st = await pushState().catch(() => 'off');
  b.innerHTML = st === 'on' ? I.bellOn : I.bell + (st === 'unsupported' ? '' : '<span class="dot"></span>');
}
const b64u = s => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

async function openPush() {
  const st = await pushState().catch(() => 'unsupported');
  const msg = {
    'ios-install': `<p class="hint">iPhone은 candid.을 홈 화면에 추가해야 알림을 받을 수 있어요.</p>
      <div class="ideas">
        <div class="idea"><span class="k">1</span><span class="it">Safari 아래쪽 공유 버튼(□↑)을 눌러요</span></div>
        <div class="idea"><span class="k">2</span><span class="it">'홈 화면에 추가'를 눌러요</span></div>
        <div class="idea"><span class="k">3</span><span class="it">홈 화면의 candid. 아이콘으로 열어요</span></div>
        <div class="idea"><span class="k">4</span><span class="it">한 번 더 로그인하고 🔔을 눌러요</span></div>
      </div>`,
    'in-app': '<p class="hint">카톡·인스타 안의 브라우저에서는 알림을 켤 수 없어요. Safari나 Chrome에서 열어 주세요.</p><button class="btn primary block" onclick="closeSheet();openExternal()">외부 브라우저로 열기</button>',
    unsupported: '<p class="hint">이 브라우저는 알림을 지원하지 않아요. 크롬이나 사파리 최신 버전에서 열어 주세요.</p>',
    denied: '<p class="hint">알림이 차단돼 있어요. 브라우저의 사이트 설정에서 candid. 알림을 허용한 뒤 다시 눌러 주세요.</p>',
    off: '<p class="hint">친구가 사진을 보내면 바로 알려드릴게요.</p><button class="btn primary block" id="pushOn">알림 켜기</button>',
    on: '<p class="hint">알림이 켜져 있어요. 친구가 사진을 보내면 이 기기로 알려드려요.</p><button class="btn block" id="pushOff">이 기기 알림 끄기</button>',
  }[st];
  const w = sheet(`<h3>Get notified<i class="pd">.</i></h3>${msg}<div style="height:8px"></div><button class="btn block" onclick="closeSheet()">닫기</button>`);
  const on = w.querySelector('#pushOn'), off = w.querySelector('#pushOff');
  if (on) on.onclick = async () => {
    on.disabled = true; on.textContent = '설정 중…';
    try {
      if (await Notification.requestPermission() !== 'granted') throw new Error('알림 권한이 허용되지 않았어요');
      const reg = await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(cfg.VAPID_PUBLIC_KEY) });
      const j = sub.toJSON();
      const { error } = await sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_id: me.id });
      if (error) throw error;
      closeSheet(); toast('알림을 켰어요 🔔');
    } catch (e) { on.disabled = false; on.textContent = '알림 켜기'; toast(e.message || '알림 설정 실패'); }
    updateBell();
  };
  if (off) off.onclick = async () => {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub) { await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
    closeSheet(); toast('이 기기 알림을 껐어요'); updateBell();
  };
}

function canInstall() {

function maybeShowInstall() {

  if (!kind || !me || document.querySelector('.ibanner')) return;
  let until = 0; try { until = +localStorage.getItem('candid_install_snooze') || 0; } catch {}

}

const RARITY = { common: { label: '일반', color: '#8e8e93' }, rare: { label: '레어', color: '#2b50ff' }, epic: { label: '에픽', color: '#af52de' }, legendary: { label: '전설', color: '#ff9f0a' } };
const KIND_LABEL = { frame: '프레임', theme: '커버', sticker: '스티커', name: '네임' };
let TICKETS = null;

// 장착 장식 → HTML 조각
function deco(prof) {
  const eq = prof?.equipped || {};
  return { frame: ITEM[eq.frame], theme: ITEM[eq.theme], name: ITEM[eq.name], stickers: (eq.stickers || []).map(id => ITEM[id]).filter(Boolean) };
}
const ringFx = fr => fr ? { cls: ` fx${fr.data.spin ? ' spin' : ''}${fr.data.glow ? ' glow' : ''}`, style: ` style="--ring:${fr.data.bg};${fr.data.glow ? `--glow:${fr.data.glow}` : ''}"` } : { cls: '', style: '' };
const nameFx = nm => {
  if (!nm) return { cls: '', style: '' };
  const d = nm.data;
  if (d.grad) return { cls: ` fxn${d.anim ? ' holo' : ''}`, style: ` style="background-image:${d.grad}"` };
  if (d.glow) return { cls: ' fxglow', style: ` style="--glow:${d.glow}"` };
  return { cls: '', style: ` style="color:${d.color}"` };
};
const coverHTML = (th, mini) => th ? `<div class="cover${mini ? ' mini' : ''}${th.data.stars ? ' stars' : ''}${th.data.film ? ' film' : ''}" style="background:${th.data.bg}"></div>` : '';
const stickersHTML = list => list.map((s, i) => `<span class="stk s${i}">${s.data.e}</span>`).join('');

// 아이템 하나 미리보기(뽑기 결과·옷장 타일)
function itemPreview(it) {
  if (it.kind === 'frame') { const f = ringFx(it); return `<div class="ring${f.cls}"${f.style}>${avatar(myProf)}</div>`; }
  if (it.kind === 'theme') return coverHTML(it, true);
  if (it.kind === 'sticker') return `<span class="stk big">${it.data.e}</span>`;
  const n = nameFx(it); return `<span class="name${n.cls}"${n.style}>${esc(myProf?.name || '이름')}</span>`;
}

async function refreshTickets(pulse) {
  if (!me) return;
  const before = TICKETS;
  const { data, error } = await sb.rpc('gacha_status');
  const btn = document.getElementById('gbtn');
  if (error) { if (btn) btn.hidden = true; return; } // 08_gacha.sql 실행 전
  TICKETS = data.tickets;
  document.querySelectorAll('[data-tickets]').forEach(el => el.textContent = TICKETS);
  if (btn) { btn.hidden = false; btn.classList.toggle('has', TICKETS > 0); if (pulse && before != null && TICKETS > before) { btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); } }
}

function pageOverlay(cls, html) {
  document.querySelector('.page-ov')?.remove();
  const el = document.createElement('div'); el.className = 'page-ov ' + cls; el.innerHTML = html;
  document.body.appendChild(el); return el;
}

// 뽑기 화면
function openGacha() {
  const el = pageOverlay('gacha', `
    <header class="pov-h"><button class="icon-btn" aria-label="닫기" data-x>${I.close}</button></header>
    <h2>Lucky capsule<i class="pd">.</i></h2>
    <p class="gsub">뽑기권 <b data-tickets>${TICKETS ?? '…'}</b>장</p>
    <div class="machine"><div class="capsule" id="cap"><i class="ct"></i><i class="cb"></i><i class="cl"></i></div><div class="burst" id="burst"></div></div>
    <div id="grev"></div>
    <div class="gfoot">
      <button class="btn primary block" id="gpull">뽑기 · 1장</button>
      <button class="btn block" id="gcloset">🎨 내 아이템으로 꾸미기</button>
      <details class="grules"><summary>뽑기권 받는 법 · 확률</summary>
        <p>처음 가입하면 <b>3장</b> 선물! 이후 내 피드에 친구가 보낸 게시물을 <b>승인할 때마다 1장</b>을 받아요. (하루 최대 3장, 같은 친구 이름은 하루 1장)</p>
        <div class="rates">${Object.entries(RARITY).map(([k, r]) => `<span style="--c:${r.color}">${r.label} <b>${{ common: 60, rare: 30, epic: 9, legendary: 1 }[k]}%</b></span>`).join('')}</div>
        <p>이미 가진 아이템이 나오면 보유 개수가 늘어나요.</p>
      </details>
    </div>`);
  el.querySelector('[data-x]').onclick = () => el.remove();
  el.querySelector('#gcloset').onclick = () => openCloset();
  const $pull = el.querySelector('#gpull'), $cap = el.querySelector('#cap'), $rev = el.querySelector('#grev'), $burst = el.querySelector('#burst');
  const setBtn = () => { $pull.disabled = !(TICKETS > 0); $pull.textContent = TICKETS > 0 ? ($rev.innerHTML ? '한 번 더 · 1장' : '뽑기 · 1장') : '뽑기권이 없어요 · 친구 게시물을 승인해 보세요'; };
  refreshTickets().then(setBtn); setBtn();
  $pull.onclick = async () => {
    $pull.disabled = true; $rev.innerHTML = ''; $cap.className = 'capsule shake'; $burst.className = 'burst';
    const [res] = await Promise.all([sb.rpc('pull_gacha'), new Promise(r => setTimeout(r, 1200))]);
    if (res.error) { $cap.className = 'capsule'; toast(/no_ticket/.test(res.error.message) ? '뽑기권이 없어요' : kerr(res.error)); return refreshTickets().then(setBtn); }
    const it = ITEM[res.data.id] || res.data, rar = RARITY[res.data.rarity];
    TICKETS = res.data.tickets; document.querySelectorAll('[data-tickets]').forEach(x => x.textContent = TICKETS);
    $cap.className = 'capsule open'; $cap.style.setProperty('--rc', rar.color);
    $burst.style.setProperty('--rc', rar.color); $burst.className = 'burst go' + (res.data.rarity === 'legendary' ? ' big' : '');
    navigator.vibrate?.(res.data.rarity === 'legendary' ? [30, 40, 60] : 12);
    const equippedNow = isEquipped(it);
    $rev.innerHTML = `<div class="gcard" style="--rc:${rar.color}">
      <div class="gprev">${itemPreview(it)}</div>
      <span class="rl">${rar.label} · ${KIND_LABEL[it.kind]}</span><b>${esc(it.name)}</b>
      <small>${res.data.count > 1 ? `이미 가진 아이템이에요 (x${res.data.count})` : '✨ NEW!'}</small>
      <button class="btn ${equippedNow ? '' : 'primary'}" data-eq>${equippedNow ? '장착 중' : '바로 장착하기'}</button></div>`;
    $rev.querySelector('[data-eq]').onclick = e => equip(it, e.currentTarget);
    setBtn(); refreshTickets(); // 버튼 숫자 갱신
  };
}
const isEquipped = it => { const eq = myProf?.equipped || {}; return it.kind === 'sticker' ? (eq.stickers || []).includes(it.id) : eq[it.kind] === it.id; };

async function equip(it, btn) {
  if (btn) btn.disabled = true;
  const { data, error } = await sb.rpc('equip_item', { p_kind: it.kind, p_item: it.id });
  if (btn) btn.disabled = false;
  if (error) return toast(/not_owned/.test(error.message) ? '아직 없는 아이템이에요' : kerr(error));
  myProf.equipped = data;
  if (S.prof && S.prof.id === me.id) S.prof.equipped = data;
  const c = CACHE.prof.get(me.id); if (c) c.prof = { ...c.prof, equipped: data };
  if (btn) { const on = isEquipped(it); btn.textContent = on ? '장착 중' : '바로 장착하기'; btn.classList.toggle('primary', !on); }
  if (S.isOwner && !document.querySelector('.reels')) paintProfile();
  return data;
}

// 꾸미기(옷장) 화면
async function openCloset(kind = 'frame') {
  const el = pageOverlay('closet', `
    <header class="pov-h"><button class="icon-btn" aria-label="닫기" data-x>${I.close}</button><b>Closet<i class="pd">.</i></b>
      <button class="btn gbtn has" data-g>🎁 <b data-tickets>${TICKETS ?? ''}</b></button></header>
    <div class="cprev" id="cprev"></div>
    <nav class="tabs ctabs">${Object.entries(KIND_LABEL).map(([k, l]) => `<button data-k="${k}">${l}</button>`).join('')}</nav>
    <p class="hint" id="chint" style="padding:10px 20px 0"></p>
    <div class="cgrid" id="cgrid"><p class="hint">불러오는 중…</p></div>`);
  el.querySelector('[data-x]').onclick = () => el.remove();
  el.querySelector('[data-g]').onclick = () => openGacha();
  const { data, error } = await sb.from('inventory').select('item_id, count').eq('user_id', me.id);
  if (error) return el.querySelector('#cgrid').innerHTML = `<p class="hint">${esc(kerr(error))}</p>`;
  const own = new Map(data.map(r => [r.item_id, r.count]));
  const paint = () => {
    const d = deco(myProf), f = ringFx(d.frame), n = nameFx(d.name);
    el.querySelector('#cprev').innerHTML = `${coverHTML(d.theme)}<div class="head ${d.theme ? 'has-cover' : ''}"><div class="avwrap"><div class="ring${f.cls}"${f.style}>${avatar(myProf)}</div>${stickersHTML(d.stickers)}</div>
      <div class="name${n.cls}"${n.style}>${esc(myProf.name)}</div></div>`;
    el.querySelectorAll('.ctabs button').forEach(b => b.classList.toggle('on', b.dataset.k === kind));
    const list = ITEM_CATALOG.filter(i => i.kind === kind);
    el.querySelector('#chint').textContent = `${list.filter(i => own.has(i.id)).length}/${list.length}개 보유${kind === 'sticker' ? ' · 스티커는 최대 3개까지 붙일 수 있어요' : ''} · 다시 누르면 해제`;
    el.querySelector('#cgrid').innerHTML = list.map(i => own.has(i.id)
      ? `<button class="ctile ${isEquipped(i) ? 'on' : ''}" data-id="${i.id}" style="--rc:${RARITY[i.rarity].color}"><div class="gprev">${itemPreview(i)}</div><b>${esc(i.name)}</b><small>${RARITY[i.rarity].label}${own.get(i.id) > 1 ? ` · x${own.get(i.id)}` : ''}</small>${isEquipped(i) ? '<i class="ceq">✓</i>' : ''}</button>`
      : `<div class="ctile lock" style="--rc:${RARITY[i.rarity].color}"><div class="gprev"><span class="q">?</span></div><b>???</b><small>${RARITY[i.rarity].label}</small></div>`).join('');
    el.querySelectorAll('.ctile[data-id]').forEach(b => b.onclick = async () => { await equip(ITEM[b.dataset.id]); paint(); });
  };
  el.querySelectorAll('.ctabs button').forEach(b => b.onclick = () => { kind = b.dataset.k; paint(); });
  paint(); refreshTickets();
}
// ---------- 여러 장 게시물 + 사진 위 스티커 ----------
// media: [{p: 본문 경로, t: 썸네일 경로, k: 'image'|'video'}] — 예전 게시물(1장)은 image_path 로 대신
const mediaOf = p => Array.isArray(p.media) && p.media.length ? p.media
  : (p.image_path ? [{ p: p.image_path, t: p.thumb_path, k: p.media_type === 'video' ? 'video' : 'image' }] : []);
const STK = new Map(); // postId → 스티커 행들
async function loadStickers(ids) {
  if (!ids.length) return;
  const { data, error } = await sb.from('post_stickers').select('id, post_id, media_idx, user_id, item_id, x, y, scale').in('post_id', ids);
  if (error) return; // 09 SQL 실행 전이면 조용히 무시
  ids.forEach(id => STK.set(id, []));
  data.forEach(r => STK.get(r.post_id)?.push(r));
}
const stickerLayer = (postId, idx) => `<div class="stk-layer" data-sl="${postId}:${idx}">${(STK.get(postId) || []).filter(r => r.media_idx === idx)
  .map(r => `<span class="pst" style="left:${r.x * 100}%;top:${r.y * 100}%;--s:${r.scale}">${ITEM[r.item_id]?.data.e || ''}</span>`).join('')}</div>`;
function refreshStickerLayers(postId) {
  document.querySelectorAll(`[data-sl^="${postId}:"]`).forEach(el => { el.outerHTML = stickerLayer(postId, +el.dataset.sl.split(':')[1]); });
}
// 사진·영상 한 장
function mediaEl(m, mode, alt) {
  if (m.k === 'video') return mode === 'reel'
    ? `<video src="${photoUrl(m.p)}" poster="${photoUrl(m.t || m.p)}" muted playsinline loop preload="none"></video>`
    : `<video src="${photoUrl(m.p)}" poster="${photoUrl(m.t || m.p)}" controls playsinline muted loop></video>`;
  return `<img src="${photoUrl(m.p)}" alt="${alt}" ${mode === 'reel' ? 'loading="lazy"' : ''}>`;
}
// 여러 장이면 좌우로 넘기는 슬라이드(인스타처럼 점 + 1/3)
function mediaCarousel(p, mode) {
  const items = mediaOf(p), alt = `${esc(p.author_name)}가 보낸 사진`;
  if (items.length <= 1) return `<div class="carwrap" data-idx="0"><div class="stage">${items[0] ? mediaEl(items[0], mode, alt) : ''}${stickerLayer(p.id, 0)}</div></div>`;
  return `<div class="carwrap multi" data-idx="0">
    <div class="car" data-car>${items.map((m, i) => `<div class="slide"><div class="stage">${mediaEl(m, mode, alt)}${stickerLayer(p.id, i)}</div></div>`).join('')}</div>
    <span class="car-n">1/${items.length}</span>
    <div class="car-dots">${items.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div></div>`;
}
// 현재 보이는 장의 영상만 재생
const currentVideo = scope => { const w = scope.querySelector('.carwrap'); if (!w) return null; const slides = w.querySelectorAll('.slide'); return (slides.length ? slides[+w.dataset.idx || 0] : w).querySelector('video'); };
function initCarousels(root, autoplay) {
  root.querySelectorAll('[data-car]').forEach(car => {
    const w = car.closest('.carwrap');
    let last = 0;
    car.addEventListener('scroll', () => {
      const i = Math.round(car.scrollLeft / car.clientWidth); if (i === last) return; last = i;
      w.dataset.idx = i;
      w.querySelector('.car-n').textContent = `${i + 1}/${car.children.length}`;
      w.querySelectorAll('.car-dots i').forEach((d, j) => d.classList.toggle('on', j === i));
      w.querySelectorAll('video').forEach(v => v.pause());
      if (autoplay()) { const v = currentVideo(w.parentElement); if (v) { v.muted = muted; v.play().catch(() => {}); } }
    }, { passive: true });
  });
}

// 스티커 꾸미기 편집기: 가챠로 뽑은 스티커만, 내 스티커만 옮기기·떼기(주인은 남의 것도 떼기 가능), 승인 없음
async function openDecorate(postId) {
  if (!me) return toast('로그인하면 스티커로 꾸밀 수 있어요');
  const p = findAny(postId); if (!p) return;
  const idx = +(document.querySelector('.overlay .carwrap')?.dataset.idx || 0);
  const m = mediaOf(p)[idx]; if (!m) return;
  const isOwnerPost = p.owner_id === me.id;
  const el = pageOverlay('decor', `
    <header class="pov-h cmp-h"><button class="icon-btn" data-x aria-label="닫기">${I.close}</button><b>스티커 꾸미기</b><button class="cmp-send" id="dsave">저장</button></header>
    <div class="dwrap"><div class="stage dstage" id="dstage"><img src="${photoUrl(m.k === 'video' ? (m.t || m.p) : m.p)}" alt="" draggable="false"><div class="dlayer" id="dlayer"></div></div></div>
    <div class="dtools" id="dtools" hidden><button data-a="-">작게</button><button data-a="+">크게</button><button data-a="x" class="danger">떼기</button></div>
    <p class="hint dhint" id="dhint"></p>
    <div class="dtray" id="dtray"><p class="hint">불러오는 중…</p></div>`);
  const $ = s => el.querySelector(s);
  // 최신 상태 불러오기(그 사이 다른 친구가 붙인 것도 보이게)
  const [st, inv] = await Promise.all([
    sb.from('post_stickers').select('id, user_id, item_id, x, y, scale, media_idx').eq('post_id', postId),
    sb.from('inventory').select('item_id').eq('user_id', me.id),
  ]);
  if (st.error) { el.remove(); return toast(/post_stickers|relation/i.test(st.error.message) ? '스티커 기능 준비 중이에요(관리자: 09 SQL 실행 필요)' : kerr(st.error)); }
  const rows = st.data.filter(r => r.media_idx === idx);
  const others = rows.filter(r => r.user_id !== me.id);
  const orig = new Map(rows.filter(r => r.user_id === me.id).map(r => [r.id, { ...r }]));
  let mine = [...orig.values()].map(r => ({ ...r }));
  const removed = new Set(); let sel = null;
  const myStickers = (inv.data || []).map(r => ITEM[r.item_id]).filter(i => i?.kind === 'sticker');

  const paint = () => {
    $('#dlayer').innerHTML =
      others.filter(r => !removed.has(r.id)).map(r => `<span class="pst other${isOwnerPost ? ' tap' : ''}${sel === r.id ? ' sel' : ''}" data-id="${r.id}" style="left:${r.x * 100}%;top:${r.y * 100}%;--s:${r.scale}">${ITEM[r.item_id]?.data.e || ''}</span>`).join('') +
      mine.map(r => `<span class="pst mine${sel === r.id ? ' sel' : ''}" data-id="${r.id}" style="left:${r.x * 100}%;top:${r.y * 100}%;--s:${r.scale}">${ITEM[r.item_id]?.data.e || ''}</span>`).join('');
    const selMine = mine.find(r => r.id === sel), selOther = others.find(r => r.id === sel);
    $('#dtools').hidden = !(selMine || selOther);
    $('#dtools').querySelectorAll('[data-a="-"],[data-a="+"]').forEach(b => b.hidden = !selMine);
    $('#dhint').textContent = `내 스티커 ${mine.length}/5 · 끌어서 옮기고, 눌러서 크기 조절${isOwnerPost ? ' · 내 피드라 친구 스티커도 눌러서 뗄 수 있어요' : ''}`;
  };
  // 트레이: 내가 가진 스티커
  $('#dtray').innerHTML = myStickers.length
    ? myStickers.map(i => `<button class="dts" data-item="${i.id}" style="--rc:${RARITY[i.rarity].color}" aria-label="${esc(i.name)} 붙이기">${i.data.e}</button>`).join('')
    : `<div class="dempty">아직 스티커가 없어요. 🎁 뽑기에서 스티커를 모아 보세요!<button class="btn primary" id="dgacha">🎁 뽑기</button></div>`;
  $('#dgacha')?.addEventListener('click', () => openGacha());
  $('#dtray').querySelectorAll('[data-item]').forEach(b => b.onclick = () => {
    if (mine.length >= 5) return toast('한 사진에 내 스티커는 5개까지예요');
    const r = { id: 'tmp' + Math.random().toString(36).slice(2), item_id: b.dataset.item, x: 0.5, y: 0.5, scale: 1, tmp: true };
    mine.push(r); sel = r.id; paint();
  });
  // 끌어서 옮기기 (내 스티커만), 탭하면 선택
  const stage = $('#dstage');
  let drag = null;
  stage.addEventListener('pointerdown', e => {
    const s = e.target.closest('.pst'); if (!s) { sel = null; return paint(); }
    const id = s.dataset.id;
    if (s.classList.contains('other')) { if (isOwnerPost) { sel = id; paint(); } return; }
    sel = id; paint();
    drag = { id, moved: false }; stage.setPointerCapture(e.pointerId); e.preventDefault();
  });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    const b = stage.getBoundingClientRect(), r = mine.find(x => x.id === drag.id); if (!r) return;
    r.x = Math.min(0.97, Math.max(0.03, (e.clientX - b.left) / b.width));
    r.y = Math.min(0.97, Math.max(0.03, (e.clientY - b.top) / b.height));
    drag.moved = true;
    const span = stage.querySelector(`.pst[data-id="${drag.id}"]`); if (span) { span.style.left = r.x * 100 + '%'; span.style.top = r.y * 100 + '%'; }
  });
  const end = () => { drag = null; };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  $('#dtools').onclick = e => {
    const a = e.target.dataset.a; if (!a || !sel) return;
    const r = mine.find(x => x.id === sel);
    if (a === 'x') { if (r) { mine = mine.filter(x => x !== r); if (!r.tmp) removed.add(r.id); } else removed.add(sel); sel = null; }
    else if (r) r.scale = Math.min(3, Math.max(0.4, +(r.scale + (a === '+' ? 0.25 : -0.25)).toFixed(2)));
    paint();
  };
  const changed = () => removed.size || mine.some(r => r.tmp || (orig.get(r.id) && ['x', 'y', 'scale'].some(k => orig.get(r.id)[k] !== r[k])));
  $('[data-x]').onclick = () => { if (!changed() || confirm('저장하지 않은 꾸미기가 사라져요. 닫을까요?')) el.remove(); };
  // 저장: 내 것만 추가·수정·삭제(+주인은 남의 것 삭제) → 서로 덮어쓰지 않음
  $('#dsave').onclick = async () => {
    const btn = $('#dsave'); btn.disabled = true; btn.textContent = '저장 중…';
    try {
      if (removed.size) { const { error } = await sb.from('post_stickers').delete().in('id', [...removed]); if (error) throw error; }
      const adds = mine.filter(r => r.tmp).map(r => ({ post_id: postId, media_idx: idx, user_id: me.id, item_id: r.item_id, x: r.x, y: r.y, scale: r.scale }));
      if (adds.length) { const { error } = await sb.from('post_stickers').insert(adds); if (error) throw error; }

// 승인: 바로 반영하고 5초간 되돌리기 제공 (되돌리면 다시 대기 상태로)
async function approve(id) {
  const p = findPost(id); if (!p) return;
  if (p.media_type === 'question' && !p.answer) return openAnswer(id); // 질문은 답하면서 올림
  closeLayers(); await leaveRow(id);
  const at = new Date().toISOString();
  const { error } = await sb.from('posts').update({ status: 'approved', approved_at: at }).eq('id', id);
  if (error) return toast(kerr(error));
  S.pending = S.pending.filter(x => x.id !== id);
  Object.assign(p, { status: 'approved', approved_at: at }); S.approved.push(p);
  S.justApproved = id; paintProfile();
  navigator.vibrate?.(8);
  setTimeout(() => refreshTickets(true), 400); // 승인하면 뽑기권 +1 → 🎁 버튼이 톡 튐
  toast(`${p.author_name}의 사진을 피드에 올렸어요`, { label: '되돌리기', fn: async () => {
    const { error } = await sb.from('posts').update({ status: 'pending', approved_at: null }).eq('id', id);
    if (error) return toast(kerr(error));
    S.approved = S.approved.filter(x => x.id !== id);
    Object.assign(p, { status: 'pending', approved_at: null }); S.pending.unshift(p); paintProfile();
  } });
}

// 거절/내리기: 화면에서 바로 치우고, 5초 뒤에 실제 삭제 (그 전엔 되돌리기 가능)
const pendingDeletes = new Map();
async function commitDelete(id) {
  const job = pendingDeletes.get(id); if (!job) return;
  pendingDeletes.delete(id); clearTimeout(job.timer);
  const { error } = await sb.from('posts').delete().eq('id', id);
  if (error) { toast(kerr(error)); return job.restore(); }
  sb.storage.from('photos').remove(mediaOf(job.p).flatMap(m => [m.p, m.t]).filter(x => x && !/^https?:/.test(x)));
}
addEventListener('pagehide', () => [...pendingDeletes.keys()].forEach(commitDelete));

async function removePost(id) {
  const p = findPost(id); if (!p) return;
  const wasPending = p.status === 'pending';
  closeLayers(); if (wasPending) await leaveRow(id);
  const list = wasPending ? 'pending' : 'approved';
  const idx = S[list].indexOf(p);
  S[list] = S[list].filter(x => x.id !== id); paintProfile();
  const restore = () => { S[list].splice(idx, 0, p); paintProfile(); };
  pendingDeletes.set(id, { p, restore, timer: setTimeout(() => commitDelete(id), 5000) });
  toast(wasPending ? '조용히 정리했어요' : '피드에서 내렸어요', { label: '되돌리기', fn: () => {
    const job = pendingDeletes.get(id); if (!job) return;
    clearTimeout(job.timer); pendingDeletes.delete(id); restore();
  } });
}

// 사진 회전 정보(EXIF)를 반영해서 디코딩 — iPhone 사진이 옆으로 눕는 문제 방지
async function decodeFile(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch {} }
  return loadImg(URL.createObjectURL(file));
}
function loadImg(src) { return new Promise((ok, no) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
async function resize(file, max) {
  const img = await decodeFile(file);
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}
