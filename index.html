// 승인: 바로 반영하고 5초간 되돌리기 제공 (되돌리면 다시 대기 상태로)
async function approve(id) {
  const p = findPost(id); if (!p) return;
  if (p.media_type === 'question' && !p.answer) return openAnswer(id); // 질문은 답하면서 올림
  closeLayers(); await leaveRow(id);
  const at = new Date().toISOString();
  const { error } = await sb.from('posts').update({ status: 'approved', approved_at: at }).eq('id', id);
  if (error) return toast(kerr(error));
  S.pending = S.pending.filter(x => x.id !== id);
  Object.assign(p, { status: 'approved', approved_at: at }); S.approved.push(p);
  S.justApproved = id; paintProfile();
  navigator.vibrate?.(8);
  toast(t('{name}의 사진을 피드에 올렸어요', { name: p.author_name === '익명의 친구' ? t(p.author_name) : p.author_name }), { label: t('되돌리기'), fn: async () => {
    const { error } = await sb.from('posts').update({ status: 'pending', approved_at: null }).eq('id', id);
    if (error) return toast(kerr(error));
    S.approved = S.approved.filter(x => x.id !== id);
    Object.assign(p, { status: 'pending', approved_at: null }); S.pending.unshift(p); paintProfile();
  } });
}

// 거절/내리기: 화면에서 바로 치우고, 5초 뒤에 실제 삭제 (그 전엔 되돌리기 가능)
const pendingDeletes = new Map();
async function commitDelete(id) {
  const job = pendingDeletes.get(id); if (!job) return;
  pendingDeletes.delete(id); clearTimeout(job.timer);
  const { error } = await sb.from('posts').delete().eq('id', id);
  if (error) { toast(kerr(error)); return job.restore(); }
  sb.storage.from('photos').remove(mediaOf(job.p).flatMap(m => [m.p, m.t]).filter(x => x && !/^https?:/.test(x)));
}
addEventListener('pagehide', () => [...pendingDeletes.keys()].forEach(commitDelete));

// 피드에서 내리기: 삭제하지 않고 보관함의 '숨긴 사진'으로(나만 보임)
async function hidePost(id) {
  const p = findPost(id); if (!p || p.status !== 'approved') return;
  closeLayers();
  const at = new Date().toISOString();
  const { error } = await sb.from('posts').update({ status: 'hidden', hidden_at: at }).eq('id', id);
  if (error) return toast(/check|constraint|23514/i.test(error.message + error.code) ? t('아직 준비 중이에요') : kerr(error));
  S.approved = S.approved.filter(x => x.id !== id);
  Object.assign(p, { status: 'hidden', hidden_at: at }); (S.hidden = S.hidden || []).unshift(p);
  paintProfile();
  toast(t('피드에서 내렸어요 · 보관함의 숨긴 사진에 있어요'), { label: t('되돌리기'), fn: () => restorePost(id) });
}
// 다시 올리기: 원래 위치(처음 승인한 시간)로 복귀
async function restorePost(id) {
  const p = findPost(id); if (!p || p.status !== 'hidden') return;
  closeLayers();
  const { error } = await sb.from('posts').update({ status: 'approved', hidden_at: null }).eq('id', id);
  if (error) return toast(kerr(error));
  S.hidden = S.hidden.filter(x => x.id !== id);
  Object.assign(p, { status: 'approved', hidden_at: null }); S.approved.push(p);
  S.justApproved = id; paintProfile(); toast(t('다시 피드에 올렸어요'));
}
async function removePost(id) {
  const p = findPost(id); if (!p) return;
  const wasPending = p.status === 'pending';
  closeLayers(); if (wasPending) await leaveRow(id);
  const list = wasPending ? 'pending' : p.status === 'hidden' ? 'hidden' : 'approved';
  const idx = S[list].indexOf(p);
  S[list] = S[list].filter(x => x.id !== id); paintProfile();
  const restore = () => { S[list].splice(idx, 0, p); paintProfile(); };
  pendingDeletes.set(id, { p, restore, timer: setTimeout(() => commitDelete(id), 5000) });
  toast(t(wasPending ? '조용히 정리했어요' : '삭제했어요'), { label: t('되돌리기'), fn: () => {
    const job = pendingDeletes.get(id); if (!job) return;
    clearTimeout(job.timer); pendingDeletes.delete(id); restore();
  } });
}

async function loadMyGroups(force) {
  if (!me) return MYG;
  if (!force && MYG.at && Date.now() - MYG.at < 30000) return MYG;
  const [m, f] = await Promise.all([
    sb.from('group_members').select('group_id, role, status').eq('user_id', me.id),
    sb.from('group_follows').select('group_id, notify').eq('user_id', me.id)]);
  if (m.error || f.error) { MYG.ok = false; MYG.at = Date.now(); return MYG; } // 18 SQL 전이면 그룹 없이 동작
  MYG.mem = new Map(m.data.map(r => [r.group_id, r])); MYG.fol = new Map(f.data.map(r => [r.group_id, r]));
  const ids = [...new Set([...MYG.mem.keys(), ...MYG.fol.keys()])];
  const groups = new Map();
  if (ids.length) {
    const [{ data }, th] = await Promise.all([sb.from('groups').select(GCOLS).in('id', ids),
      sb.from('posts').select('group_id, thumb_path, image_path, flagged').in('group_id', ids).eq('status', 'approved').order('created_at', { ascending: false }).limit(Math.min(400, ids.length * 12))]);
    (data || []).forEach(g => groups.set(g.id, g)); setThumbs(th.data || []);
  }
  MYG.groups = groups; MYG.ok = true; MYG.at = Date.now();
  return MYG;
}

async function renderGroup(key, fresh) {

  if (cached && !fresh) paintGroup();
  else if (!document.querySelector('#splash:not(.out)')) $app.innerHTML = `<div class="authwait"><span class="logo">${LOGO_DOT}</span></div>`;
  let r;
  try { r = await withTimeout(sb.from('groups').select(GCOLS).eq(byId ? 'id' : 'handle', byId ? key : key.toLowerCase()).maybeSingle(), 10000); }
  catch { return cached ? undefined : renderError(() => renderGroup(key)); }
  if (pageKey() !== myKey) return;
  if (r.error) return $app.innerHTML = `<div class="landing"><span class="logo">${LOGO}</span><div class="hero"><div style="margin-bottom:18px">${DOT('down', { size: 76, cls: 'float' })}</div><h1>Not yet<i class="pd">.</i></h1><p class="tagline">${esc(kerr(r.error))}</p><button class="btn primary block" onclick="go(location.pathname)">${t('홈으로')}</button></div></div>`;
  if (!r.data) {
    $app.innerHTML = `<div class="landing"><span class="logo">${LOGO}</span><div class="hero"><div style="margin-bottom:18px">${DOT('look', { size: 76, cls: 'blink' })}</div><h1>Private<i class="pd">?</i></h1>
      <p class="tagline">${t('없는 그룹이거나 비공개 그룹이에요.<br>비공개 그룹은 방장에게 받은 초대 링크로 참여 신청할 수 있어요.')}</p><button class="btn primary block" onclick="go(location.pathname)">${me ? t('홈으로') : t('내 피드 만들기')}</button></div></div>${navBar('')}`;
    return;
  }
  const g = r.data;
  const [ps, mem, fol, pend] = await Promise.all([
    sb.from('posts').select(GPOST_COLS).eq('group_id', g.id).order('created_at', { ascending: false }).limit(g.visibility === 'public' ? GROUP_MAX + 20 : 600),
    me ? sb.from('group_members').select('role, status').eq('group_id', g.id).eq('user_id', me.id).maybeSingle() : { data: null },
    me ? sb.from('group_follows').select('notify').eq('group_id', g.id).eq('user_id', me.id).maybeSingle() : { data: null },
    me && g.owner_id === me.id ? sb.from('group_members').select('user_id').eq('group_id', g.id).eq('status', 'pending') : { data: [] },
  ]).catch(() => [{ error: true }, {}, {}, {}]);
  if (pageKey() !== myKey) return;
  if (ps.error) return cached ? undefined : renderError(() => renderGroup(key));
  GTHUMBS.delete(g.id); setThumbs(ps.data);
  Object.assign(G, { g, posts: ps.data, mem: mem.data, fol: fol.data, pendingN: (pend.data || []).length, key, at: Date.now() });
  if (me) { // 내 그룹 목록도 같이 갱신
    mem.data ? MYG.mem.set(g.id, { group_id: g.id, ...mem.data }) : MYG.mem.delete(g.id);
    fol.data ? MYG.fol.set(g.id, { group_id: g.id, ...fol.data }) : MYG.fol.delete(g.id);
    if (mem.data || fol.data) MYG.groups.set(g.id, g); else MYG.groups.delete(g.id);
  }
  paintGroup();
  loadStickers(ps.data.filter(p => p.status === 'approved').map(p => p.id)).then(() => { if (G.g?.id === g.id) ps.data.forEach(p => STK.has(p.id) && refreshStickerLayers(p.id)); }).catch(() => {});

}

      <div class="label">${t('도배 방지 · 1인당 하루 업로드')}</div>

async function pickFriendsToGroup(g) {
  const w = sheet(`<div class="shead"><h3>Invite friends<i class="pd">.</i></h3><button class="icon-btn" aria-label="${t('닫기')}" onclick="closeSheet()">${I.close}</button></div>

    <div class="sheet-foot"><button class="btn primary block" id="gpsend" disabled>${t('초대 보내기')}</button></div>`);
  const ids = [...myFollows];
  const [pr, mem, inv] = await Promise.all([
    ids.length ? sb.from('profiles').select('id, name, handle, avatar_url').in('id', ids) : { data: [] },
    sb.from('group_members').select('user_id, status').eq('group_id', g.id),
    sb.from('group_invites').select('user_id').eq('group_id', g.id),
  ]);
  if (!w.isConnected) return;
  const st = new Map((mem.data || []).map(m => [m.user_id, m.status === 'active' ? t('멤버') : t('신청 중')]));
  (inv.data || []).forEach(r => { if (!st.has(r.user_id)) st.set(r.user_id, t('초대함')); });
  const people = byOrder((pr.data || []).sort((a, b) => a.name.localeCompare(b.name, 'ko')), 'friends');
  const picked = new Set();
  const $l = w.querySelector('#gpl'), $b = w.querySelector('#gpsend');
  const paint = () => {
    const q = w.querySelector('#gpq').value.trim().toLowerCase();
    const list = people.filter(p => !q || p.name.toLowerCase().includes(q) || (p.handle || '').includes(q));
    $l.innerHTML = !people.length ? `<p class="hint" style="padding:12px 0">${t('아직 친구가 없어요. 친구를 추가하거나 링크로 초대해 보세요.')}</p>`
      : list.map(p => { const s0 = st.get(p.id); return `<label class="frow gpick${s0 ? ' off' : ''}">${avatar(p, 'xs')}<span style="flex:1;min-width:0"><b>${esc(p.name)}</b><small>${p.handle ? '@' + esc(p.handle) : ''}</small></span>
          ${s0 ? `<small class="gp-st">${s0}</small>` : `<input type="checkbox" data-u="${p.id}"${picked.has(p.id) ? ' checked' : ''}>`}</label>`; }).join('') || `<p class="hint" style="padding:12px 0">${t('찾는 친구가 없어요')}</p>`;
    $l.querySelectorAll('[data-u]').forEach(c => c.onchange = () => { c.checked ? picked.add(c.dataset.u) : picked.delete(c.dataset.u); upd(); });
  };
  const upd = () => { $b.disabled = !picked.size; $b.textContent = picked.size ? t('{n}명에게 초대 보내기', { n: picked.size }) : t('초대 보내기'); };
  w.querySelector('#gpq').oninput = paint; paint();
  $b.onclick = async () => {

    <button class="btn primary block" id="epsave">${t('저장')}</button>`);
  const ta = w.querySelector('#eptext'), b = w.querySelector('#epsave'), strip = w.querySelector('#epm');
  const thumbOf = m => m.old ? thumbUrl({ thumb_path: m.t, image_path: m.p }) : m.previewUrl || (m.thumb ? URL.createObjectURL(m.thumb) : '');
  const paint = () => {
    strip.innerHTML = items.map((m, i) => `<div class="epm-i" data-i="${i}">${(m.k || m.kind) === 'video' && !m.old ? `<video src="${m.previewUrl}" muted playsinline></video>` : `<img src="${thumbOf(m)}" alt="">`}
        ${(m.k || m.kind) === 'video' ? `<span class="epm-v">${I.play}</span>` : ''}
        ${items.length > 1 ? `<button class="epm-x" data-rm="${i}" aria-label="${t('이 사진 빼기')}">${II.x}</button>` : ''}</div>`).join('')
      + (canAdd && items.length < 10 ? `<label class="epm-add" aria-label="${t('사진 더하기')}">+<input type="file" accept="image/*,video/*" multiple hidden></label>` : '');
    w.querySelector('#epmh').textContent = items.length < 2 ? t('사진은 1장 이상 있어야 해요. 다 지우려면 게시물을 삭제해 주세요')
      : asOwner || !p.group_id ? t('끌어서 순서를 바꾸고, ×로 뺄 수 있어요') : g?.closed ? t('끌어서 순서를 바꾸고, ×로 뺄 수 있어요 · 업로드가 마감돼 더할 수는 없어요') : t('끌어서 순서를 바꾸고, 빼거나 더할 수 있어요(최대 10장)');
    makeSortable(strip, o => { items = o.map(i => items[i]); paint(); });
    strip.querySelectorAll('[data-rm]').forEach(x => x.onclick = () => { items.splice(+x.dataset.rm, 1); paint(); });
    const inp = strip.querySelector('.epm-add input');
    if (inp) inp.onchange = async () => {
      let files = [...inp.files].slice(0, 10 - items.length);

    if (!textChanged && !mediaChanged) return closeSheet();
    b.disabled = true;
    if (asOwner) { // 주인·방장: 남은 사진의 예전 번호를 새 순서대로

      return refreshAfterEdit(id);
    }
    const status = x => { b.textContent = x; };
    try {
      let at = null;
      if (mediaChanged) {
        const fresh = items.filter(m => !m.old); if (fresh.some(m => m.kind === 'video')) unlockMedia(fresh);
        const list = [];
        for (const [i, m] of items.entries()) {
          if (m.old) { list.push({ p: m.p, t: m.t, k: m.k || 'image' }); continue; }
          const tag = ` (${i + 1}/${items.length})`;
          let main = m.main;
          if (m.job) { status(t('사진 준비 중{tag}…', { tag })); await m.job; main = m.main; }
          if (m.kind === 'video') main = await compressVideo(m, q => status(t('영상 줄이는 중{tag} {p}%', { tag, p: Math.round(q * 100) })));
          status(t('올리는 중{tag}…', { tag }));
          const uid = crypto.randomUUID(), dir = p.group_id || p.owner_id;
          const path = `${dir}/${uid}.${extOf(main)}`, tpath = `${dir}/${uid}_t.${extOf(m.thumb)}`;
          await Promise.all([uploadBlob(path, main), uploadBlob(tpath, m.thumb)]);
          list.push({ p: path, t: tpath, k: m.kind });
        }
        status(t('저장 중…'));
        const { data, error } = await sb.rpc('edit_post_media', { p_post: id, p_media: list });
        if (error) throw error;
        at = data;
        const patch = { media: list.length > 1 ? list : null, image_path: list[0].p, thumb_path: list[0].t, media_type: list[0].k };
        [findPost(id), HOME.posts?.find(x => x.id === id), p].filter(Boolean).forEach(x => Object.assign(x, patch));
      }
      if (textChanged) {
        const { data, error } = await sb.rpc('edit_post_text', { p_post: id, p_text: v });
        if (error) throw error;
        at = data;
      }
      [findPost(id), HOME.posts?.find(x => x.id === id), p].filter(Boolean).forEach(x => Object.assign(x, { text: v || null, edited_at: at || new Date().toISOString() }));
      if (mediaChanged) await loadStickers([id]).catch(() => {}); // 스티커 순서가 바뀌었을 수 있음

// 사진 회전 정보(EXIF)를 반영해서 디코딩 — iPhone 사진이 옆으로 눕는 문제 방지
async function decodeFile(file) {

function loadImg(src) { return new Promise((ok, no) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = no; i.src = src; }); }

// ---------- 미디어 최적화 (업로드 전 휴대폰에서 압축) ----------
const MAX_VIDEO_SEC = 10;
// 캔버스를 이미지로: WebP 지원 기기는 WebP(더 작음), 아니면 JPEG
// WebP 로 저장 못 하는 브라우저(iPhone Safari)는 PNG 를 만들어 버려서 매번 헛일 → 한 번 확인하면 다음부턴 바로 JPEG
let WEBP_OK = null;
async function canvasBlob(c, q) {
  if (WEBP_OK !== false) {
    const webp = await new Promise(r => c.toBlob(r, 'image/webp', q));
    if (webp && webp.type === 'image/webp') { WEBP_OK = true; return webp; }
    WEBP_OK = false;
  }
  return new Promise(r => c.toBlob(r, 'image/jpeg', q + 0.04));
}
// ---------- 그림 자르고 줄이기(앱 전체 공통 부품) ----------
// cropScale: src 의 (sx,sy,sw,sh) 부분을 긴 변 max 이하로 줄인 캔버스 · size 를 주면 그 크기(정사각형 등)로
function cropScale(src, sx, sy, sw, sh, max, size) {
  const k = size ? 1 : Math.min(1, max / Math.max(sw, sh)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(size?.[0] ?? sw * k)); c.height = Math.max(1, Math.round(size?.[1] ?? sh * k));
  c.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
const drawScaled = (src, w0, h0, max) => cropScale(src, 0, 0, w0, h0, max); // 통째로 줄이기
const jpegBlob = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q));
const extOf = b => ({ 'image/webp': 'webp', 'image/jpeg': 'jpg', 'video/mp4': 'mp4', 'video/webm': 'webm', 'video/quicktime': 'mov' })[b.type.split(';')[0]] || 'bin';

// 사진: 본문 1080px(약 150~300KB) + 그리드용 썸네일 480px(약 25~40KB)
async function prepareImage(file) {
  const img = await decodeFile(file);
  const big = drawScaled(img, img.width, img.height, 1080);
  img.close?.(); // 원본(1200만 화소) 메모리 바로 해제
  const main = await canvasBlob(big, 0.8);
  const thumb = await canvasBlob(drawScaled(big, big.width, big.height, 480), 0.7); // 썸네일은 줄인 그림에서(원본보다 훨씬 빠름)
  return { kind: 'image', main, thumb, previewUrl: URL.createObjectURL(main) };
}
// 사진 고르자마자: 원본으로 미리보기 + 뒤에서 줄이기(동시에 2장까지 — 메모리 부족으로 iPhone 이 멈추지 않게)
const imgQueue = (() => {
  let running = 0; const q = [];
  const next = () => { if (running >= 2 || !q.length) return; running++; const [fn, ok, no] = q.shift(); fn().then(ok, no).finally(() => { running--; next(); }); };
  return fn => new Promise((ok, no) => { q.push([fn, ok, no]); next(); });
})();
function quickImage(file) {
  const m = { kind: 'image', file, previewUrl: URL.createObjectURL(file), main: null, thumb: null };

  // 영상이 끝나면 새 장면이 안 와서 draw 가 다시 불리지 않음 → 끝·구간 끝을 따로 감지해 바로 녹화 종료
  // (예전엔 안전 타이머(길이+6초)까지 마지막 장면이 멈춘 채 녹화돼 4초 영상이 10초가 됐음)
  v.addEventListener('ended', finish, { once: true });
  v.addEventListener('pause', () => { if (!stop && v.currentTime >= end - 0.3) finish(); });
  const tick = setInterval(() => { if (v.ended || v.currentTime >= end) finish(); }, 100);
  draw();
  const guard = setTimeout(finish, (len + 3) * 1000);
  await done; clearTimeout(guard); clearInterval(tick); cleanup();
  const out = new Blob(chunks, { type: mime.split(';')[0] });
  if (out.size < 20000) return original();              // 거의 비어 있으면 실패로 보고 원본
  if (originalOk && out.size >= meta.file.size) return meta.file; // 이미 작은 원본이면 원본
  out.silent = !withAudio;
  return out;
}

// 업로드: 경로는 랜덤 UUID라 내용이 안 바뀜 → 브라우저 캐시 1년(재방문 시 전송량 0)
async function uploadBlob(path, blob) {
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType: blob.type.split(';')[0], cacheControl: '31536000' });
  if (error) throw error;
}
const thumbUrl = p => photoUrl(p.thumb_path || p.image_path);
const isVideo = p => p.media_type === 'video';

// 정사각형으로 가운데 잘라서 축소 (프로필 사진용)
async function resizeSquare(file, size) {
  const img = await decodeFile(file), side = Math.min(img.width, img.height);
  return jpegBlob(cropScale(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, [size, size]), 0.85); // 가운데 정사각형
}
