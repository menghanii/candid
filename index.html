<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<link rel="apple-touch-icon" sizes="180x180" href="brand/icon-180.png?v=3">

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root {
    --bg:#fff; --card:#fff; --fg:#0a0a0a; --sub:#8e8e93; --line:#ececec; --soft:#f5f5f5; --accent:#2b50ff; --danger:#ff3b30;
    --display:"Bricolage Grotesque", "Pretendard", sans-serif;
    --sans:"Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#000; --card:#141416; --fg:#f5f5f7; --sub:#8e8e93; --line:#2c2c30; --soft:#1c1c1f; --accent:#5c7cff; --danger:#ff6961;
  } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font-family:var(--sans); font-size:14px; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; cursor:pointer; }
  svg { display:block; }
  .app { max-width:480px; margin:0 auto; min-height:100vh; }
  .display { font-family:var(--display); font-weight:700; letter-spacing:-.03em; }
  .logo { font-family:var(--display); font-weight:800; font-size:26px; background:none; border:0; padding:0; letter-spacing:-.05em; }
  .logo i { color:var(--accent); font-style:normal; }

  /* 상단바 */
  .top { position:sticky; top:0; z-index:5; display:flex; align-items:center; height:calc(56px + env(safe-area-inset-top)); padding:env(safe-area-inset-top) 20px 0; background:color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .top .sp { flex:1; }
  .icon-btn { position:relative; background:none; border:0; padding:8px; margin-left:4px; border-radius:50%; }
  .icon-btn:hover { background:var(--soft); }
  .dot { position:absolute; top:4px; right:4px; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 2px var(--bg); }
  .dot.red { top:5px; right:6px; width:9px; height:9px; background:#ff3b30; }

  /* 프로필 */
  .head { text-align:center; padding:20px 20px 0; }
  .ring { display:inline-block; padding:3px; border-radius:50%; border:1.5px solid var(--accent); }
  .av { width:88px; height:88px; border-radius:50%; object-fit:cover; display:flex; align-items:center; justify-content:center; background:var(--soft); font-family:var(--display); font-weight:700; font-size:34px; color:var(--sub); }
  .av.sm { width:34px; height:34px; font-size:16px; flex:none; }
  .av-def { overflow:hidden; padding:0; }
  .av-def svg { display:block; }
  .setup { padding:12px 20px 40px; }
  .setup h1 { font-family:var(--display); font-weight:800; font-size:40px; line-height:1; letter-spacing:-.05em; margin:12px 0 10px; }
  .setup h1 em { color:var(--accent); font-style:normal; }
  .setup .hint { color:var(--sub); margin:0 0 8px; line-height:1.55; }
  .avopts { display:flex; gap:18px; margin:0 0 24px; }
  .avopt { display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:0; padding:0; font-size:12px; color:var(--sub); cursor:pointer; }
  .avopt .sel { display:block; padding:3px; border-radius:50%; border:2px solid transparent; transition:border-color .15s; }
  .avopt .av { width:64px; height:64px; overflow:hidden; color:var(--sub); }
  .avopt.on { color:var(--fg); font-weight:600; }
  .avopt.on .sel { border-color:var(--accent); }
  .name { font-family:var(--display); font-weight:700; font-size:30px; line-height:1.1; letter-spacing:-.03em; margin:14px 0 4px; }
  .desc { color:var(--sub); font-size:13px; }
  .desc.bio { color:var(--fg); font-size:14px; line-height:1.45; max-width:300px; margin:0 auto; word-break:keep-all; white-space:pre-line; }
  .bio-empty { background:none; border:1px dashed var(--line); border-radius:999px; padding:6px 14px; margin-top:2px; }
  .stats { display:flex; margin:22px 0 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .stats > div { flex:1; padding:14px 0; }
  .stats > div + div { border-left:1px solid var(--line); }
  .stats b { display:block; font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:-.02em; margin-bottom:4px; line-height:1; }
  .stats span { font-size:11px; color:var(--sub); letter-spacing:.04em; }
  .actions { display:flex; gap:8px; padding:18px 20px; }
  .btn { flex:1; border:1px solid var(--line); border-radius:999px; padding:12px 16px; font-weight:600; font-size:14px; background:var(--card); transition:transform .1s; }
  .btn:active { transform:scale(.98); }
  .btn.primary { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .btn.block { display:block; width:100%; }
  .btn:disabled { opacity:.5; }

  /* 탭 */
  .tabs { display:flex; gap:24px; padding:0 20px; border-bottom:1px solid var(--line); }
  .tabs button { background:none; border:0; border-bottom:1.5px solid transparent; margin-bottom:-1px; padding:12px 0; color:var(--sub); font-size:13px; font-weight:600; }
  .tabs button.on { color:var(--fg); border-bottom-color:var(--fg); }
  .tabs .n { color:var(--accent); margin-left:3px; }

  /* 그리드 */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding-top:2px; }
  .grid button { padding:0; border:0; aspect-ratio:4/5; background:var(--soft); overflow:hidden; }
  .grid img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s, opacity .3s; }
  .grid button:hover img { transform:scale(1.03); opacity:.92; }

  /* 빈 상태 */
  .empty { padding:48px 28px 56px; text-align:center; }
  .empty h2 { font-family:var(--display); font-weight:700; font-size:28px; letter-spacing:-.04em; margin:0 0 8px; line-height:1.15; }
  .empty p { color:var(--sub); margin:0 0 24px; line-height:1.6; }
  .ideas { display:flex; flex-direction:column; gap:8px; margin:0 0 24px; text-align:left; }
  .idea { display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:14px; }
  .idea .k { font-family:var(--display); font-weight:800; color:var(--accent); font-size:18px; width:18px; }

  /* 승인함 */
  .note { padding:14px 20px; color:var(--sub); font-size:12px; }
  .row { display:flex; gap:14px; margin:0 20px 10px; padding:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .row img { width:60px; height:75px; object-fit:cover; border-radius:8px; flex:none; cursor:pointer; }
  .row .meta { flex:1; min-width:0; line-height:1.45; }
  .row .meta .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .meta small { color:var(--sub); }
  .row .ab { display:flex; flex-direction:column; gap:6px; }
  .row .ab .btn { padding:7px 14px; flex:none; font-size:13px; }
  .mtag { display:inline-block; font-size:11px; font-weight:600; color:var(--accent); letter-spacing:.02em; }

  /* 게시물 상세 */
  .overlay { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.62); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; animation:fade .2s; }
  @keyframes fade { from { opacity:0; } }
  .post { width:100%; max-width:440px; max-height:100vh; overflow:auto; background:var(--card); }
  @media (min-width:481px) { .post { border-radius:20px; max-height:92vh; } }
  .post-h { display:flex; align-items:center; gap:10px; padding:12px 12px 12px 16px; }
  .post-h .who { flex:1; line-height:1.3; }
  .post-h .who b { display:block; font-size:14px; }
  .post-img { width:100%; aspect-ratio:4/5; object-fit:cover; display:block; background:var(--soft); }
  .post-c { padding:20px 20px 8px; }
  .quote { font-family:var(--display); font-weight:600; font-size:24px; line-height:1.3; letter-spacing:-.03em; margin:6px 0 10px; word-break:keep-all; }
  .quote::before { content:"“"; }
  .quote::after { content:"”"; }
  .by { color:var(--sub); font-size:13px; }
  .post-f { display:flex; align-items:center; padding:8px 12px 14px 20px; color:var(--sub); font-size:12px; }
  .post-f .sp { flex:1; }

  /* 바텀시트 */
  .sheet-wrap { position:fixed; inset:0; z-index:30; background:rgba(10,10,10,.45); display:flex; align-items:flex-end; justify-content:center; animation:fade .2s; }
  .sheet { width:100%; max-width:480px; max-height:94vh; overflow:auto; background:var(--bg); border-radius:24px 24px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom)); animation:up .34s cubic-bezier(.32,.72,0,1); }
  @keyframes up { from { transform:translateY(100%); } }
  .grab { width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 18px; }
  .sheet h3 { font-family:var(--display); font-weight:700; font-size:28px; letter-spacing:-.04em; margin:0 0 4px; line-height:1.1; }
  .sheet .hint { color:var(--sub); margin:0 0 20px; font-size:13px; }
  .label { font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.08em; margin:0 0 8px; }
  .chips { display:flex; gap:6px; overflow-x:auto; margin:0 -20px 20px; padding:0 20px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:13px; white-space:nowrap; }
  .chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .pick { display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center; aspect-ratio:4/5; max-height:46vh; margin:0 auto 16px; border-radius:16px; border:1.5px dashed var(--line); background:var(--card); color:var(--sub); cursor:pointer; overflow:hidden; font-size:13px; }
  .pick img { width:100%; height:100%; object-fit:cover; }
  .field { width:100%; padding:14px 16px; font:inherit; font-size:16px; border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--fg); margin-bottom:10px; outline:none; }
  .field:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .menu { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:10px; }
  .menu-item { display:block; width:100%; text-align:center; padding:16px; border:0; border-top:1px solid var(--line); background:none; font-size:15px; }
  .menu-item:first-child { border-top:0; }
  .menu-item.danger { color:var(--danger); font-weight:600; }

  /* 랜딩 */
  .landing { position:relative; }
  .landing > *:not(.wander) { position:relative; z-index:1; }
  .wander { position:absolute; left:0; top:0; z-index:2; padding:0; border:0; background:none; cursor:pointer; will-change:transform; -webkit-tap-highlight-color:transparent; }
  .wander svg { display:block; overflow:visible; }
  .wander .d3-happy { display:none; }
  .wander.cardw { z-index:4; pointer-events:none; }
  .wander.happy .d3-happy { display:inline; }
  .wander.happy .d3-eyes { display:none; }
  .landing { min-height:100vh; display:flex; flex-direction:column; padding:28px 24px calc(28px + env(safe-area-inset-bottom)); }
  .landing .hero { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .snap:nth-child(2) { animation-delay:.1s; } .snap:nth-child(3) { animation-delay:.2s; }
  .snap small { color:#8e8e93 !important; }
  .snap .mt { display:block; margin:8px 2px 0; font-size:9px; font-weight:700; color:#2b50ff; }
  .snap .mt + p { margin-top:2px; }
  @keyframes drop { from { opacity:0; translate:0 -28px; } }
  @media (prefers-reduced-motion: reduce) { .snap, .sheet, .grid button.fresh { animation:none !important; } }
  .collage { position:relative; height:280px; margin:8px 0 32px; }
  .snap { position:absolute; width:150px; padding:8px 8px 12px; background:#fff; color:#0a0a0a; animation:drop .7s cubic-bezier(.2,1.3,.4,1) backwards; border-radius:4px; box-shadow:0 10px 30px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06); }
  .snap .ph { aspect-ratio:4/5; border-radius:2px; }
  .snap p { margin:8px 2px 0; font-size:12px; font-weight:600; }
  .snap small { display:block; margin:2px 2px 0; color:var(--sub); font-size:10px; }
  .snap:nth-child(1) { left:2%; top:26px; transform:rotate(-7deg); }
  .snap:nth-child(2) { left:50%; top:0; transform:translateX(-50%) rotate(2deg); z-index:2; }
  .snap:nth-child(3) { right:2%; top:38px; transform:rotate(8deg); }
  .snap:nth-child(1) .ph { background:linear-gradient(160deg,#f6d5c4,#e9967a); }
  .snap:nth-child(2) .ph { background:linear-gradient(160deg,#d9dfe8,#8fa3bf); }
  .snap:nth-child(3) .ph { background:linear-gradient(160deg,#e8e2c8,#b8a970); }
  .landing h1 { font-family:var(--display); font-weight:800; font-size:50px; line-height:.95; margin:0 0 14px; letter-spacing:-.055em; }
  .landing h1 em, .empty h2 em { color:var(--accent); font-style:normal; }
  .landing .tagline { color:var(--sub); line-height:1.6; margin:0 0 32px; font-size:15px; }
  .social { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border-radius:999px; padding:15px; font-weight:600; font-size:15px; margin-bottom:10px; border:0; }
  .social.kakao { background:#FEE500; color:rgba(0,0,0,.85); }
  .social.google { background:var(--card); border:1px solid var(--line); }
  .fine { color:var(--sub); font-size:12px; margin:14px 0 0; text-align:center; line-height:1.6; }

  .toast { position:fixed; left:50%; bottom:32px; transform:translate(-50%, 10px); z-index:50; background:var(--fg); color:var(--bg); padding:12px 18px; border-radius:999px; font-size:13px; font-weight:600; opacity:0; transition:.25s; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; transform:translate(-50%, 0); }
  .toast.show.act { pointer-events:auto; }
  .toast-act { background:none; border:0; padding:0 0 0 10px; margin-left:8px; border-left:1px solid color-mix(in srgb, var(--bg) 30%, transparent); color:inherit; font-weight:800; text-decoration:underline; text-underline-offset:3px; }
  /* 인앱 브라우저 안내 */
  .inapp { display:flex; gap:10px; align-items:flex-start; padding:14px 16px; margin:0 0 16px; border-radius:16px; background:var(--soft); text-align:left; font-size:13px; line-height:1.5; }
  .inapp b { display:block; font-size:14px; margin-bottom:2px; }
  .inapp .btn { flex:none; padding:8px 12px; font-size:12px; }
  /* 업로드 시트: 보내기 버튼 하단 고정 */
  .sheet-foot { position:sticky; bottom:calc(-24px - env(safe-area-inset-bottom)); margin:6px -20px calc(-24px - env(safe-area-inset-bottom)); padding:12px 20px calc(16px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); }
  .pick { position:relative; }
  .pick video { width:100%; height:100%; object-fit:cover; }
  .vbadge { position:absolute; left:10px; top:10px; padding:5px 10px; border-radius:999px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; font-weight:700; }
  .repick { position:absolute; right:10px; bottom:10px; padding:6px 12px; border-radius:999px; background:rgba(0,0,0,.6); color:#fff; font-size:12px; font-weight:600; backdrop-filter:blur(6px); }
  .asked { margin:-8px 0 16px; padding:10px 14px; border-radius:12px; background:var(--soft); font-size:13px; }
  .asked b { color:var(--accent); }
  .row .ab .btn { min-height:40px; }
  .chip { min-height:38px; }
  .pending-acts { display:flex; gap:8px; padding:4px 16px 16px; }
  .thumb { flex:none; padding:0; border:0; background:none; border-radius:10px; overflow:hidden; }
  .row img { width:72px; height:90px; border-radius:10px; }
  .row.leaving { transition:opacity .2s, transform .2s; opacity:0; transform:translateX(-24px); }
  /* 그리드: 보낸 친구 이름 */
  .grid button { position:relative; }
  .grid button::after { content:""; position:absolute; inset:auto 0 0; height:38%; background:linear-gradient(transparent, rgba(0,0,0,.32)); pointer-events:none; }
  .vplay { position:absolute; right:7px; top:7px; z-index:1; color:#fff; filter:drop-shadow(0 1px 4px rgba(0,0,0,.4)); }
  .grid .from { position:absolute; left:7px; right:7px; bottom:6px; z-index:1; font-size:10px; font-weight:600; line-height:1.2; color:#fff; text-align:left; text-shadow:0 1px 6px rgba(0,0,0,.35); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grid button.fresh { animation:fresh 1.4s ease-out; }
  .grid button.fresh { outline:3px solid transparent; outline-offset:-3px; }
  @keyframes fresh { 0%,40% { outline-color:var(--accent); } 100% { outline-color:transparent; } }
  .grid button:active img { transform:scale(.97); }
  .mchip { display:inline-block; padding:3px 9px; border-radius:999px; background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent); font-size:11px; font-weight:700; }
  .msg-box { width:100%; min-height:84px; resize:none; line-height:1.5; font-size:15px; }
  .spin { display:flex; justify-content:center; padding:120px 0; }
  /* 시작 화면: 로고를 화면 정가운데 한 자리에 두고(로그인 중 화면도 같은 자리), 첫 화면이 그려지면 부드럽게 사라짐 */
  /* 캐릭터 닷 */
  .dotc { display:inline-block; overflow:visible; vertical-align:middle; }
  .dotc .dotc-b { transform-box:fill-box; transform-origin:50% 100%; }
  .dotc.hop .dotc-b { animation:dotHop 1.1s cubic-bezier(.3,.7,.4,1) infinite; }
  .dotc.blink .dotc-e { transform-box:fill-box; transform-origin:center; animation:dotBlink 3.6s infinite; }
  .dotc.float .dotc-b { animation:dotFloat 3s ease-in-out infinite; }
  .dotc.pop { animation:pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes dotHop { 0%,100% { transform:translateY(0) scale(1.08,.92); } 40% { transform:translateY(-14%) scale(.95,1.05); } 60% { transform:translateY(-14%) scale(1,1); } }
  @keyframes dotBlink { 0%, 91%, 100% { transform:scaleY(1); } 94% { transform:scaleY(.12); } }
  @keyframes dotFloat { 50% { transform:translateY(-4%); } }
  @media (prefers-reduced-motion: reduce) { .dotc .dotc-b, .dotc .dotc-e { animation:none !important; } }
  .wm-dot { display:inline-block; margin:0 0 .08em .06em; line-height:0; }
  .wm-dot .dotc { width:.62em; height:.62em; }
  .landing .hero > .btn { flex:none; }
  /* 시작 화면 변신: 통통 2번(0~1.1초) → 눈 감기 → 작아지며 사라짐 + 마침표 등장(~1.55초) */
  .wm-dot { position:relative; }
  .wm-period { position:absolute; left:.02em; bottom:.02em; width:.2em; height:.2em; border-radius:50%; background:var(--accent); transform:scale(0); }
  #splash.morph .dotc.hop .dotc-b { animation-duration:.55s; animation-iteration-count:2; }
  #splash.morph .dotc .dotc-e { transform-box:fill-box; transform-origin:center; animation:dotShut .18s ease 1.05s forwards; }
  #splash.morph .wm-dot .dotc { transform-origin:12% 100%; animation:dotToPeriod .32s cubic-bezier(.5,0,.75,0) 1.15s forwards; }
  #splash.morph .wm-period { animation:periodIn .3s cubic-bezier(.2,1.6,.4,1) 1.3s forwards; }
  @keyframes dotShut { to { transform:scaleY(.08); } }
  @keyframes dotToPeriod { to { transform:scale(.3); opacity:0; } }
  @keyframes periodIn { to { transform:scale(1); } }

  && !matchMedia('(prefers-reduced-motion: reduce)').matches;
(() => {
  const sp = document.querySelector('#splash .logo'); if (!sp) return;
  sp.innerHTML = `candid<span class="wm-dot">${DOT('base', { size: 22, tail: false, cls: 'hop' })}<i class="wm-period"></i></span>`;
  document.getElementById('splash').classList.add(SPLASH_MORPH ? 'morph' : 'stay');
})();

// 시작 화면 걷어내기: #app 에 첫 화면이 그려지면(로그인 중 화면 포함) 페이드아웃
(() => {
  const sp = document.getElementById('splash'), app = document.getElementById('app');
  const MIN = SPLASH_MORPH ? 1650 : 0, t0 = performance.now(); // 변신 애니메이션(시작 화면이 그려진 순간부터)이 끝날 때까지는 보여 줌
  const hide = () => {
    if (!sp || sp.classList.contains('out')) return;
    const wait = t0 + MIN - performance.now(); if (wait > 0) return setTimeout(hide, wait);
    app.classList.add('enter'); sp.classList.add('out'); setTimeout(() => { sp.remove(); app.classList.remove('enter'); }, 450);
  };
  new MutationObserver((_, ob) => { if (app.children.length) { ob.disconnect(); requestAnimationFrame(hide); } }).observe(app, { childList: true });
  setTimeout(hide, 12000); // 안전장치
})();
const sb = DEMO ? demoClient() : (window.supabase ? supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null);
const photoUrl = path => /^https?:/.test(path) ? path : sb.storage.from('photos').getPublicUrl(path).data.publicUrl; // 외부 주소(데모 친구 사진)는 그대로
const feedUrl = id => `${location.origin}${location.pathname}?u=${id}`;
let me = null, myProf = null;

async function boot() {
  if (!sb) return renderError(() => location.reload()); // 라이브러리 로드 실패(오프라인 등)
  try {
    await withTimeout((async () => {
      me = (await sb.auth.getSession()).data.session?.user || null;
      // 카카오·Google 로그인에서 막 돌아온 경우: 로그인 처리가 끝날 때까지 기다림(첫 화면이 잠깐 보이는 깜빡임 방지)
      const fromOAuth = /[#&?](access_token|code|error_description)=/.test(location.href) || sessionStorage.getItem('candid_oauth') === '1';
      try { sessionStorage.removeItem('candid_oauth'); } catch {}
      if (fromOAuth && !DEMO) showAuthWait(); // 로그인에서 돌아오는 중: 로고만 있는 화면 대신 '로그인하는 중…'
      if (!me && fromOAuth && !DEMO) {
        me = await new Promise(res => {
          const t = setTimeout(() => res(null), 6000);
          const { data } = sb.auth.onAuthStateChange((ev, s) => { if (s?.user) { clearTimeout(t); data.subscription.unsubscribe(); res(s.user); } });
        });
      }
      // 이 기기에서 지난번에 쓴 로그인 방법(카카오/Google) 기억 — 다른 방법으로 들어와 새 계정이 생기는 실수 방지
      try { PREV_LOGIN = localStorage.getItem('candid_last_login'); } catch {}
      const prov = me?.app_metadata?.provider;
      if (prov === 'kakao' || prov === 'google') try { localStorage.setItem('candid_last_login', prov); } catch {}
      if (me) {
        const r = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
        if (r.error) throw r.error;
        myProf = r.data;
        // 푸시 알림을 내 언어로 받도록 프로필에 지금 언어 저장(17 SQL 전이면 조용히 무시)
        if (myProf && 'lang' in myProf && myProf.lang !== LANG && !DEMO) sb.from('profiles').update({ lang: LANG }).eq('id', me.id).then(() => {}, () => {});
        await loadFollows();
        if (myProf?.onboarded) await applyInvite();
      }
    })(), 10000);
  } catch { return renderError(boot); }
  if (me && myProf && !myProf.onboarded) return renderSetup(true); // 첫 로그인: 프로필 설정
  // 카톡에서 '홈 화면에 추가하기'로 넘어온 경우(?install=1): 주소에서 지우고 설치 안내를 바로
  const wantInstall = new URLSearchParams(location.search).has('install');
  if (wantInstall) { const u = new URL(location.href); u.searchParams.delete('install'); history.replaceState(history.state, '', u.pathname + u.search); }
  route();
  if (wantInstall && !inApp) setTimeout(showInstallGuide, 400);
  else setTimeout(maybeShowInstall, 2500); // 화면이 뜬 뒤 조금 있다가 설치 권유
  // 알림: 홈 화면 앱(또는 iPhone 이 아닌 기기)에서 로그인 상태면 켜기 권유. iPhone Safari 는 홈 화면 추가가 먼저라 설치 안내가 우선
  if (me && !wantInstall && (installed() || !isIOS)) setTimeout(autoPush, 3500);
}
boot();

function route() {
  CUR = pageKey();
  document.documentElement.classList.remove('noscroll');
  const at = location.search.match(/^\?@([A-Za-z0-9_]{3,20})/); // 짧은 링크 ?@아이디
  if (at) return renderHandle(at[1].toLowerCase());
  const u = new URLSearchParams(location.search).get('u');
  if (u) return renderProfile(u);
  if (!me) return INVITE ? renderInvite(INVITE) : renderLanding();
  if (new URLSearchParams(location.search).has('home')) return renderHome(); // 하단 바 릴스 탭
  // 로그인: 친구가 있으면 홈(릴스), 없으면 내 피드
  myFollows.size ? renderHome() : go(feedUrl(me.id), true);
}

// ---------- 아이디(@handle) ----------
const HANDLE_RE = /^[a-z0-9_]{3,20}$/;
const RESERVED = ['admin', 'candid', 'help', 'support', 'root', 'system', 'null', 'undefined', 'api', 'www', 'official', 'me', 'settings'];
const HANDLES = new Map(); // handle → user id (한 번 찾은 건 기억)
async function renderHandle(h) {
  CUR = pageKey(); const myKey = CUR;
  let id = HANDLES.get(h);
  if (!id) {
    let r; try { r = await withTimeout(sb.from('profiles').select('id').eq('handle', h).maybeSingle(), 10000); } catch { return renderError(() => renderHandle(h)); }
    if (pageKey() !== myKey) return;
    if (r.error) return renderError(() => renderHandle(h));
    if (!r.data) {
      $app.innerHTML = `<div class="landing"><span class="logo">${LOGO}</span><div class="hero"><div style="margin-bottom:18px">${DOT('look', { size: 76, cls: 'blink' })}</div><h1>Not found<i class="pd">.</i></h1>
        <p class="tagline">${t('@{handle} 아이디를 가진 친구가 없어요. 아이디가 바뀌었을 수 있어요.', { handle: esc(h) })}</p><button class="btn primary block" onclick="go(location.pathname)">${me ? t('홈으로') : t('내 피드 만들기')}</button></div></div>`;
      return;
    }
    id = r.data.id; HANDLES.set(h, id);
  }
  renderProfile(id);
}
// 공유용 짧은 링크: 아이디가 있으면 ?@아이디, 없으면 기존 ?u=ID
const shareUrl = p => p?.handle ? `${location.origin}${location.pathname}?@${p.handle}` : feedUrl(p.id);

// ---------- 화면 전환 (페이지 새로고침 없이) ----------
// 하단 바·링크 이동 때 앱을 다시 불러오지 않고 주소만 바꾼 뒤 화면을 그림 → 로고 로딩 화면이 안 뜸
const CACHE = { home: null, prof: new Map() };
let CUR = '';
const pageKey = () => location.pathname + location.search;
function go(url, replace) {
  const u = new URL(url, location.href);
  if (u.pathname + u.search === pageKey() && !replace) return;
  history[replace ? 'replaceState' : 'pushState']({}, '', u.pathname + u.search);
  closeSheet(); document.querySelector('.overlay')?.remove();
  S.autoOpened = false;
  S.tab = tabOf(u.searchParams.get('tab'));
  scrollTo(0, 0);
  CUR = pageKey(); route();
}
// 뒤로가기/앞으로가기: 주소가 바뀐 경우에만 화면 다시 그림(시트 닫기용 히스토리는 무시)
addEventListener('popstate', () => {
  if (pageKey() === CUR) return;
  closeSheet(); document.querySelector('.overlay')?.remove();
  S.autoOpened = true; // 뒤로 와서 시트가 다시 열리지 않게
  S.tab = tabOf(new URLSearchParams(location.search).get('tab'));
  CUR = pageKey(); route();
});
// 앱 안의 링크(<a href="?u=...">)도 새로고침 없이 이동
document.addEventListener('click', e => {
  const a = e.target.closest('a[href]');
  if (!a || a.target || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const u = new URL(a.href, location.href);
  if (u.origin !== location.origin || u.pathname !== location.pathname) return;
  e.preventDefault(); go(u.href);
});

// ---------- 프로필 설정 (첫 로그인 / 편집) ----------
function renderSetup(first) {
  const social = https(myProf.social_avatar_url || me.user_metadata?.avatar_url || me.user_metadata?.picture);
  const prov = me.app_metadata?.provider;
  const socialLabel = t(prov === 'kakao' ? '카카오 프로필' : prov === 'google' ? 'Google 프로필' : '소셜 프로필');
  let choice = 'default', customUrl = null, customBlob = null;
  if (!first && myProf.avatar_url) { if (myProf.avatar_url === social) choice = 'social'; else { choice = 'custom'; customUrl = myProf.avatar_url; } }

  $app.innerHTML = `
    <header class="top"><span class="logo">${LOGO}</span><div class="sp"></div>
      <button id="skip" style="background:none;border:0;padding:8px 0;color:var(--sub);font-weight:600;font-size:14px">${t(first ? '건너뛰기' : '취소')}</button></header>
    <div class="setup">
      <h1>${first ? 'Set up your<br><em>profile.</em>' : 'Edit <em>profile.</em>'}</h1>
      <p class="hint">${t('친구들에게 보일 이름과 사진이에요.')}${first ? '<br>' + t('나중에 언제든 바꿀 수 있어요.') : ''}</p>
      ${first ? (() => {
        // 새 계정이 만들어진 첫 화면: 혹시 다른 로그인 방법으로 이미 가입했는지 확인
        const cur = me.app_metadata?.provider;
        const other = PREV_LOGIN && PREV_LOGIN !== cur ? PREV_LOGIN : null;
        return `<div class="acct-check ${other ? 'warn' : ''}">
          ${other
            ? t('<b>이 기기에서는 지난번에 {p}로 로그인했어요.</b>그 계정을 쓰려던 거라면 {p}로 다시 로그인해 주세요. 로그인 방법이 다르면 다른 계정이 돼요.', { p: PROVIDER_NAME[other] })
            : t('<b>처음이 아니신가요?</b>예전에 다른 방법(카카오/Google)으로 가입했다면, 그 방법으로 로그인해야 기존 피드가 보여요.')}
          <button class="btn" onclick="logout()">${other ? t('{p}로 다시 로그인하기', { p: PROVIDER_NAME[other] }) : t('다른 방법으로 로그인하기')}</button>
        </div>`;
      })() : ''}
      <div style="text-align:center;margin:8px 0 24px"><div class="ring" id="preview"></div></div>
      <div class="label">PROFILE PHOTO</div>
      <div class="avopts">
        <button class="avopt" data-c="default"><span class="sel"><span class="av">${DEFAULT_AV}</span></span>${t('기본')}</button>
        ${social ? `<button class="avopt" data-c="social"><span class="sel"><img class="av" src="${esc(social)}" alt="" referrerpolicy="no-referrer"></span>${socialLabel}</button>` : ''}
        <label class="avopt" data-c="custom"><span class="sel" id="customThumb"></span>${t('앨범에서 선택')}<input type="file" accept="image/*" id="avfile" hidden></label>
      </div>
      <div class="label">NAME</div>
      <input class="field" id="nm" maxlength="20" value="${esc(myProf.name)}" placeholder="${esc(myProf.name)}">
      ${'handle' in myProf ? `<div class="label">ID</div>
      <div class="hbox"><span>@</span><input class="field" id="hd" maxlength="20" value="${esc(myProf.handle || '')}" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" inputmode="email"></div>
      <p class="hmsg" id="hmsg">${t('영문 소문자·숫자·밑줄(_) 3~20자. 친구 검색과 공유 링크에 쓰여요.')}</p>` : ''}
      <div class="label">MESSAGE</div>
      <input class="field" id="bio" maxlength="60" value="${esc(myProf.bio || '')}" placeholder="${t('예: 굴욕샷 환영, 단 너무 심한 건 거절함 📸')}">
      <div style="height:10px"></div>
      <button class="btn primary block" id="done">${t(first ? '시작하기' : '저장')}</button>
    </div>`;

  const $ = s => $app.querySelector(s);
  // 아이디 실시간 확인: 형식 → 예약어 → 중복(0.3초 뒤 서버 확인)
  let hdOk = true;
  const hdState = (msg, ok) => {
    const m = $('#hmsg'); if (!m) return;
    m.textContent = msg; m.className = 'hmsg' + (ok === true ? ' ok' : ok === false ? ' bad' : '');
    hdOk = ok === true; $('#done').disabled = !hdOk;
  };
  const $hd = $('#hd');
  if ($hd) {
    let t, seq = 0;
    $hd.oninput = () => {
      const v = $hd.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
      if (v !== $hd.value) $hd.value = v;
      clearTimeout(t); seq++;
      if (v === myProf.handle) return hdState(t('지금 쓰고 있는 아이디예요'), true);
      if (!HANDLE_RE.test(v)) return hdState(t('영문 소문자·숫자·밑줄(_) 3~20자로 만들어 주세요'), false);
      if (RESERVED.includes(v)) return hdState(t('쓸 수 없는 아이디예요'), false);
      hdState(t('확인 중…'), null);
      const my = seq;
      t = setTimeout(async () => {
        const { data, error } = await sb.from('profiles').select('id').eq('handle', v).maybeSingle();
        if (my !== seq) return;
        if (error) return hdState(kerr(error), false);
        data && data.id !== me.id ? hdState(t('이미 있는 아이디예요'), false) : hdState(t('사용할 수 있어요 ✓'), true);
      }, 300);
    };
  }
  const currentUrl = () => choice === 'social' ? social : choice === 'custom' ? customUrl : null;
  const paint = () => {
    $('#preview').innerHTML = avatar({ avatar_url: currentUrl() });
    $('#customThumb').innerHTML = customUrl ? `<img class="av" src="${esc(customUrl)}" alt="">` : `<span class="av">${I.camera}</span>`;
    $app.querySelectorAll('.avopt').forEach(o => o.classList.toggle('on', o.dataset.c === choice));
  };
  paint();
  $app.querySelectorAll('button.avopt').forEach(o => o.onclick = () => { choice = o.dataset.c; paint(); });
  $('#avfile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    customBlob = await resizeSquare(f, 400);
    customUrl = URL.createObjectURL(customBlob); choice = 'custom'; paint();
  };
  $('#skip').onclick = async () => {
    if (first) { await sb.from('profiles').update({ onboarded: true }).eq('id', me.id); myProf.onboarded = true; }
    route();
    if (first) afterSignup();
  };
  $('#done').onclick = async e => {
    e.target.disabled = true; e.target.textContent = t('저장 중…');
    try {
      let url = currentUrl();
      if (choice === 'custom' && customBlob) {
        const path = `${me.id}/${crypto.randomUUID()}.jpg`;
        const up = await sb.storage.from('avatars').upload(path, customBlob, { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
        url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      }
      const patch = { name: $('#nm').value.trim() || myProf.name, bio: $('#bio').value.trim() || null, avatar_url: url, onboarded: true };
      if ($('#hd') && hdOk && $('#hd').value !== myProf.handle) patch.handle = $('#hd').value;
      const { error } = await sb.from('profiles').update(patch).eq('id', me.id);
      if (error && /23505|duplicate|unique/i.test((error.code || '') + error.message)) { hdState(t('이미 있는 아이디예요. 다른 걸로 해주세요'), false); throw new Error('dup'); }
      if (error) throw error;
      if (patch.handle) { HANDLES.set(patch.handle, me.id); CACHE.prof.delete(me.id); }
      Object.assign(myProf, patch);
      toast(t(first ? '환영해요!' : '프로필을 저장했어요'));
      route();
      if (first) afterSignup();
    } catch (err) { e.target.disabled = false; e.target.textContent = t(first ? '시작하기' : '저장'); if (err.message !== 'dup') toast(kerr(err)); }
  };
}

// ---------- 로그인 ----------
let PREV_LOGIN = null;
const PROVIDER_NAME = { kakao: t('카카오'), google: 'Google' };
function login(provider) {
  // 카톡 안의 카카오 로그인: 이미 카톡에 로그인돼 있어 동의 한 번이면 끝 → 그 자리에서 진행
  // 그 외 인앱(인스타 등)·Google: 인앱에서 막히므로 외부 브라우저로
  if (inApp && !DEMO && !(inKakao && provider === 'kakao')) return openExternal();
  try { localStorage.setItem('candid_last_login', provider); sessionStorage.setItem('candid_oauth', '1'); } catch {}
  showAuthWait(t('{provider} 로그인으로 이동 중…', { provider: PROVIDER_NAME[provider] || '' }));
  sb.auth.signInWithOAuth({ provider, options: { redirectTo: location.origin + location.pathname } });
}
// 로그인 중 화면: 버튼을 누른 뒤·로그인에서 돌아오는 동안 첫 화면(로그인 버튼)이 다시 비치지 않게
function showAuthWait(msg = t('로그인하는 중…')) {
  document.documentElement.classList.remove('noscroll');
  $app.innerHTML = `<div class="authwait"><span class="logo">${LOGO_DOT}</span><div class="aw-sub"><p>${esc(msg)}</p>
    <button class="aw-cancel" onclick="cancelAuthWait()">${t('취소')}</button></div></div>`;
  setTimeout(() => document.querySelector('.aw-cancel')?.classList.add('show'), 4000); // 오래 걸리면 취소 버튼
}
function cancelAuthWait() { try { sessionStorage.removeItem('candid_oauth'); } catch {} route(); }
// 카카오 로그인 화면에서 '뒤로' 등으로 그냥 돌아온 경우(이전 화면 복원): 잠시 뒤 원래 화면으로
addEventListener('pageshow', e => {
  if (e.persisted && document.querySelector('.authwait')) setTimeout(() => { if (document.querySelector('.authwait') && !me) cancelAuthWait(); }, 2500);
});
async function logout() { await sb.auth.signOut(); location.href = location.pathname; }

function renderLanding(inviter) {
  document.documentElement.classList.add('noscroll'); // 첫 화면은 스크롤 없이 한 화면에 고정
  const all = cfg.PROVIDERS || ['kakao', 'google'];
  // 카톡 안: 카카오만(Google은 인앱에서 막힘). 한국어가 아니면 Google 을 먼저
  const p = inKakao && all.includes('kakao') ? ['kakao'] : LANG === 'ko' ? all : [...all].sort((a, b) => (a === 'google' ? -1 : 0) - (b === 'google' ? -1 : 0));
  // 홈 화면 앱 첫 실행: 브라우저와 로그인이 따로라 소개 대신 로그인만
  const appFirst = isStandalone && !DEMO;
  $app.innerHTML = `
    <div class="landing">
      <span class="logo">${LOGO}</span>
      ${inviter && !appFirst ? `<div class="hero app1 invite1">${avatar(inviter, 'lg')}
        <h1>${t('{name}님이<br>초대했어요', { name: `<em>${esc(inviter.name)}</em>` })}</h1>
        <p class="tagline">${t('친구들이 내 피드를 채워주는 앱, candid.<br>앱을 설치하면 친구가 사진을 보낼 때 바로 알림이 와요.')}</p></div>
        <button class="btn primary block inv-install" onclick="installNow()">${t('📲 앱 설치하고 시작하기')}</button>

// 첫 화면의 3D 닷: 꼬물꼬물 계속 걸어 다님(순간이동 없이 매 프레임 조금씩). 가끔 멈춰 두리번, 누르면 깡충 + 웃음

    <filter id="${k}s" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="${k}g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="${k}c"><path d="${DOT_BODY}"/></clipPath></defs>
    <ellipse class="d3-shadow" cx="52" cy="95" rx="34" ry="5" fill="#000" opacity=".35" filter="url(#${k}g)"/>
    <g class="d3-body">
      <path d="${DOT_BODY}" fill="url(#${k}b)"/>
      <g clip-path="url(#${k}c)"><ellipse cx="50" cy="98" rx="46" ry="15" fill="#000" opacity=".22" filter="url(#${k}g)"/><ellipse cx="92" cy="56" rx="9" ry="30" fill="#fff" opacity=".16" filter="url(#${k}g)"/></g>
      <ellipse cx="33" cy="27" rx="13" ry="8" transform="rotate(-30 33 27)" fill="#fff" opacity=".38" filter="url(#${k}s)"/>
      <g class="d3-eyes">${eye(38)}${eye(62)}</g>
      <g class="d3-happy"><path d="M31 51 q7 -9 14 0 M55 51 q7 -9 14 0" fill="none" stroke="#0a0a0a" stroke-width="4.6" stroke-linecap="round"/></g>
      <circle cx="101" cy="83" r="7.5" fill="url(#${k}t)"/><circle cx="98.6" cy="80.4" r="2.4" fill="#fff" opacity=".4" filter="url(#${k}s)"/>

}
function startWander() {
  const w = document.getElementById('wander'); if (!w) return;
  const land = w.closest('.landing');
  wanderEngine(w, () => {
    const L = land.getBoundingClientRect(), stop = land.querySelector('.social, .inapp')?.getBoundingClientRect();
    return { x0: 8, x1: L.width - w.offsetWidth - 8, y0: 64, y1: Math.max(80, (stop ? stop.top - L.top : L.height * .6) - w.offsetHeight - 12) };
  }, { tap: true });
}
// 투표·질문 카드 안에서도 작은 3D 닷이 돌아다님(누를 수 없음 — 투표 버튼을 가리지 않게). 화면에 보일 때만 움직임
function cardDots(root = document) {
  root.querySelectorAll('.tstage').forEach(st => {
    if (st.querySelector('.wander') || st.closest('.dstage')) return;
    st.insertAdjacentHTML('beforeend', `<span class="wander cardw" aria-hidden="true">${DOT3D(30)}</span>`);
    const w = st.lastElementChild;
    const ctl = wanderEngine(w, () => ({ x0: 6, x1: st.clientWidth - w.offsetWidth - 6, y0: 6, y1: st.clientHeight - w.offsetHeight - 6 }), { speed: 22, start: false });
    if (!ctl) return;
    new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? ctl.play() : ctl.pause()), { threshold: .2 }).observe(st);
  });
}
// 꼬물꼬물 걷기 엔진: getBox() = 다닐 수 있는 범위(부모 기준 px). tap: 누르면 깡충, speed: 걷는 속도(px/초)
function wanderEngine(w, getBox, { tap = false, speed: SPEED = 34, start = true } = {}) {
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const svg = w.firstElementChild, body = svg.querySelector('.d3-body'), eyes = svg.querySelector('.d3-eyes'), shadow = svg.querySelector('.d3-shadow');
  const pupils = [...svg.querySelectorAll('.d3-pupil')].map(p => [p, +p.getAttribute('cx'), +p.getAttribute('cy')]);
  const box = getBox;
  let B = box(), x = B.x0 + (B.x1 - B.x0) * .7, y = B.y0 + (B.y1 - B.y0) * .55;
  let th = Math.PI, turn = 0, speed = 0, face = -1, phase = 0, mode = 'walk', modeT = 3 + Math.random() * 4, turnT = 0;
  let gaze = [0, 0], gazeT = [0, 0], blinkT = 2 + Math.random() * 3, blink = 0, jump = 0, last = performance.now();
  const set = () => {
    const sp = speed / SPEED, wob = Math.sin(phase);
    const sx = 1 + (.07 * sp + .015) * wob, sy = 1 - (.07 * sp + .015) * wob, tilt = 5 * sp * Math.sin(phase / 2);
    const lift = jump > 0 ? Math.sin(Math.PI * (1 - jump / .6)) * 26 : 0;
    w.style.transform = `translate(${x.toFixed(1)}px, ${(y - lift).toFixed(1)}px)`;
    body.setAttribute('transform', `translate(50 90) rotate(${(tilt * face).toFixed(2)}) scale(${(sx * face).toFixed(3)} ${sy.toFixed(3)}) translate(-50 -90)`);
    shadow.setAttribute('transform', `translate(${lift * .1} ${lift}) scale(${(1 - lift / 90).toFixed(3)} 1)`); shadow.style.opacity = (.35 - lift / 140).toFixed(2);
    eyes.setAttribute('transform', `translate(0 48) scale(1 ${(1 - blink).toFixed(2)}) translate(0 -48)`);
    pupils.forEach(([p, cx, cy]) => { p.setAttribute('cx', (cx + gaze[0]).toFixed(2)); p.setAttribute('cy', (cy + gaze[1]).toFixed(2)); });
  };
  let running = false;
  const tick = now => {
    if (!w.isConnected || !running) { running = false; return; }
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if ((turnT -= dt) <= 0) { turn = (Math.random() - .5) * 2.2; turnT = .6 + Math.random() * 1.4; }
    if ((modeT -= dt) <= 0) { mode = mode === 'walk' ? 'pause' : 'walk'; modeT = mode === 'walk' ? 3 + Math.random() * 5 : 1.2 + Math.random() * 1.8; if (mode === 'pause') gazeT = [(Math.random() - .5) * 4, (Math.random() - .3) * 2.4]; }
    // 벽 가까이 가면 가운데 쪽으로 서서히 방향을 틀기
    const cx = (B.x0 + B.x1) / 2, cy = (B.y0 + B.y1) / 2, mx = 40;
    let steer = turn;
    if (x < B.x0 + mx || x > B.x1 - mx || y < B.y0 + mx * .6 || y > B.y1 - mx * .6) {
      const want = Math.atan2(cy - y, cx - x); let d = want - th; d = Math.atan2(Math.sin(d), Math.cos(d)); steer = d * 2.4;
    }
    th += steer * dt;
    const target = mode === 'walk' && jump <= 0 ? SPEED : 0;
    speed += (target - speed) * Math.min(1, dt * 2.2);
    x = Math.min(B.x1, Math.max(B.x0, x + Math.cos(th) * speed * dt));
    y = Math.min(B.y1, Math.max(B.y0, y + Math.sin(th) * speed * dt * .55));
    phase += dt * (speed > 2 ? 7 + speed / 6 : 2.2);
    if (Math.abs(Math.cos(th)) > .2 && speed > 4) face += ((Math.cos(th) > 0 ? 1 : -1) - face) * Math.min(1, dt * 5); // 방향 바꿀 때 몸이 납작해졌다 뒤집힘
    if (mode === 'walk') gazeT = [1.4 * Math.abs(Math.cos(th)), 1.6 * Math.sin(th)];
    gaze = gaze.map((g, i) => g + (gazeT[i] - g) * Math.min(1, dt * 4));
    if ((blinkT -= dt) <= 0) { blink = 1; blinkT = 2.5 + Math.random() * 3.5; }
    blink = Math.max(0, blink - dt * 7);
    if (jump > 0) jump = Math.max(0, jump - dt);

  };
  set();
  if (tap) w.onclick = () => {
    if (jump > 0) return;

  };

  setTimeout(() => { B = box(); }, 400); // 글꼴·이미지 뒤에 버튼 위치가 바뀌는 경우
  const play = () => { if (calm || running || !w.isConnected) return; running = true; B = box(); requestAnimationFrame(ts => { last = ts; tick(ts); }); };
  if (start) play();

}

async function renderProfile(uid, fresh) {

  try {

      sb.from('profiles').select('*').eq('id', uid).maybeSingle(),
      sb.from('posts').select(POST_COLS).eq('owner_id', uid).order('created_at', { ascending: false }),

  if (pageKey() !== myKey) return; // 그 사이 다른 화면으로 이동함
  const [{ data: prof, error: e1 }, { data: posts, error: e2 }] = res;
  if (e1 || e2) return cached ? undefined : renderError(() => renderProfile(uid)); // 네트워크 오류를 '없는 피드'로 오인하지 않도록

let myFollows = new Set();
async function loadFollows() {
  myFollows = new Set();
  if (!me) return;
  const { data, error } = await sb.from('follows').select('followee_id').eq('follower_id', me.id);

async function toggleFollow(uid, btn) {
  if (!me) return toast(t('로그인하면 친구를 추가할 수 있어요'));
  const on = myFollows.has(uid);
  on ? myFollows.delete(uid) : myFollows.add(uid);
  if (btn) { btn.textContent = t(on ? '친구 추가' : '친구 ✓'); btn.classList.toggle('add', on); }
  const { error } = on
    ? await sb.from('follows').delete().eq('follower_id', me.id).eq('followee_id', uid)
    : await sb.from('follows').insert({ follower_id: me.id, followee_id: uid });
  if (error) { on ? myFollows.add(uid) : myFollows.delete(uid); if (btn) { btn.textContent = t(on ? '친구 ✓' : '친구 추가'); btn.classList.toggle('add', !on); } return toast(kerr(error)); }
  toast(t(on ? '친구에서 뺐어요' : '친구로 추가했어요. 새 사진이 홈에 떠요'));
}

async function openSearch() {
  const w = sheet(`<div class="shead"><h3>Find friends<i class="pd">.</i></h3><button class="icon-btn" aria-label="${t('닫기')}" onclick="closeSheet()">${I.close}</button></div>
    <div class="sbox">${I.search}<input class="field" id="sq" type="search" placeholder="${t('이름 또는 @아이디로 친구 찾기')}" autocomplete="off" autocapitalize="off" enterkeyhint="search"></div>
    <div id="sr"><p class="hint">${t('불러오는 중…')}</p></div>`, null, { top: true });
  const $q = w.querySelector('#sq'), $r = w.querySelector('#sr');
  const row = p => `<div class="frow"><a href="${feedUrl(p.id)}">${avatar(p, 'xs')}<span><b>${esc(p.name)}</b><small>${p.handle ? `@${esc(p.handle)}` : ''}${p.handle && p.bio ? ' · ' : ''}${esc(p.bio || '')}</small></span></a>
    ${p.id === me?.id ? `<small style="color:var(--sub)">${t('나')}</small>` : `<button class="btn ${myFollows.has(p.id) ? '' : 'add'}" onclick="toggleFollow('${p.id}', this)">${t(myFollows.has(p.id) ? '친구 ✓' : '친구 추가')}</button>`}</div>`;
  const showAll = async () => {
    // 검색어가 없을 때: 친구뿐 아니라 가입한 사람 전체를 먼저 보여줌(친구 여부는 버튼으로 구분)
    const { data, error } = await sb.from('profiles').select('*').eq('onboarded', true).limit(50);
    if (error) return $r.innerHTML = `<p class="hint">${esc(kerr(error))}</p>`;
    const list = (data || []).filter(p => p.id !== me?.id);
    $r.innerHTML = list.length ? `<div class="label" style="margin-top:8px">PEOPLE · ${list.length}</div>${list.map(row).join('')}` : `<p class="hint" style="padding:16px 0">${t('아직 가입한 사람이 없어요.')}</p>`;
  };
  let timer, seq = 0;
  $q.oninput = () => {
    clearTimeout(timer);
    const term = $q.value.trim();
    if (!term) return showAll();
    timer = setTimeout(async () => {
      const my = ++seq;
      // 이름 또는 아이디로 검색 (@로 시작하면 아이디만). 검색식을 깨는 특수문자는 제거
      const clean = term.replace(/^@/, '').replace(/[,()".:\\%_*]/g, '');
      if (!clean) return;
      const q = term.startsWith('@') ? `handle.ilike.%${clean.toLowerCase()}%` : `name.ilike.%${clean}%,handle.ilike.%${clean.toLowerCase()}%`;
      const { data, error } = await sb.from('profiles').select('*').or(q).eq('onboarded', true).limit(20);
      if (my !== seq) return; // 늦게 도착한 이전 검색 결과는 무시
      if (error) return $r.innerHTML = `<p class="hint">${esc(kerr(error))}</p>`;
      $r.innerHTML = data.length ? `<div class="label" style="margin-top:8px">RESULTS</div>${data.map(row).join('')}` : `<p class="hint" style="padding:16px 0">${t("'{q}'(으)로 찾은 친구가 없어요.", { q: esc(term) })}</p>`;
    }, 250);
  };
  showAll();
  setTimeout(() => $q.focus(), 350);
}

// ---------- 좋아요·댓글 (홈 릴스와 게시물 상세에서 공유) ----------
const SOC = new Map(); // postId → { likes, liked, comments }
// 게시물 조회 컬럼: select('*') 대신 화면에서 실제 쓰는 칸만 (media jsonb 등 큰 칸이 늘어도 영향 없게)
const POST_COLS = 'id,owner_id,author_name,mission,text,image_path,thumb_path,media_type,media,poll_options,status,answer,answered_at,approved_at,created_at,hidden_at';
async function loadSocial(ids) {
  if (!ids.length) return;
  ids.forEach(id => SOC.set(id, { likes: 0, liked: false, comments: 0 }));
  const [l, c] = await Promise.all([
    sb.from('likes').select('post_id, user_id').in('post_id', ids),
    sb.from('comments').select('post_id').in('post_id', ids),
  ]);
  (l.data || []).forEach(r => { const s = SOC.get(r.post_id); s.likes++; if (me && r.user_id === me.id) s.liked = true; });
  (c.data || []).forEach(r => SOC.get(r.post_id).comments++);
}
function paintSoc(id) {
  const s = SOC.get(id); if (!s) return;
  document.querySelectorAll(`[data-like="${id}"]`).forEach(b => { b.querySelector('span').innerHTML = s.liked ? I.heartOn : I.heart; b.querySelector('b').textContent = s.likes || ''; b.setAttribute('aria-pressed', s.liked); });
  document.querySelectorAll(`[data-cmt="${id}"] b`).forEach(b => b.textContent = s.comments || '');
}
async function toggleLike(id, only) {
  if (!me) return toast(t('로그인하면 좋아요를 남길 수 있어요'));
  const s = SOC.get(id); if (!s || (only && s.liked)) return;
  s.liked = !s.liked; s.likes += s.liked ? 1 : -1; paintSoc(id);
  if (s.liked) navigator.vibrate?.(8);
  const { error } = s.liked
    ? await sb.from('likes').insert({ post_id: id, user_id: me.id })
    : await sb.from('likes').delete().eq('post_id', id).eq('user_id', me.id);
  if (error) { s.liked = !s.liked; s.likes += s.liked ? 1 : -1; paintSoc(id); toast(kerr(error)); }
}
// 댓글 목록 + 입력칸 (릴스는 시트로, 게시물 상세는 사진 아래에 바로)
const commentsHtml = (foot = '') => `<div class="clist" data-cl><p class="hint">${t('불러오는 중…')}</p></div>
    <div class="cbar ${foot}">${me
      ? `<input class="field" data-cin maxlength="200" placeholder="${t('따뜻한 한마디 남기기')}" style="margin:0"><button class="btn primary" data-cgo>${t('게시')}</button>`
      : `<button class="btn primary block" onclick="closeSheet();location.href=location.pathname">${t('로그인하고 댓글 달기')}</button>`}</div>`;
function openComments(id, ownerId) {
  const w = sheet(`<h3>Comments<i class="pd">.</i></h3>${commentsHtml('sheet-foot')}`);

// 게시물 상세의 💬: 아래 댓글로 스크롤 + 입력칸 포커스
function focusPostComments(btn) {
  const sec = btn.closest('.post')?.querySelector('.pcmts'); if (!sec) return;
  sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(() => sec.querySelector('[data-cin]')?.focus({ preventScroll: true }), 350);
}
function mountComments(w, id, ownerId) {
  if (!w) return;
  const paint = async () => {
    const { data, error } = await sb.from('comments').select('id, body, created_at, user_id, profiles(name, avatar_url)').eq('post_id', id).order('created_at', { ascending: true });
    if (!w.isConnected) return;
    if (error) return w.querySelector('[data-cl]').innerHTML = `<p class="hint">${esc(kerr(error))}</p>`;
    const s = SOC.get(id); if (s) { s.comments = data.length; paintSoc(id); }
    w.querySelector('[data-cl]').innerHTML = data.length ? data.map(c => `
      <div class="crow">${avatar(c.profiles, 'xs')}<div style="flex:1;min-width:0"><b>${esc(c.profiles?.name || t('친구'))}</b> <small>${ago(c.created_at)}</small><div>${esc(c.body)}</div></div>
        ${me && (c.user_id === me.id || ownerId === me.id) ? `<button class="cdel" data-del="${c.id}" aria-label="${t('댓글 삭제')}">${t('삭제')}</button>` : ''}</div>`).join('')
      : `<p class="hint" style="text-align:center;padding:24px 0">${t('첫 댓글을 남겨 보세요')}</p>`;
    w.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const { error } = await sb.from('comments').delete().eq('id', b.dataset.del);
      error ? toast(kerr(error)) : paint();
    });
  };
  paint();
  const go = w.querySelector('[data-cgo]'), inp = w.querySelector('[data-cin]');
  if (go) {
    const send = async () => {
      const body = inp.value.trim(); if (!body) return;
      go.disabled = true;
      const { error } = await sb.from('comments').insert({ post_id: id, user_id: me.id, body });
      go.disabled = false;
      if (error) return toast(kerr(error));
      inp.value = ''; paint();
    };
    go.onclick = send; inp.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) send(); };
  }
}

let muted = true, HIDE_STK = false; // HIDE_STK: 릴스에서 스티커 숨김(세션 동안 유지)
async function fetchHome() {
  const ids = [...myFollows];
  const r = await withTimeout(sb.from('posts').select(POST_COLS).in('owner_id', ids).eq('status', 'approved').order('approved_at', { ascending: false }).limit(40), 10000);

  const o = await sb.from('profiles').select('*').in('id', ids);

  return { posts: r.data, owners: new Map((o.data || []).map(p => [p.id, p])) };
}
// 홈: 저장해 둔 릴스를 바로 보여주고 뒤에서 갱신. fresh=true(당겨서 새로고침)면 새로 받아 다시 그림
async function renderHome(fresh) {
  CUR = pageKey(); const myKey = CUR;
  $app.classList.remove('has-nav');
  if (CACHE.home && !fresh) {

const POLL = new Map(); // postId → { counts[], total, mine }
async function loadPolls(posts) {
  const polls = posts.filter(p => p.media_type === 'poll' && p.status === 'approved');
  if (!polls.length) return;
  polls.forEach(p => POLL.set(p.id, { counts: p.poll_options.map(() => 0), total: 0, mine: null }));
  const { data } = await sb.from('poll_votes').select('post_id, voter_key, option').in('post_id', polls.map(p => p.id));
  const key = voterKey();
  (data || []).forEach(v => { const s = POLL.get(v.post_id); if (!s || s.counts[v.option] == null) return; s.counts[v.option]++; s.total++; if (v.voter_key === key) s.mine = v.option; });
}
function pollHTML(p) {

  const owner = me && me.id === p.owner_id;

    const pct = s.total ? Math.round(s.counts[i] / s.total * 100) : 0;
    return `<div class="popt res ${s.mine === i ? 'mine' : ''}"><i style="width:${pct}%"></i><b>${esc(o)}${s.mine === i ? ' ✓' : ''}</b><em>${pct}%</em></div>`;
  }).join('');

async function vote(id, i) {

(function pullToRefresh() {
  let y0 = null, dy = 0, busy = false;
  // 인디케이터: 얇은 원형 링이 당긴 만큼 채워지고, 놓으면 회전
  const ind = document.createElement('div'); ind.className = 'ptr';
  ind.innerHTML = '<svg viewBox="0 0 36 36" width="30" height="30" aria-hidden="true"><circle cx="18" cy="18" r="14" pathLength="100"/></svg>';
  const ring = ind.querySelector('circle');
  let buzzed = false;
  document.body.appendChild(ind);
  const scroller = () => document.querySelector('.reels') || document.scrollingElement;
  const blocked = () => busy || document.querySelector('.sheet-wrap:not(.closing), .overlay');
  addEventListener('touchstart', e => { y0 = !blocked() && scroller().scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (scroller().scrollTop > 0) { y0 = null; dy = 0; }
    const p = Math.min(1, dy / 120);
    ring.style.strokeDasharray = `${p * 82} 100`;
    ind.style.opacity = Math.min(1, dy / 40);
    ind.style.transform = `translateY(${Math.min(dy * 0.35, 42) - 20}px) scale(${0.6 + 0.4 * p})`;
    if (p >= 1 && !buzzed) { buzzed = true; navigator.vibrate?.(6); }
    if (p < 1) buzzed = false;
  }, { passive: true });
  addEventListener('touchend', async () => {
    if (y0 == null) return; y0 = null;
    if (dy > 120 && !busy) {
      busy = true; ind.classList.add('spin'); ind.style.transform = 'translateY(22px) scale(1)'; ring.style.strokeDasharray = '';
      try { document.querySelector('.reels') ? await renderHome(true) : S.uid ? await renderProfile(S.uid, true) : location.reload(); } finally {
        busy = false; ind.classList.remove('spin');
      }
    }
    ind.style.opacity = 0; ind.style.transform = 'translateY(-20px) scale(.6)'; dy = 0; buzzed = false;
  });
})();

// ---------- 바텀시트 ----------
// guard: 배경을 눌러 닫기 전에 호출, false 를 돌려주면 닫지 않음
// opts.top: 위에서 내려오는 패널(상단 메뉴에서 여는 친구 검색 등)
function sheet(html, guard, opts = {}) {
  closeSheet();
  const w = document.createElement('div');
  w.className = 'sheet-wrap' + (opts.top ? ' from-top' : '');
  w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true');
  w.innerHTML = opts.top ? `<div class="sheet">${html}<div class="grab"></div></div>` : `<div class="sheet"><div class="grab"></div>${html}</div>`;
  w._guard = guard || (() => true);
  w.onclick = e => { if (e.target === w && w._guard()) closeSheet(); };
  document.body.appendChild(w);
  dragToClose(w);
  return w;
}
// 시트를 끌어서 닫기: 아래 시트는 아래로, 위 패널은 위로. 110px 이상 또는 빠르게 튕기면 닫힘
function dragToClose(w) {
  const sh = w.querySelector('.sheet');
  const dir = w.classList.contains('from-top') ? -1 : 1;
  const atEdge = () => dir === 1 ? sh.scrollTop <= 0 : sh.scrollTop + sh.clientHeight >= sh.scrollHeight - 1;
  let y0 = null, x0 = 0, t0 = 0, dy = 0, dragging = false;
  sh.addEventListener('touchstart', e => {
    const fromGrab = e.target.closest('.grab');
    if (!fromGrab && (!atEdge() || e.target.closest('textarea, .chips'))) return y0 = null;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; t0 = Date.now(); dy = 0; dragging = false;
  }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (y0 == null) return;
    const ny = (e.touches[0].clientY - y0) * dir, nx = e.touches[0].clientX - x0;
    if (!dragging) {
      if (Math.abs(nx) > 10 && Math.abs(nx) > Math.abs(ny)) return y0 = null; // 가로 스와이프(칩 등)는 양보
      if (ny > 6 && atEdge()) { dragging = true; sh.style.transition = 'none'; document.activeElement?.blur?.(); } else return;
    }
    e.preventDefault();
    dy = Math.max(0, ny);
    sh.style.transform = `translateY(${dy * dir}px)`;
    w.style.backgroundColor = `rgba(10,10,10,${0.45 * (1 - Math.min(1, dy / 400))})`;
  }, { passive: false });
  sh.addEventListener('touchend', () => {
    if (!dragging) return y0 = null;
    const fast = dy / Math.max(1, Date.now() - t0) > 0.5;
    y0 = null; dragging = false;
    if ((dy > 110 || (fast && dy > 30)) && w._guard()) return closeSheet();
    sh.style.transition = 'transform .25s cubic-bezier(.32,.72,0,1)'; sh.style.transform = ''; w.style.backgroundColor = '';
  });
}
// 닫기: 아래로 미끄러지며 사라짐 (닫히는 중인 시트는 다른 곳에서 '열린 시트'로 보지 않음)
function closeSheet() {
  const w = document.querySelector('.sheet-wrap:not(.closing)'); if (!w) return;
  const done = w._onClose; w._onClose = null;
  w.classList.add('closing');
  const sh = w.querySelector('.sheet');
  sh.style.transition = 'transform .22s cubic-bezier(.32,.72,0,1)'; sh.style.transform = w.classList.contains('from-top') ? 'translateY(-100%)' : 'translateY(100%)';
  setTimeout(() => w.remove(), 230);
  done?.();
}
addEventListener('keydown', e => { if (e.key === 'Escape') { const w = document.querySelector('.sheet-wrap:not(.closing)'); if (w) { if (w._guard()) closeSheet(); } else document.querySelector('.overlay')?.remove(); } });
const menu = items => sheet(`<div class="menu">${items}</div><div class="menu"><button class="menu-item" onclick="closeSheet()">${t('취소')}</button></div>`);

function openCompose(mi = 0, asked = false, mode = 'media', pick = false) {
