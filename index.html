        <div class="trim" id="trim" hidden></div>
        <div class="caprow"><span class="capav" id="capav"></span>
          <textarea id="text" maxlength="80" rows="1" placeholder="${t('{name}에게 한마디…', { name })}" enterkeyhint="done"></textarea></div>
        <div class="capmeta"><div class="cmp-sugs" id="sugs">${['이 표정 레전드 ㅋㅋ', '인생샷 인정 📸', '몰래 찍음 🤫', '이거 기억나?', '너무 잘 나와서 보냄', '박제 완료'].map(x => `<button type="button">${t(x)}</button>`).join('')}</div><span class="capcnt" id="capcnt">0/80</span></div>
      </section>
      <section data-sec="poll">
        <textarea class="cmp-cap big" id="pq" maxlength="80" rows="2" placeholder="${t('무엇을 물어볼까요? (예: {name} 다음 머리 스타일은?)', { name })}"></textarea>
        <div id="opts"></div>
        <button class="cmp-add" id="addopt">${t('+ 선택지 추가')}</button>
        <p class="cmp-note">${t('{name}님은 투표할 수 없고, 다른 친구들이 투표해요.', { name })}</p>
      </section>
      <section data-sec="question">
        <textarea class="cmp-cap big" id="qq" maxlength="120" rows="3" placeholder="${t('{name}님에게 궁금한 것 (예: 우리 처음 만난 날 기억나?)', { name })}"></textarea>
        <p class="cmp-note">${t('답은 {name}님만 할 수 있고, 답하면 질문과 함께 피드에 올라가요.', { name })}</p>
      </section>
      <div class="cmp-who">
        <div class="cmp-whohead"><span>${t('보내는 사람')}</span>
          <div class="cmp-seg" role="radiogroup"><button data-who="name" role="radio">${t('이름')}</button><button data-who="anon" role="radio">${t('🎭 익명')}</button></div></div>
        <div class="cmp-whoval" id="whoval"></div>
      </div>
    </div>
    <div class="cmp-foot"><button class="btn primary block cmp-go" id="send" disabled>${t('보내기')}</button>
      <p>${t('{name}님이 승인하면 피드에 올라가요', { name })}${me ? '' : t(' · 로그인 없이 보낼 수 있어요')}</p></div>`);
  const $ = s => el.querySelector(s);
  const $send = $('#send'), $file = $('#file');
  const dirty = () => media || [...el.querySelectorAll('#text, #pq, #qq, #opts input')].some(i => i.value.trim());
  // 닫기(✕ · 뒤로가기): 작성 중이면 확인
  history.pushState({ compose: 1 }, '');
  const close = (fromPop) => {
    if (dirty() && !confirm(t('작성 중인 내용이 사라져요. 닫을까요?'))) { if (fromPop) history.pushState({ compose: 1 }, ''); return; }
    removeEventListener('popstate', onPop); el.remove();
    if (!fromPop && history.state?.compose) history.back();
    setTimeout(maybeShowInstall, 800); // 링크로 들어오면 작성 화면이 먼저 떠서 배너가 밀려 있었음 → 닫은 뒤에 보여줌
  };
  const onPop = () => document.body.contains(el) ? close(true) : removeEventListener('popstate', onPop);
  addEventListener('popstate', onPop);
  $('[data-x]').onclick = () => close(false);

  const refresh = () => {
    const opts = [...el.querySelectorAll('#opts input')].map(i => i.value.trim()).filter(Boolean);
    $send.disabled = !(mode === 'media' ? media : mode === 'poll' ? $('#pq').value.trim().length >= 2 && opts.length >= 2 : $('#qq').value.trim().length >= 2);
  };
  const setMode = m => {
    mode = m;
    el.querySelectorAll('.cmp-modes button').forEach(b => { b.classList.toggle('on', b.dataset.mode === m); b.setAttribute('aria-selected', b.dataset.mode === m); });
    el.querySelectorAll('[data-sec]').forEach(s => s.hidden = s.dataset.sec !== m);
    refresh();
  };
  el.querySelectorAll('.cmp-modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  // 투표 선택지 2~5개
  const addOpt = () => {
    const box = $('#opts'), n = box.children.length; if (n >= 5) return;
    const d = document.createElement('div'); d.className = 'optrow';
    d.innerHTML = `<span>${n + 1}</span><input class="field" maxlength="30" placeholder="${t('선택지 {n}', { n: n + 1 })}">${n >= 2 ? `<button aria-label="${t('선택지 삭제')}">✕</button>` : ''}`;
    d.querySelector('input').oninput = refresh;
    const x = d.querySelector('button'); if (x) x.onclick = () => { d.remove(); [...box.children].forEach((r, i) => r.querySelector('span').textContent = i + 1); $('#addopt').hidden = false; refresh(); };
    box.appendChild(d); $('#addopt').hidden = box.children.length >= 5;
  };
  addOpt(); addOpt();
  $('#addopt').onclick = () => { addOpt(); refresh(); };
  $('#pq').oninput = refresh; $('#qq').oninput = refresh;

  // 여러 장 선택(최대 10장): 한 장씩 준비하고, 2장 이상이면 좌우로 넘기는 미리보기
  $file.onchange = async () => {
    let files = [...$file.files]; if (!files.length) return;
    if (files.length > 10) { files = files.slice(0, 10); toast(t('한 번에 10장까지 보낼 수 있어요. 앞 10장만 골랐어요')); }
    const pk = $('#pick');
    pk.classList.remove('has'); pk.classList.add('busy');
    pk.innerHTML = `<span class="cmp-empty"><b>${t('준비 중…')}</b></span>`; pk.appendChild($file);
    $send.disabled = true;
    const ready = [];
    for (const [i, f] of files.entries()) {
      pk.querySelector('.cmp-empty b').textContent = files.length > 1 ? t('준비 중 ({i}/{n})', { i: i + 1, n: files.length }) : t(f.type.startsWith('video/') ? '영상 준비 중…' : '사진 준비 중…');
      try { ready.push(f.type.startsWith('video/') ? await prepareVideoMeta(f) : await prepareImage(f)); } catch {}
    }
    pk.classList.remove('busy');
    if (!ready.length) { media = null; pk.querySelector('.cmp-empty').innerHTML = `${I.camera}<b>${t('다시 선택해 주세요')}</b><small>${t('이 파일은 열 수 없어요')}</small>`; return refresh(); }
    if (ready.length < files.length) toast(t('{n}개는 열 수 없어서 뺐어요', { n: files.length - ready.length }));
    media = ready;
    media.forEach(m => { if (m.kind === 'video') { m.start = 0; m.end = Math.min(m.duration, MAX_VIDEO_SEC); } });
    const one = m => m.kind === 'video'
      ? `<video src="${m.previewUrl}" poster="${URL.createObjectURL(m.thumb)}" muted playsinline autoplay loop></video>
         <span class="vbadge">${t('{s}초', { s: Math.round((m.end - m.start) * 10) / 10 })}</span>`
      : `<img src="${m.previewUrl}" alt="${t('고른 사진')}">`;
    pk.classList.add('has');
    pk.innerHTML = media.length === 1 ? one(media[0]) + `<span class="repick">${t('바꾸기')}</span>`
      : `<div class="carwrap multi" data-idx="0"><div class="car" data-car>${media.map(m => `<div class="slide"><div class="stage">${one(m)}</div></div>`).join('')}</div>
         <span class="car-n">1/${media.length}</span><div class="car-dots">${media.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div></div><span class="repick">${t('다시 고르기')}</span>`;
    pk.appendChild($file);
    initCarousels(pk, () => false);
    // 영상 구간 자르기: 지금 보이는 장이 영상이면 아래에 구간 선택 바 표시
    const curIdx = () => +(pk.querySelector('.carwrap')?.dataset.idx || 0);
    const curVideoEl = () => { const sl = pk.querySelectorAll('.slide'); return (sl.length ? sl[curIdx()] : pk).querySelector('video'); };
    pk.querySelector('[data-car]')?.addEventListener('scroll', () => setTimeout(showTrim, 60), { passive: true });
    showTrim();
    refresh();
    function showTrim() {
      const m = media[curIdx()], box = $('#trim');
      if (!m || m.kind !== 'video' || !(m.duration > 1)) { box.hidden = true; return; }
      box.hidden = false;
      const D = m.duration, fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
      box.innerHTML = `<div class="trim-head"><b>${t('영상 구간')}</b><span id="trimv"></span></div>
        <div class="trim-bar"><div class="trim-sel" id="tsel"></div>
          <input type="range" class="tr" id="ta" min="0" max="${D}" step="0.1" value="${m.start}" aria-label="${t('시작')}">
          <input type="range" class="tr" id="tb" min="0" max="${D}" step="0.1" value="${m.end}" aria-label="${t('끝')}"></div>
        <small>${t('양쪽 손잡이를 끌어 올릴 부분을 골라요 · 최대 {n}초', { n: MAX_VIDEO_SEC })}</small>`;
      const ta = box.querySelector('#ta'), tb = box.querySelector('#tb'), v = curVideoEl();
      const paint = () => {
        box.querySelector('#tsel').style.left = (m.start / D * 100) + '%';
        box.querySelector('#tsel').style.width = ((m.end - m.start) / D * 100) + '%';
        box.querySelector('#trimv').textContent = `${fmt(m.start)} – ${fmt(m.end)} · ${t('{s}초', { s: Math.round((m.end - m.start) * 10) / 10 })}`;
        const badge = (pk.querySelectorAll('.slide')[curIdx()] || pk).querySelector('.vbadge'); if (badge) badge.textContent = t('{s}초', { s: Math.round((m.end - m.start) * 10) / 10 });
      };
      const onMove = which => {
        let a = +ta.value, b = +tb.value;
        if (which === 'a') { a = Math.min(a, b - 1); if (b - a > MAX_VIDEO_SEC) b = a + MAX_VIDEO_SEC; }
        else { b = Math.max(b, a + 1); if (b - a > MAX_VIDEO_SEC) a = b - MAX_VIDEO_SEC; }
        m.start = Math.max(0, a); m.end = Math.min(D, b); ta.value = m.start; tb.value = m.end;
        if (v) { v.currentTime = which === 'a' ? m.start : Math.max(m.start, m.end - 1); }
        paint();
      };
      ta.oninput = () => onMove('a'); tb.oninput = () => onMove('b');
      // 미리보기는 고른 구간만 반복
      if (v && !v._trimLoop) { v._trimLoop = true; v.addEventListener('timeupdate', () => { const mm = media[curIdx()]; if (mm?.kind === 'video' && (v.currentTime >= mm.end || v.currentTime < mm.start - 0.3)) v.currentTime = mm.start; }); }
      paint();
    }
  };
  // 보내는 사람 선택 버튼
  let who = 'name';
  const setWho = w => {
    const typedNow = $('#author')?.value;
    who = w;
    el.querySelectorAll('.cmp-seg button').forEach(b => { b.classList.toggle('on', b.dataset.who === w); b.setAttribute('aria-checked', b.dataset.who === w); });
    $('#whoval').innerHTML = w === 'anon'
      ? `<div class="who-card"><span class="who-ic">🎭</span><span><b>${t('익명의 친구')}</b><small>${t('누가 보냈는지 {name}님도 알 수 없어요', { name })}</small></span></div>`
      : me
        ? `<div class="who-card">${avatar(myProf, 'xs')}<span><b>${esc(myProf?.name || '')}</b><small>${myProf?.handle ? '@' + esc(myProf.handle) + ' · ' : ''}${t('내 프로필 이름으로 보내요')}</small></span></div>`
        : `<input class="field" id="author" maxlength="12" placeholder="${t('내 이름 (예: 지수)')}" value="${esc(typedNow ?? nick)}" autocomplete="off">`;
  };
  el.querySelectorAll('.cmp-seg button').forEach(b => b.onclick = () => setWho(b.dataset.who));
  // 한마디: 자동 높이 + 글자 수 + 추천 문구(누르면 채움) + 엔터는 입력 끝
  const $t = $('#text');
  const capFit = () => { $t.style.height = 'auto'; $t.style.height = $t.scrollHeight + 'px'; $('#capcnt').textContent = `${$t.value.length}/80`; $('#capcnt').classList.toggle('on', !!$t.value); };
  $t.oninput = capFit;
  $t.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $t.blur(); } };
  el.querySelectorAll('#sugs button').forEach(b => b.onclick = () => { $t.value = b.textContent; capFit(); el.querySelectorAll('#sugs button').forEach(x => x.classList.toggle('on', x === b)); });
  const capAv = () => {
    const typed = $('#author')?.value.trim();
    $('#capav').innerHTML = who === 'anon' ? '🎭' : me ? avatar(myProf, 'xs') : esc((typed || t('나')).slice(0, 1));
  };
  el.addEventListener('input', e => { if (e.target.id === 'author') capAv(); });
  el.querySelectorAll('.cmp-seg button').forEach(b => b.addEventListener('click', capAv));
  setWho('name'); capAv();
  setMode(mode);
  if (mode === 'media' && pick) $file.click(); // 누르자마자 사진첩 (버튼 터치 안에서만 열 수 있음)

  $send.onclick = async () => {
    if (mode === 'media') unlockMedia(media); // iPhone: 누른 순간에 재생 권한 확보(소리 포함 압축용)
    // 보내는 사람: 이름(로그인=내 프로필 / 비로그인=입력한 이름) 또는 익명(로그인이어도 내 계정 정보를 남기지 않음)
    const typed = $('#author')?.value.trim() || '';
    const author = who === 'anon' ? '익명의 친구' : me ? (myProf?.name || '친구').slice(0, 12) : (typed || '익명의 친구');
    const by = who === 'anon' ? { author_name: '익명의 친구', author_id: null } : { author_name: author };
    $send.disabled = true;
    const status = x => { $send.textContent = x; };
    let ins;
    try {
      if (mode === 'poll') {
        status(t('보내는 중…'));
        const opts = [...el.querySelectorAll('#opts input')].map(i => i.value.trim()).filter(Boolean);
        ins = await sb.from('posts').insert({ owner_id: S.uid, media_type: 'poll', mission: '투표', text: $('#pq').value.trim(), poll_options: opts, ...by });
      } else if (mode === 'question') {
        status(t('보내는 중…'));
        ins = await sb.from('posts').insert({ owner_id: S.uid, media_type: 'question', mission: '질문', text: $('#qq').value.trim(), ...by });
      } else {
        // 한 장씩 (영상은 줄인 뒤) 올리고 media 배열로 저장. 첫 장은 image_path 에도 넣어 예전 화면과 호환
        const list = [], n = media.length;
        for (const [i, m] of media.entries()) {
          const tag = n > 1 ? ` (${i + 1}/${n})` : '';
          let main = m.main;
          if (m.kind === 'video') {
            status(t('영상 줄이는 중{tag} {p}%', { tag, p: 0 }));
            main = await compressVideo(m, p => status(t('영상 줄이는 중{tag} {p}%', { tag, p: Math.round(p * 100) })));
            if (main.silent) toast(t('이 기기에서는 소리를 담지 못해 소리 없이 올라가요'));
          }
          status(t('올리는 중{tag}…', { tag }));
          const id = crypto.randomUUID();
          const path = `${S.uid}/${id}.${extOf(main)}`, tpath = `${S.uid}/${id}_t.${extOf(m.thumb)}`;
          await Promise.all([uploadBlob(path, main), uploadBlob(tpath, m.thumb)]);
          list.push({ p: path, t: tpath, k: m.kind });
        }
        ins = await sb.from('posts').insert({
          owner_id: S.uid, image_path: list[0].p, thumb_path: list[0].t, media_type: list[0].k,
          ...(n > 1 ? { media: list } : {}), // 1장은 media 칸 없이 (09 SQL 실행 전에도 동작)
          mission: asked ? MISSIONS[mi] : null, text: $('#text').value.trim(), ...by,
        });
      }
    } catch (err) { ins = { error: err }; }
    if (ins.error) { $send.disabled = false; status(t('다시 보내기')); return toast(ins.error.user ? ins.error.message : kerr(ins.error)); }
    try { if (!me && who === 'name' && typed) localStorage.setItem('candid_author', typed); } catch {}
    media = null; el.querySelectorAll('textarea, #opts input').forEach(i => i.value = '');
    const what = t(mode === 'poll' ? '투표' : mode === 'question' ? '질문' : '사진·영상');
    removeEventListener('popstate', onPop);
    el.innerHTML = `<div class="cmp-done">
      ${DOT('happy', { size: 88, cls: 'pop hop', label: t('보냈어요') })}<h2>Sent<i class="pd">.</i></h2>
      <p>${mode === 'question' ? t('{name}님이 답하면 질문과 함께 피드에 올라가요.', { name }) : t('{name}님이 승인하면 피드에 올라가요.', { name })}<br>${who === 'anon' ? t('🎭 익명으로 보냈어요') : t('‘{author}’ 이름으로 보냈어요', { author: esc(author) })}</p>
      <button class="btn primary block" id="more">${t('{what} 하나 더 보내기', { what })}</button>
      ${me && !S.isOwner && !myFollows.has(S.uid) ? `<button class="btn add block" id="fol">${t('{name} 친구 추가 · 새 소식을 홈에서 보기', { name })}</button>` : ''}
      ${S.isOwner ? '' : me ? '' : `<button class="btn block" id="mine">${t('나도 받아볼래 — 내 피드 만들기')}</button>`}
      ${canInstall() ? `<button class="btn block" id="inst">${t('📲 candid. 앱으로 쓰기')}</button>` : ''}
      <button class="btn block" style="border:0;background:none;color:var(--sub)" id="done">${t('닫기')}</button></div>`;
    const done = () => { el.remove(); if (history.state?.compose) history.back(); setTimeout(maybeShowInstall, 800); };
    $('#done').onclick = done;
    $('#more').onclick = () => { el.remove(); openCompose(0, false, mode); };
    const inst = $('#inst'); if (inst) inst.onclick = () => startInstall();
    const fol = $('#fol'); if (fol) fol.onclick = () => { toggleFollow(S.uid); fol.remove(); };
    const mine = $('#mine'); if (mine) mine.onclick = () => { try { localStorage.setItem('candid_ref', JSON.stringify({ uid: S.uid, name: S.prof.name })); } catch {} location.href = location.pathname; };
  };
}

// ---------- 푸시 알림 ----------
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

async function pushState() {
  if (inApp) return 'in-app';
  if (isIOS && !isStandalone) return 'ios-install';
  if (!pushSupported || !cfg.VAPID_PUBLIC_KEY) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  return sub ? 'on' : 'off';
}
async function updateBell() {
  const b = document.getElementById('bell'); if (!b) return;
  const st = await pushState().catch(() => 'off');
  b.innerHTML = st === 'on' ? I.bellOn : I.bell + (st === 'unsupported' ? '' : '<span class="dot"></span>');
}
const b64u = s => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

async function openPush() {
  const st = await pushState().catch(() => 'unsupported');
  const msg = {
    'ios-install': `<p class="hint">${t('iPhone은 candid.을 홈 화면에 추가해야 알림을 받을 수 있어요.')}</p>
      <div class="ideas">
        <div class="idea"><span class="k">1</span><span class="it">${t('Safari 아래쪽 공유 버튼(□↑)을 눌러요')}</span></div>
        <div class="idea"><span class="k">2</span><span class="it">${t("'홈 화면에 추가'를 눌러요")}</span></div>
        <div class="idea"><span class="k">3</span><span class="it">${t('홈 화면의 candid. 아이콘으로 열어요')}</span></div>
        <div class="idea"><span class="k">4</span><span class="it">${t('한 번 더 로그인하고 🔔을 눌러요')}</span></div>
      </div>`,
    'in-app': `<p class="hint">${t('카톡·인스타 안의 브라우저에서는 알림을 켤 수 없어요. Safari나 Chrome에서 열어 주세요.')}</p><button class="btn primary block" onclick="closeSheet();openExternal(installUrl())">${t('외부 브라우저로 열기')}</button>`,
    unsupported: `<p class="hint">${t('이 브라우저는 알림을 지원하지 않아요. 크롬이나 사파리 최신 버전에서 열어 주세요.')}</p>`,
    denied: `<p class="hint">${t('알림이 차단돼 있어요. 브라우저의 사이트 설정에서 candid. 알림을 허용한 뒤 다시 눌러 주세요.')}</p>`,
    off: `<p class="hint">${t('친구가 사진을 보내면 바로 알려드릴게요.')}</p><button class="btn primary block" id="pushOn">${t('알림 켜기')}</button>`,
    on: `<p class="hint">${t('알림이 켜져 있어요. 친구가 사진을 보내면 이 기기로 알려드려요.')}</p><button class="btn block" id="pushOff">${t('이 기기 알림 끄기')}</button>`,
  }[st];
  const w = sheet(`<h3>Get notified<i class="pd">.</i></h3>${msg}<div style="height:8px"></div><button class="btn block" onclick="closeSheet()">${t('닫기')}</button>`);
  const on = w.querySelector('#pushOn'), off = w.querySelector('#pushOff');
  if (on) on.onclick = async () => {
    on.disabled = true; on.textContent = t('설정 중…');
    try { await enablePush(); closeSheet(); toast(t('알림을 켰어요 🔔')); }
    catch (e) { on.disabled = false; on.textContent = t('알림 켜기'); toast(e.message || t('알림 설정 실패')); }
    updateBell();
  };
  if (off) off.onclick = async () => {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub) { await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
    closeSheet(); toast(t('이 기기 알림을 껐어요')); updateBell();
  };
}

// 알림 구독(권한 요청 포함). 권한 요청은 버튼을 누른 순간에만 가능(브라우저 규칙)
async function enablePush() {
  if (Notification.permission !== 'granted' && await Notification.requestPermission() !== 'granted') throw new Error(t('알림 권한이 허용되지 않았어요'));
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(cfg.VAPID_PUBLIC_KEY) });
  const j = sub.toJSON();
  const { error } = await sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_id: me.id });
  if (error) throw error;
}
// 알림 기본으로 켜기(가능한 만큼):
//  - 이미 허용된 기기(예: 앱을 다시 설치)는 묻지 않고 바로 켬
//  - 아직 안 물어본 기기는 로그인 후 '알림 켜기' 창을 먼저 띄움 → 버튼 한 번이면 기기 허용 창
//    (브라우저 규칙상 버튼 없이 자동으로 허용 창을 띄울 수는 없음). 닫으면 3일 뒤 다시
async function autoPush() {
  if (!me || DEMO || inApp || !pushSupported || !cfg.VAPID_PUBLIC_KEY) return;
  const st = await pushState().catch(() => 'unsupported');
  if (st !== 'off') return;
  if (Notification.permission === 'granted') { try { await enablePush(); updateBell(); } catch {} return; }
  let until = 0; try { until = +localStorage.getItem('candid_push_ask') || 0; } catch {}
  if (Date.now() < until || document.querySelector('.sheet-wrap, .page-ov, .overlay, .iguide')) return;
  const w = sheet(`<div class="pask"><div class="pask-ic">${DOT('wow', { size: 64, cls: 'float' })}</div><h3>${t('알림을 켜 둘까요?')}</h3>
      <p class="hint">${t('친구가 <b>내 피드에 사진을 보내거나</b>, <b>내 사진을 꾸몄을 때</b> 바로 알 수 있어요.<br>꺼 두면 앱을 열기 전까지 몰라요.')}</p></div>
    <button class="btn primary block" id="paskOn">${t('알림 켜기')}</button>
    <button class="btn block" id="paskNo" style="margin-top:8px;border:0;background:none;color:var(--sub)">${t('나중에')}</button>`, () => { snooze(); return true; });
  const snooze = () => { try { localStorage.setItem('candid_push_ask', Date.now() + 3 * 864e5); } catch {} };
  w.querySelector('#paskNo').onclick = () => { snooze(); closeSheet(); };
  w.querySelector('#paskOn').onclick = async e => {
    e.target.disabled = true; e.target.textContent = t('설정 중…');
    try { await enablePush(); closeSheet(); toast(t('알림을 켰어요 🔔')); }
    catch (err) { snooze(); closeSheet(); toast(Notification.permission === 'denied' ? t('알림이 차단됐어요. 나중에 설정에서 켤 수 있어요') : (err.message || t('알림 설정 실패'))); }
    updateBell();
  };
}

// ---------- 홈 화면에 추가(앱 설치) 유도 ----------
// 안드로이드 크롬·삼성인터넷: 브라우저가 주는 설치 이벤트를 잡아 두었다가 우리 버튼으로 기본 설치 팝업을 띄움
// iPhone: 앱이 설치 팝업을 띄울 수 없어서 '공유 → 홈 화면에 추가' 안내만 가능
let installEvt = null;
const installed = () => isStandalone || matchMedia('(display-mode: standalone)').matches;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; maybeShowInstall(); });
addEventListener('appinstalled', () => { installEvt = null; document.querySelector('.ibanner')?.remove(); toast(t('설치했어요! 홈 화면의 candid. 아이콘으로 열어 보세요')); });

function canInstall() {
  if (installed() || DEMO) return null;
  if (inApp) return 'inapp';
  if (installEvt) return 'android';
  if (isIOS) return 'ios';
  return null;
}
// 하단 '앱으로 쓰기' 배너: 닫으면 이번 방문 동안만 숨김(다음에 링크로 들어오면 다시), 설치하면 영구히 안 뜸
function maybeShowInstall() {
  const kind = canInstall();
  // 로그인 안 한 친구(카톡 링크로 들어옴)에게도 보여줌. 단 사진 보내는 중에는 가리지 않게
  if (!kind || document.querySelector('.ibanner, .composer, .cmp-done')) return;
  try { if (sessionStorage.getItem('candid_install_closed')) return; } catch {} // 이번 방문에서 닫았으면 그만
  const b = document.createElement('div'); b.className = 'ibanner';
  b.innerHTML = `<img src="brand/icon-180.png?v=3" alt="">
    <div><b>${t('candid. 앱으로 쓰기')}</b><span>${t(kind === 'inapp' ? 'Safari·Chrome에서 열면 설치할 수 있어요' : '홈 화면에 추가하면 새 사진 알림도 받아요')}</span></div>
    <button class="btn primary">${t(kind === 'android' ? '설치' : kind === 'ios' ? '방법 보기' : '열기')}</button>
    <button class="ix" aria-label="${t('닫기')}">${I.close}</button>`;
  b.querySelector('.btn').onclick = () => { b.remove(); startInstall(); };
  b.querySelector('.ix').onclick = () => { b.remove(); try { sessionStorage.setItem('candid_install_closed', '1'); } catch {} };
  document.body.appendChild(b);
}
async function startInstall() {
  const kind = canInstall();
  if (kind === 'android') {
    installEvt.prompt();
    const { outcome } = await installEvt.userChoice.catch(() => ({}));
    installEvt = null;
    if (outcome !== 'accepted') toast(t('나중에 메뉴 → 앱으로 설치에서 다시 할 수 있어요'));
    return;
  }
  if (kind === 'inapp') return openExternal(installUrl()); // 지금 보던 친구 피드가 아니라 설치 안내로
  if (kind === 'ios') return showInstallGuide(); // 공유 버튼 위치를 화살표로 가리키는 전체 화면 안내
  toast(t(installed() ? '이미 앱으로 쓰고 있어요' : '브라우저 메뉴에서 "앱 설치" 또는 "홈 화면에 추가"를 눌러 주세요'));
}
// ---------- 알림 (종 아이콘) ----------
// 따로 저장하는 테이블 없이 모아서 보여줌: 받은 게시물(승인 대기)·좋아요·댓글·스티커 꾸미기·나를 친구 추가. 최근 30일
const NOTI = { at: 0, items: null, unread: 0 };
const notiKey = () => `candid_noti_seen_${me?.id}`;
const notiSeen = () => { try { return +localStorage.getItem(notiKey()) || 0; } catch { return 0; } };
async function fetchNotis(force) {
  if (!me) return [];
  if (!force && NOTI.items && Date.now() - NOTI.at < 30000) return NOTI.items;
  const since = new Date(Date.now() - 30 * 864e5).toISOString();
  const { data: posts, error } = await sb.from('posts').select('id, status, author_name, author_id, mission, media_type, image_path, thumb_path, media, text, created_at').eq('owner_id', me.id).order('created_at', { ascending: false }).limit(100);
  if (error) throw error;
  const byId = new Map(posts.map(p => [p.id, p]));
  const ids = posts.filter(p => p.status === 'approved').map(p => p.id);
  const q = (t, cols) => ids.length ? sb.from(t).select(cols).in('post_id', ids).neq('user_id', me.id).gte('created_at', since).order('created_at', { ascending: false }).limit(100) : Promise.resolve({ data: [] });
  const [lk, cm, st, fl] = await Promise.all([
    q('likes', 'post_id, user_id, created_at'),
    q('comments', 'post_id, user_id, body, created_at'),
    q('post_stickers', 'post_id, user_id, created_at'),
    sb.from('follows').select('follower_id, created_at').eq('followee_id', me.id).gte('created_at', since).order('created_at', { ascending: false }).limit(50),
  ]);
  const items = [];
  posts.filter(p => p.status === 'pending' && p.created_at >= since).forEach(p => items.push({ k: 'post', at: p.created_at, uid: p.author_id, name: p.author_name, post: p }));
  (lk.data || []).forEach(r => items.push({ k: 'like', at: r.created_at, uid: r.user_id, post: byId.get(r.post_id) }));
  (cm.data || []).forEach(r => items.push({ k: 'comment', at: r.created_at, uid: r.user_id, post: byId.get(r.post_id), body: r.body }));
  // 스티커: 같은 사람이 같은 사진에 10분 안에 붙인 건 하나로
  const grp = new Map();
  (st.data || []).forEach(r => {
    const key = r.user_id + r.post_id, g = grp.get(key), ts = new Date(r.created_at).getTime();
    if (g && g.first - ts < 6e5) { g.n++; g.first = ts; return; }
    const it = { k: 'sticker', at: r.created_at, uid: r.user_id, post: byId.get(r.post_id), n: 1, first: ts };
    grp.set(key, it); items.push(it);
  });
  (fl.data || []).forEach(r => items.push({ k: 'follow', at: r.created_at, uid: r.follower_id }));
  const uids = [...new Set(items.map(i => i.uid).filter(Boolean))];
  const profs = new Map();
  if (uids.length) { const { data } = await sb.from('profiles').select('id, name, handle, avatar_url').in('id', uids); (data || []).forEach(p => profs.set(p.id, p)); }
  items.forEach(i => { i.prof = i.uid ? profs.get(i.uid) : null; i.name = i.prof?.name || (i.name === '익명의 친구' ? t(i.name) : i.name) || t('친구'); });
  items.sort((a, b) => new Date(b.at) - new Date(a.at));
  NOTI.items = items.slice(0, 60); NOTI.at = Date.now();
  const seen = notiSeen();
  NOTI.unread = NOTI.items.filter(i => new Date(i.at).getTime() > seen).length;
  return NOTI.items;
}
async function refreshNotiDot() {
  try { await fetchNotis(); } catch { return; }
  const d = document.getElementById('notidot'); if (d) d.hidden = !NOTI.unread;
  document.getElementById('notibtn')?.setAttribute('aria-label', NOTI.unread ? t('알림, 새 알림 {n}개', { n: NOTI.unread }) : t('알림'));
}
function notiText(i) {
  const n = `<b>${esc(i.name)}</b>`;
  const what = p => t(p?.media_type === 'poll' ? '투표' : p?.media_type === 'question' ? '질문' : p?.media_type === 'video' ? '영상' : '사진');
  switch (i.k) {
    case 'post': return t('{n}님이 {what}을(를) 보냈어요. 승인을 기다리고 있어요', { n, what: what(i.post) });
    case 'like': return t('{n}님이 내 게시물을 좋아해요', { n });
    case 'comment': return t('{n}님이 댓글을 남겼어요: “{c}”', { n, c: esc(i.body.length > 40 ? i.body.slice(0, 40) + '…' : i.body) });
    case 'sticker': return t('{n}님이 내 {what}을(를) 꾸몄어요 ✨', { n, what: what(i.post) }) + (i.n > 1 ? t(' (스티커 {k}개)', { k: i.n }) : '');
    case 'follow': return t('{n}님이 나를 친구로 추가했어요', { n });
  }
}
async function openNotis() {
  // 검색처럼 위에서 내려오는 패널
  const el = sheet(`<div class="shead"><h3>Notifications<i class="pd">.</i></h3><button class="icon-btn" aria-label="${t('닫기')}" onclick="closeSheet()">${I.close}</button></div>
    <div class="nlist" id="nl"><p class="hint" style="padding:16px 0">${t('불러오는 중…')}</p></div>`, null, { top: true });
  let items; try { items = await fetchNotis(true); } catch (e) { return el.querySelector('#nl').innerHTML = `<p class="hint" style="padding:24px 20px">${esc(kerr(e))}</p>`; }
  if (!el.isConnected) return;
  const seen = notiSeen();
  try { localStorage.setItem(notiKey(), Date.now()); } catch {}
  NOTI.unread = 0; const d = document.getElementById('notidot'); if (d) d.hidden = true;
  const $l = el.querySelector('#nl');
  if (!items.length) return $l.innerHTML = `<div class="empty-dot" style="margin:8px 0 4px">${DOT('sleepy', { size: 52 })}</div><p class="hint" style="padding:4px 0 20px;text-align:center">${t('아직 알림이 없어요. 친구가 사진을 보내거나 좋아요·댓글·꾸미기를 하면 여기 떠요.')}</p>`;
  $l.innerHTML = items.map((i, x) => {
    const p = i.post, thumb = p && !isText(p) && mediaOf(p).length ? `<img class="nthumb" src="${thumbUrl(p)}" alt="" loading="lazy">` : '';
    const av = i.prof ? avatar(i.prof, 'xs') : `<div class="av xs">${esc((i.name || '?').slice(0, 1))}</div>`;
    const fol = i.k === 'follow' && !myFollows.has(i.uid) ? `<button class="btn add nfol" data-fol="${i.uid}">${t('맞친구')}</button>` : '';
    return `<button class="nrow${new Date(i.at).getTime() > seen ? ' new' : ''}" data-i="${x}">${av}<span class="ntx">${notiText(i)}<small>${ago(i.at)}</small></span>${fol || thumb}</button>`;
  }).join('');
  $l.querySelectorAll('[data-fol]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleFollow(b.dataset.fol); b.remove(); });
  $l.querySelectorAll('.nrow').forEach(b => b.onclick = () => {
    const i = items[+b.dataset.i];
    if (i.k === 'follow') { closeSheet(); return go(feedUrl(i.uid)); }
    if (i.k === 'post') { closeSheet(); return openInbox(); }
    if (!i.post) return toast(t('지금은 볼 수 없는 게시물이에요'));
    closeSheet();
    withMyFeed(() => {
      if (!findPost(i.post.id)) return toast(t('지금은 볼 수 없는 게시물이에요'));
      openPost(i.post.id);
      if (i.k === 'comment') setTimeout(() => { const c = document.querySelector('.overlay .pbtn[data-cmt]'); if (c) focusPostComments(c); }, 300);
    });
  });
}

// ---------- 앱 초대 ----------
// 초대 링크 ?invite=아이디(또는 id): 받은 사람은 '앱 설치하고 시작하기' 한 번 → 설치 안내, 가입하면 초대한 친구와 자동으로 친구
const INVITE = (() => {
  const v = new URLSearchParams(location.search).get('invite');
  if (v && /^[A-Za-z0-9_-]{3,40}$/.test(v)) { try { localStorage.setItem('candid_invite', v); } catch {} return v; }
  return null;
})();
const inviteUrl = () => `${location.origin}${location.pathname}?invite=${encodeURIComponent(myProf?.handle || me.id)}`;
async function findInviter(key) {
  const isId = /^[0-9a-f-]{36}$/i.test(key);
  const { data } = await sb.from('profiles').select('id, name, handle, avatar_url').eq(isId ? 'id' : 'handle', isId ? key : key.toLowerCase()).maybeSingle();
  return data || null;
}
async function renderInvite(key) {
  let inviter = null; try { inviter = await withTimeout(findInviter(key), 6000); } catch {}
  renderLanding(inviter);
}
// 설치 버튼: 카톡 등 인앱 → Safari·Chrome 으로(설치 안내 + 초대 정보 유지), 그 외 → 바로 설치/안내
function installNow() {
  if (installed()) return toast(t('이미 앱으로 쓰고 있어요'));
  if (inApp) return openExternal(installUrl());
  if (installEvt) return startInstall();
  showInstallGuide();
  if (!isIOS && !/android/i.test(UA)) toast(t('브라우저 메뉴에서 "앱 설치" 또는 "홈 화면에 추가"를 눌러 주세요'));
}
// 로그인 후: 초대한 친구를 내 친구로 (한 번만)
async function applyInvite() {
  let key = null; try { key = localStorage.getItem('candid_invite'); } catch {}
  if (!key || !me) return false;
  try { localStorage.removeItem('candid_invite'); } catch {}
  const inv = await findInviter(key).catch(() => null);
  if (!inv || inv.id === me.id || myFollows.has(inv.id)) return false;
  const { error } = await sb.from('follows').insert({ follower_id: me.id, followee_id: inv.id });
  if (error) return false;
  myFollows.add(inv.id);
  setTimeout(() => toast(t('{name}님과 친구가 됐어요', { name: inv.name })), 1200);
  return true;
}
// 초대 보내기
function openInvite() {
  if (!me) return;
  const msg = t('candid. 같이 하자! 📸\n친구들이 내 피드를 채워주는 앱이야. 링크 누르면 바로 설치할 수 있어');

function showInstallGuide() {

  const android = /android/i.test(UA);
  if (!isIOS && !android) return; // 데스크톱은 하단 배너·메뉴로 충분
  const el = document.createElement('div'); el.className = 'iguide'; el.setAttribute('role', 'dialog');
  const step = (n, html) => `<li><span class="k">${n}</span><span>${html}</span></li>`;
  const sh = `<b class="ib">${I.iosShare}</b>`;
  let steps, arrow = '';
  if (android) {
    steps = step(1, t('아래 <b>앱 설치</b> 버튼을 눌러요')) + step(2, t('홈 화면의 <b>candid.</b> 아이콘으로 열어요')) + step(3, t('카카오로 <b>한 번만</b> 로그인하면 끝!'));
  } else if (chromeIOS) {
    steps = step(1, t('주소창 오른쪽 공유 {icon} 를 눌러요', { icon: sh })) + step(2, t('<b>홈 화면에 추가</b>를 눌러요')) + step(3, t('홈 화면의 <b>candid.</b>을 열고 카카오로 <b>한 번만</b> 로그인'));
    arrow = 'top';
  } else if (iosVer >= 26) {
    steps = step(1, t('오른쪽 아래 <b class="ib">⋯</b> 를 눌러요')) + step(2, t('<b>공유</b> {icon} → <b>홈 화면에 추가</b>', { icon: sh })) + step(3, t('<b>추가</b>를 누르고, 홈 화면의 <b>candid.</b>을 열어 카카오로 <b>한 번만</b> 로그인'));
    arrow = 'right';
  } else {
    steps = step(1, t('아래 가운데 공유 {icon} 를 눌러요', { icon: sh })) + step(2, t('목록을 내려 <b>홈 화면에 추가</b>')) + step(3, t('<b>추가</b>를 누르고, 홈 화면의 <b>candid.</b>을 열어 카카오로 <b>한 번만</b> 로그인'));

    <h2>${t('홈 화면에 추가하기')}</h2>
    <p>${t('앱처럼 바로 열리고, 친구가 사진을 보내면 알림이 와요.')}</p>
    ${otherIOS ? `<button class="btn primary block" id="igsafari" style="margin-bottom:18px">${t('Safari로 열기 (추천)')}</button><p class="ig-sub" style="margin:-8px 0 20px">${t('안 열리면 아래 방법으로 여기서 바로 추가해도 돼요')}</p>` : ''}
    <ol>${steps}</ol>

      <p class="ig-sub" id="igalt"${installEvt ? ' hidden' : ''}>${t('버튼이 계속 안 눌리면 오른쪽 위 <b>⋮</b> → <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>')}</p>` : ''}
    ${arrow ? `<div class="ig-arrow ${arrow}" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M5 12l7 7 7-7"/></svg></div>` : ''}`;

// 연결해 두면 둘 중 아무거나로 로그인해도 같은 계정. Supabase Auth 설정에서 Manual linking 을 켜야 동작

  if (error) return $l.innerHTML = `<p class="hint">${esc(kerr(error))}</p>`;
  const have = new Set((data?.identities || []).map(i => i.provider));

      ${have.has(p) ? '<span class="lk-ok">✓</span>' : `<button class="btn add" data-p="${p}">${t('연결하기')}</button>`}</div>`).join('');
  $l.innerHTML = rows + `<p class="hint" style="font-size:12px;margin-top:12px">${t("'이미 다른 계정에서 사용 중'이라고 나오면, 그 로그인 방법으로 만들어진 다른 계정이 있다는 뜻이에요. 그 계정을 먼저 삭제해야 연결할 수 있어요.")}</p>`;
  $l.querySelectorAll('[data-p]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = t('이동 중…');
    try { localStorage.setItem('candid_last_login', b.dataset.p); } catch {}
    const { error } = await sb.auth.linkIdentity({ provider: b.dataset.p, options: { redirectTo: location.origin + location.pathname } });

    }
  });
}

const ITEM = Object.fromEntries(ITEM_CATALOG.map(i => [i.id, i]));
FREE_STICKERS.forEach(i => { ITEM[i.id] = i; });

const GACHA_ON = false;
const glyph = it => it ? (it.data.svg || it.data.e || '') : ''; // 스티커 모양(이모지 또는 미니 아이템 그림)
const RARITY = { common: { label: '일반', color: '#8e8e93' }, rare: { label: '레어', color: '#2b50ff' }, epic: { label: '에픽', color: '#af52de' }, legendary: { label: '전설', color: '#ff9f0a' } };
const KIND_LABEL = { frame: '프레임', theme: '커버', sticker: '스티커', name: '네임' };
let TICKETS = null;

// 장착 장식 → HTML 조각
function deco(prof) {
  const eq = prof?.equipped || {};
  return { frame: ITEM[eq.frame], theme: ITEM[eq.theme], name: ITEM[eq.name], stickers: (eq.stickers || []).map(id => ITEM[id]).filter(Boolean) };
}
const ringFx = fr => fr ? { cls: ` fx${fr.data.spin ? ' spin' : ''}${fr.data.glow ? ' glow' : ''}`, style: ` style="--ring:${fr.data.bg};${fr.data.glow ? `--glow:${fr.data.glow}` : ''}"` } : { cls: '', style: '' };
const nameFx = nm => {
  if (!nm) return { cls: '', style: '' };
  const d = nm.data;
  if (d.grad) return { cls: ` fxn${d.anim ? ' holo' : ''}`, style: ` style="background-image:${d.grad}"` };
  if (d.glow) return { cls: ' fxglow', style: ` style="--glow:${d.glow}"` };
  return { cls: '', style: ` style="color:${d.color}"` };
};
const coverHTML = (th, mini) => th ? `<div class="cover${mini ? ' mini' : ''}${th.data.stars ? ' stars' : ''}${th.data.film ? ' film' : ''}" style="background:${th.data.bg}"></div>` : '';
const stickersHTML = list => list.map((s, i) => `<span class="stk s${i}">${s.data.e}</span>`).join('');

// 아이템 하나 미리보기(뽑기 결과·옷장 타일)
function itemPreview(it) {
  if (it.kind === 'frame') { const f = ringFx(it); return `<div class="ring${f.cls}"${f.style}>${avatar(myProf)}</div>`; }
  if (it.kind === 'theme') return coverHTML(it, true);
  if (it.kind === 'sticker') return `<span class="stk big">${it.data.e}</span>`;
  const n = nameFx(it); return `<span class="name${n.cls}"${n.style}>${esc(myProf?.name || '이름')}</span>`;
}

async function refreshTickets(pulse) {
  if (!me) return;
  const before = TICKETS;
  const { data, error } = await sb.rpc('gacha_status');
  const btn = document.getElementById('gbtn');
  if (error) { if (btn) btn.hidden = true; return; } // 08_gacha.sql 실행 전
  TICKETS = data.tickets;
  document.querySelectorAll('[data-tickets]').forEach(el => el.textContent = TICKETS);
  if (btn) { btn.hidden = false; btn.classList.toggle('has', TICKETS > 0); if (pulse && before != null && TICKETS > before) { btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); } }
}

function pageOverlay(cls, html) {
  document.querySelector('.page-ov')?.remove();
  const el = document.createElement('div'); el.className = 'page-ov ' + cls; el.innerHTML = html;
  document.body.appendChild(el); return el;
}

// 뽑기 화면
function openGacha() {
  const el = pageOverlay('gacha', `
    <header class="pov-h"><button class="icon-btn" aria-label="닫기" data-x>${I.close}</button></header>
    <h2>Lucky capsule<i class="pd">.</i></h2>
    <p class="gsub">뽑기권 <b data-tickets>${TICKETS ?? '…'}</b>장</p>
    <div class="machine"><div class="capsule" id="cap"><i class="ct"></i><i class="cb"></i><i class="cl"></i></div><div class="burst" id="burst"></div></div>
    <div id="grev"></div>
    <div class="gfoot">
      <button class="btn primary block" id="gpull">뽑기 · 1장</button>
      <button class="btn block" id="gcloset">🎨 내 아이템으로 꾸미기</button>
      <details class="grules"><summary>뽑기권 받는 법 · 확률</summary>
        <p>처음 가입하면 <b>3장</b> 선물! 이후 내 피드에 친구가 보낸 게시물을 <b>승인할 때마다 1장</b>을 받아요. (하루 최대 3장, 같은 친구 이름은 하루 1장)</p>
        <div class="rates">${Object.entries(RARITY).map(([k, r]) => `<span style="--c:${r.color}">${r.label} <b>${{ common: 60, rare: 30, epic: 9, legendary: 1 }[k]}%</b></span>`).join('')}</div>
        <p>이미 가진 아이템이 나오면 보유 개수가 늘어나요.</p>
      </details>
    </div>`);
  el.querySelector('[data-x]').onclick = () => el.remove();
  el.querySelector('#gcloset').onclick = () => openCloset();
  const $pull = el.querySelector('#gpull'), $cap = el.querySelector('#cap'), $rev = el.querySelector('#grev'), $burst = el.querySelector('#burst');
  const setBtn = () => { $pull.disabled = !(TICKETS > 0); $pull.textContent = TICKETS > 0 ? ($rev.innerHTML ? '한 번 더 · 1장' : '뽑기 · 1장') : '뽑기권이 없어요 · 친구 게시물을 승인해 보세요'; };
  refreshTickets().then(setBtn); setBtn();
  $pull.onclick = async () => {
    $pull.disabled = true; $rev.innerHTML = ''; $cap.className = 'capsule shake'; $burst.className = 'burst';
    const [res] = await Promise.all([sb.rpc('pull_gacha'), new Promise(r => setTimeout(r, 1200))]);
    if (res.error) { $cap.className = 'capsule'; toast(/no_ticket/.test(res.error.message) ? '뽑기권이 없어요' : kerr(res.error)); return refreshTickets().then(setBtn); }
    const it = ITEM[res.data.id] || res.data, rar = RARITY[res.data.rarity];
    TICKETS = res.data.tickets; document.querySelectorAll('[data-tickets]').forEach(x => x.textContent = TICKETS);
    $cap.className = 'capsule open'; $cap.style.setProperty('--rc', rar.color);
    $burst.style.setProperty('--rc', rar.color); $burst.className = 'burst go' + (res.data.rarity === 'legendary' ? ' big' : '');
    navigator.vibrate?.(res.data.rarity === 'legendary' ? [30, 40, 60] : 12);
    const equippedNow = isEquipped(it);
    $rev.innerHTML = `<div class="gcard" style="--rc:${rar.color}">
      <div class="gprev">${itemPreview(it)}</div>
      <span class="rl">${rar.label} · ${KIND_LABEL[it.kind]}</span><b>${esc(it.name)}</b>
      <small>${res.data.count > 1 ? `이미 가진 아이템이에요 (x${res.data.count})` : '✨ NEW!'}</small>
      <button class="btn ${equippedNow ? '' : 'primary'}" data-eq>${equippedNow ? '장착 중' : '바로 장착하기'}</button></div>`;
    $rev.querySelector('[data-eq]').onclick = e => equip(it, e.currentTarget);
    setBtn(); refreshTickets(); // 버튼 숫자 갱신
  };
}
const isEquipped = it => { const eq = myProf?.equipped || {}; return it.kind === 'sticker' ? (eq.stickers || []).includes(it.id) : eq[it.kind] === it.id; };

async function equip(it, btn) {
  if (btn) btn.disabled = true;
  const { data, error } = await sb.rpc('equip_item', { p_kind: it.kind, p_item: it.id });
  if (btn) btn.disabled = false;
  if (error) return toast(/not_owned/.test(error.message) ? '아직 없는 아이템이에요' : kerr(error));
  myProf.equipped = data;
  if (S.prof && S.prof.id === me.id) S.prof.equipped = data;
  const c = CACHE.prof.get(me.id); if (c) c.prof = { ...c.prof, equipped: data };
  if (btn) { const on = isEquipped(it); btn.textContent = on ? '장착 중' : '바로 장착하기'; btn.classList.toggle('primary', !on); }
  if (S.isOwner && !document.querySelector('.reels')) paintProfile();
  return data;
}

    drag = { id }; stage.setPointerCapture(e.pointerId); e.preventDefault();
  });
  stage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size === 2) {
      const t = two(); setScale(pinch.r, pinch.s0 * t.d / pinch.d0); setRot(pinch.r, pinch.r0 + (t.ang - pinch.a0));
      $('#dsize').value = pinch.r.scale; $('#drot').value = pinch.r.rot; return;
    }
    if (!drag) return;
    const b = stage.getBoundingClientRect(), r = mine.find(x => x.id === drag.id); if (!r) return;
    r.x = Math.min(0.97, Math.max(0.03, (e.clientX - b.left) / b.width));
    r.y = Math.min(0.97, Math.max(0.03, (e.clientY - b.top) / b.height));
    const sp = spanOf(drag.id); if (sp) { sp.style.left = r.x * 100 + '%'; sp.style.top = r.y * 100 + '%'; }
  });
  const lift = e => {
    pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
    if (pts.size === 0) { drag = null; if (tapEmpty && !pinched) { sel = null; paint(); } tapEmpty = false; pinched = false; }
  };
  stage.addEventListener('pointerup', lift); stage.addEventListener('pointercancel', lift);
  $('#dsize').oninput = e => { const r = mine.find(x => x.id === sel); if (r) setScale(r, +e.target.value); };
  $('#drot').oninput = e => { const r = mine.find(x => x.id === sel); if (r) setRot(r, +e.target.value); };
  $('#dtools').onclick = e => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a || !sel) return;
    const r = mine.find(x => x.id === sel);
    if (a === 'edit' && r?.text) return openText(r);
    if (a === 'x') { if (!r) return; mine = mine.filter(x => x !== r); if (!r.tmp) removed.add(r.id); sel = null; paint(); }
  };

  const KEYS = ['x', 'y', 'scale', 'rot', 'text', 'style'];
  const changed = () => removed.size || mine.some(r => r.tmp || KEYS.some(k => (orig.get(r.id)?.[k] ?? null) !== (r[k] ?? null)));
  $('[data-x]').onclick = () => { if (!changed() || confirm(t('저장하지 않은 꾸미기가 사라져요. 닫을까요?'))) el.remove(); };
  // 저장: 내 것만 추가·수정·삭제 → 서로 덮어쓰지 않음. 실패하면 원인을 그대로 보여줌
  $('#dsave').onclick = async () => {
    const btn = $('#dsave'); btn.disabled = true; btn.textContent = t('저장 중…');
    let step = '';
    try {
      step = '떼기';
      if (removed.size) { const { error } = await sb.from('post_stickers').delete().in('id', [...removed]); if (error) throw error; }
      step = '붙이기';
      const row = r => {
        const o = { post_id: postId, media_idx: idx, user_id: me.id, item_id: r.item_id, x: +r.x.toFixed(4), y: +r.y.toFixed(4), scale: r.scale };
        if (r.rot) o.rot = r.rot;                               // 회전·텍스트 칸은 쓸 때만 보냄
        if (r.text) { o.text = r.text; o.style = r.style || 'plain'; }
        return o;
      };
      const adds = mine.filter(r => r.tmp).map(row);
      if (adds.length) { const { error } = await sb.from('post_stickers').insert(adds); if (error) throw error; }
      step = '옮기기';
      for (const r of mine.filter(r => !r.tmp)) {
        const o = orig.get(r.id), patch = {};
        KEYS.forEach(k => { if ((o?.[k] ?? null) !== (r[k] ?? null)) patch[k] = k === 'x' || k === 'y' ? +r[k].toFixed(4) : r[k]; });
        if (!Object.keys(patch).length) continue;
        patch.updated_at = new Date().toISOString();
        const { error } = await sb.from('post_stickers').update(patch).eq('id', r.id);
        if (error) throw error;
      }
      await loadStickers([postId]); refreshStickerLayers(postId);
      el.remove(); toast(t('꾸몄어요 ✨'));
    } catch (err) {
      btn.disabled = false; btn.textContent = t('저장');
      const msg = String(err?.message || err), code = err?.code ? `[${err.code}] ` : '';
      console.error('sticker save failed', step, err);
      toast(/row-level|42501/i.test(msg) ? t('스티커를 붙일 수 없어요(개수 제한이거나 권한이 없어요)')
        // 칸이 없다는 오류만 '준비 중'으로(예전엔 'text' 가 들어간 다른 오류까지 잘못 걸렸음). 그 외엔 원인을 그대로 보여줌
        : /(could not find|does not exist).*\b(rot|text|style)\b/i.test(msg) ? t('텍스트·회전 기능 준비 중이에요(관리자: 12 SQL 실행 필요)') + ` ${code}`
        : `${t('저장 실패')}(${t(step)}): ${code}${msg}`.slice(0, 160));
    }
  };
  paint();
}

// 승인: 바로 반영하고 5초간 되돌리기 제공 (되돌리면 다시 대기 상태로)
async function approve(id) {
  const p = findPost(id); if (!p) return;
  if (p.media_type === 'question' && !p.answer) return openAnswer(id); // 질문은 답하면서 올림
  closeLayers(); await leaveRow(id);
  const at = new Date().toISOString();
  const { error } = await sb.from('posts').update({ status: 'approved', approved_at: at }).eq('id', id);
  if (error) return toast(kerr(error));
  S.pending = S.pending.filter(x => x.id !== id);
  Object.assign(p, { status: 'approved', approved_at: at }); S.approved.push(p);
  S.justApproved = id; paintProfile();
  navigator.vibrate?.(8);
  if (GACHA_ON) setTimeout(() => refreshTickets(true), 400); // 승인하면 뽑기권 +1 → 🎁 버튼이 톡 튐
  toast(t('{name}의 사진을 피드에 올렸어요', { name: p.author_name === '익명의 친구' ? t(p.author_name) : p.author_name }), { label: t('되돌리기'), fn: async () => {
    const { error } = await sb.from('posts').update({ status: 'pending', approved_at: null }).eq('id', id);
    if (error) return toast(kerr(error));
    S.approved = S.approved.filter(x => x.id !== id);
    Object.assign(p, { status: 'pending', approved_at: null }); S.pending.unshift(p); paintProfile();
  } });
}

// 거절/내리기: 화면에서 바로 치우고, 5초 뒤에 실제 삭제 (그 전엔 되돌리기 가능)
const pendingDeletes = new Map();
async function commitDelete(id) {
  const job = pendingDeletes.get(id); if (!job) return;
  pendingDeletes.delete(id); clearTimeout(job.timer);
  const { error } = await sb.from('posts').delete().eq('id', id);
  if (error) { toast(kerr(error)); return job.restore(); }
  sb.storage.from('photos').remove(mediaOf(job.p).flatMap(m => [m.p, m.t]).filter(x => x && !/^https?:/.test(x)));
}
addEventListener('pagehide', () => [...pendingDeletes.keys()].forEach(commitDelete));

// 피드에서 내리기: 삭제하지 않고 '되돌리기한 피드'로 보관(나만 보임)
async function hidePost(id) {
  const p = findPost(id); if (!p || p.status !== 'approved') return;
  closeLayers();
  const at = new Date().toISOString();
  const { error } = await sb.from('posts').update({ status: 'hidden', hidden_at: at }).eq('id', id);
  if (error) return toast(/check|constraint|23514/i.test(error.message + error.code) ? t('아직 준비 중이에요(관리자: 11_hide.sql 실행 필요)') : kerr(error));
  S.approved = S.approved.filter(x => x.id !== id);
  Object.assign(p, { status: 'hidden', hidden_at: at }); (S.hidden = S.hidden || []).unshift(p);
  paintProfile();
  toast(t('피드에서 내렸어요 · 대기 피드에 보관돼요'), { label: t('되돌리기'), fn: () => restorePost(id) });
}
// 다시 올리기: 원래 위치(처음 승인한 시간)로 복귀
async function restorePost(id) {
  const p = findPost(id); if (!p || p.status !== 'hidden') return;
  closeLayers();
  const { error } = await sb.from('posts').update({ status: 'approved', hidden_at: null }).eq('id', id);
  if (error) return toast(kerr(error));
  S.hidden = S.hidden.filter(x => x.id !== id);
  Object.assign(p, { status: 'approved', hidden_at: null }); S.approved.push(p);
  S.justApproved = id; paintProfile(); toast(t('다시 피드에 올렸어요'));
}
async function removePost(id) {
  const p = findPost(id); if (!p) return;
  const wasPending = p.status === 'pending';
  closeLayers(); if (wasPending) await leaveRow(id);
  const list = wasPending ? 'pending' : p.status === 'hidden' ? 'hidden' : 'approved';
  const idx = S[list].indexOf(p);
  S[list] = S[list].filter(x => x.id !== id); paintProfile();
  const restore = () => { S[list].splice(idx, 0, p); paintProfile(); };
  pendingDeletes.set(id, { p, restore, timer: setTimeout(() => commitDelete(id), 5000) });
  toast(t(wasPending ? '조용히 정리했어요' : '삭제했어요'), { label: t('되돌리기'), fn: () => {
    const job = pendingDeletes.get(id); if (!job) return;
    clearTimeout(job.timer); pendingDeletes.delete(id); restore();
  } });
}

// 사진 회전 정보(EXIF)를 반영해서 디코딩 — iPhone 사진이 옆으로 눕는 문제 방지
async function decodeFile(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch {} }
  return loadImg(URL.createObjectURL(file));
}
function loadImg(src) { return new Promise((ok, no) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
async function resize(file, max) {
  const img = await decodeFile(file);
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

    { id: 's2', post_id: 'a0', media_idx: 0, user_id: 'f1', item_id: 'sticker_crown', x: 0.3, y: 0.25, scale: 1.2 }];
  db.posts = db.posts.filter((p, i, a) => a.findIndex(x => x.id === p.id) === i);
  const persist = () => ss.set('demo_db2', JSON.stringify(db));
  const loggedIn = () => ss.get('demo_login') === '1';
  const files = {};

  function from(table) {
    let op = 'select', payload, single = false, order = null, lim = 0; const filters = [];
    const run = () => {
      db[table] = db[table] || [];
      let rows = db[table].filter(r => filters.every(([k, v, how]) => how === 'in' ? v.includes(r[k]) : how === 'neq' ? r[k] !== v : how === 'gte' ? (r[k] || '') >= v : how === 're' ? v.test(r[k] || '') : how === 'or' ? v.some(([c, re]) => re.test(r[c] || '')) : r[k] === v));
      if (op === 'insert' && Array.isArray(payload)) { // 여러 개 한 번에 추가
        const all = payload; for (const p of all) { payload = p; run(); } return { data: null, error: null };
      }
      if (op === 'insert') {
        const row = { id: 'x' + Math.random().toString(36).slice(2), created_at: new Date().toISOString(), ...payload };
        if (table === 'posts') Object.assign(row, { status: 'pending', approved_at: null, ...payload });
        if (table === 'likes' || table === 'comments') row.user_id = row.user_id || ME.id;
        if (table === 'follows') row.follower_id = row.follower_id || ME.id;
        ['image_path', 'thumb_path'].forEach(k => { if (files[row[k]]) row[k] = files[row[k]]; }); // 새로고침해도 사진 유지
        db[table].push(row); persist(); return { data: null, error: null };
      }
      if (op === 'update') { rows.forEach(r => Object.assign(r, payload)); persist(); return { data: null, error: null }; }
      if (op === 'delete') { db[table] = db[table].filter(r => !rows.includes(r)); persist(); return { data: null, error: null }; }
      if (table === 'posts') rows = rows.filter(r => r.status === 'approved' || (loggedIn() && r.owner_id === ME.id)); // RLS 흉내
      if (table === 'follows' && !loggedIn()) rows = [];
      if (table === 'comments') rows = rows.map(r => ({ ...r, profiles: db.profiles.find(p => p.id === r.user_id) || null }));
      if (order) rows = [...rows].sort((a, b) => (a[order[0]] < b[order[0]] ? -1 : 1) * (order[1] ? 1 : -1));
      if (lim) rows = rows.slice(0, lim);

    };
    const b = {
      select: () => b, eq: (k, v) => (filters.push([k, v]), b), neq: (k, v) => (filters.push([k, v, 'neq']), b), gte: (k, v) => (filters.push([k, v, 'gte']), b), in: (k, arr) => (filters.push([k, arr, 'in']), b),
      ilike: (k, pat) => (filters.push([k, new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/%/g, '.*'), 'i'), 're']), b),
      // or('name.ilike.%x%,handle.ilike.%x%') 흉내: 조건 중 하나라도 맞으면 통과
      or: expr => (filters.push([null, expr.split(',').map(c => { const [k, , p] = c.split('.'); return [k, new RegExp(p.replace(/%/g, '.*'), 'i')]; }), 'or']), b),

      insert: p => (op = 'insert', payload = p, b), update: p => (op = 'update', payload = p, b), delete: () => (op = 'delete', b),

  }
  // 가챠 함수(RPC) 흉내: 데모는 뽑기권 5장으로 시작
  async function rpc(fn, args = {}) {
    db.inventory = db.inventory || []; if (db.gtix == null) db.gtix = 5;
    const prof = db.profiles.find(p => p.id === ME.id); prof.equipped = prof.equipped || {};
    await new Promise(r => setTimeout(r, 150));
    if (fn === 'gacha_status') return { data: { tickets: db.gtix, earned: 0, used: 0, bonus: 5 }, error: null };
    if (fn === 'pull_gacha') {
      if (db.gtix < 1) return { data: null, error: { message: 'no_ticket' } };
      const r = Math.random(), rar = r < 0.01 ? 'legendary' : r < 0.10 ? 'epic' : r < 0.40 ? 'rare' : 'common';
      const pool = ITEM_CATALOG.filter(i => i.rarity === rar), it = pool[Math.floor(Math.random() * pool.length)];
      let inv = db.inventory.find(x => x.item_id === it.id); if (inv) inv.count++; else db.inventory.push(inv = { user_id: ME.id, item_id: it.id, count: 1 });
      db.gtix--; persist();
      return { data: { id: it.id, kind: it.kind, name: it.name, rarity: rar, count: inv.count, tickets: db.gtix }, error: null };
    }
    if (fn === 'equip_item') {
      const { p_kind: k, p_item: id } = args, eq = { ...prof.equipped };
      if (id && !db.inventory.some(x => x.item_id === id)) return { data: null, error: { message: 'not_owned' } };
      if (k === 'sticker') { let a = [...(eq.stickers || [])]; if (a.includes(id)) a = a.filter(x => x !== id); else { if (a.length >= 3) a.shift(); a.push(id); } eq.stickers = a; }

  }
  const toDataUrl = blob => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
  // 데모 전용 하단 바: 시점 전환
  setTimeout(() => {
    const bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:flex;gap:4px;align-items:center;padding:5px 5px 5px 14px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18)';
    const on = loggedIn();
    const pill = (label, active, fn) => `<button onclick="${fn}" style="border:0;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;white-space:nowrap;background:${active ? 'var(--bg)' : 'transparent'};color:${active ? 'var(--fg)' : 'var(--bg)'}">${label}</button>`;
    bar.innerHTML = `<span style="opacity:.6;margin-right:6px">DEMO</span>${pill('주인장 시점', on, "demoView(1)")}${pill('친구 시점', !on, "demoView(0)")}${pill('↺', false, "demoReset()")}`;
    document.body.appendChild(bar);
    document.getElementById('toast').style.bottom = '76px';
    document.body.style.paddingBottom = '72px';
  });
  window.demoView = v => { ss.set('demo_login', v ? '1' : '0'); location.href = location.pathname + '?u=demo'; };
  window.demoReset = () => { try { sessionStorage.clear(); } catch {} location.href = location.pathname; };

  return {
    auth: {
      getSession: async () => ({ data: { session: loggedIn() ? { user: ME } : null } }),
      signInWithOAuth: async () => { ss.set('demo_login', '1'); location.href = location.pathname; },
      signOut: async () => ss.set('demo_login', '0'),
    },
    from, rpc,
    storage: { from: () => ({
      getPublicUrl: p => ({ data: { publicUrl: files[p] || p } }),
      upload: async (p, blob) => { files[p] = await toDataUrl(blob); return { error: null }; },
      remove: async () => ({ error: null }),
    }) },
    _files: files,
  };
}

// ---------- 미디어 최적화 (업로드 전 휴대폰에서 압축) ----------
const MAX_VIDEO_SEC = 10;
// 캔버스를 이미지로: WebP 지원 기기는 WebP(더 작음), 아니면 JPEG
async function canvasBlob(c, q) {
  const webp = await new Promise(r => c.toBlob(r, 'image/webp', q));
  if (webp && webp.type === 'image/webp') return webp;
  return new Promise(r => c.toBlob(r, 'image/jpeg', q + 0.04));
}
function drawScaled(src, w0, h0, max) {
  const s = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}
const extOf = b => ({ 'image/webp': 'webp', 'image/jpeg': 'jpg', 'video/mp4': 'mp4', 'video/webm': 'webm', 'video/quicktime': 'mov' })[b.type.split(';')[0]] || 'bin';

// 사진: 본문 1080px(약 150~300KB) + 그리드용 썸네일 480px(약 25~40KB)
async function prepareImage(file) {
  const img = await decodeFile(file);
  const main = await canvasBlob(drawScaled(img, img.width, img.height, 1080), 0.8);
  const thumb = await canvasBlob(drawScaled(img, img.width, img.height, 480), 0.7);
  return { kind: 'image', main, thumb, previewUrl: URL.createObjectURL(main) };
}

// iPhone Safari 는 재생 전엔 영상 데이터를 안 불러와서 무한 대기할 수 있음 → 모든 단계에 시간제한
const within = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), ms))]);
function loadVideo(file) {
  return within(new Promise((ok, no) => {
    const v = document.createElement('video');
    v.preload = 'auto'; v.muted = true; v.playsInline = true;
    v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
    v.onloadedmetadata = () => ok(v); v.onerror = () => no(new Error('video'));
    v.src = URL.createObjectURL(file); v.load();
  }), 8000);
}
const seek = (v, t) => within(new Promise(r => { v.onseeked = () => r(); v.currentTime = t; }), 3000);
// 첫 장면을 그릴 수 있게 데이터 불러오기: 소리 없이 잠깐 재생했다 멈춤
async function primeVideo(v) {
  try { await within(v.play(), 2000); } catch {}
  v.pause();
  if (v.readyState < 2) await within(new Promise(r => v.addEventListener('loadeddata', r, { once: true })), 2500).catch(() => {});
}
// 대표 이미지를 못 뽑았을 때 쓰는 기본 이미지(어두운 배경 + ▶)
async function fallbackPoster() {
  const c = document.createElement('canvas'); c.width = 480; c.height = 600; const g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 480, 600); bg.addColorStop(0, '#1a1f3a'); bg.addColorStop(1, '#2b50ff'); g.fillStyle = bg; g.fillRect(0, 0, 480, 600);
  g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.moveTo(205, 255); g.lineTo(205, 345); g.lineTo(285, 300); g.closePath(); g.fill();
  return canvasBlob(c, 0.8);
}

// 영상 고르기: 미리보기용 정보와 대표 이미지(포스터)만 먼저 준비. 실제 압축은 '보내기' 누를 때(소리 녹음에 사용자 터치가 필요)
async function prepareVideoMeta(file) {
  let v = null, thumb = null;
  try {
    v = await loadVideo(file);
    await primeVideo(v);
    await seek(v, Math.min(0.15, (isFinite(v.duration) ? v.duration : 1) / 2)).catch(() => {});
    if (v.videoWidth) thumb = await canvasBlob(drawScaled(v, v.videoWidth, v.videoHeight, 720), 0.72);
  } catch {}
  if (!thumb || thumb.size < 2000) thumb = await fallbackPoster(); // 검은 화면이거나 실패
  const duration = v && isFinite(v.duration) ? v.duration : MAX_VIDEO_SEC;
  return { kind: 'video', file, duration, w: v?.videoWidth || 0, h: v?.videoHeight || 0, thumb, previewUrl: v?.src || URL.createObjectURL(file), main: null };
}

// 영상 압축: 720p·약 1.6Mbps 로 다시 인코딩(앞 10초까지). 10초 기준 약 2~3MB
// iPhone 은 버튼을 누른 '바로 그 순간'에만 소리 있는 재생을 허락 → 보내기 누르자마자 오디오·영상 재생 권한을 미리 받아 둠
function unlockMedia(list) {
  try { const A = window.AudioContext || window.webkitAudioContext; window.__candidActx = window.__candidActx || new A(); window.__candidActx.resume(); } catch {}
  (list || []).filter(m => m.kind === 'video' && !m.el).forEach(m => {
    const v = document.createElement('video');
    v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto'; v.src = URL.createObjectURL(m.file);
    v.muted = false; v._unlocking = true;
    const p = v.play(); if (p) p.then(() => { if (v._unlocking) v.pause(); }).catch(() => {}); // 압축이 이미 시작됐으면 멈추지 않음
    m.el = v;
  });
}

// 영상 압축: 고른 구간(최대 10초)만 720p·약 1.6Mbps 로 다시 인코딩
async function compressVideo(meta, onProgress) {
  const dur = meta.duration || MAX_VIDEO_SEC;
  const start = Math.max(0, meta.start || 0), end = Math.min(meta.end ?? dur, start + MAX_VIDEO_SEC), len = Math.max(0.5, end - start);
  const trimmed = start > 0.05 || end < dur - 0.05;
  const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = window.MediaRecorder && HTMLCanvasElement.prototype.captureStream && types.find(t => MediaRecorder.isTypeSupported(t));
  const originalOk = !trimmed && dur <= MAX_VIDEO_SEC + 0.5 && meta.file.size <= 10 * 1024 * 1024 && /^video\/(mp4|webm|quicktime)/.test(meta.file.type);
  const original = () => {
    if (originalOk) return meta.file;
    throw Object.assign(new Error(t('이 기기에서는 영상을 줄일 수 없어요. 더 짧거나 작은 영상으로 골라 주세요')), { user: true });
  };
  if (!mime) return original();

  let v = meta.el;
  if (!v) { try { v = await loadVideo(meta.file); } catch { return original(); } }
  if (v.readyState < 1) await within(new Promise(r => v.addEventListener('loadedmetadata', r, { once: true })), 8000).catch(() => {});

  Object.assign(v.style, { position: 'fixed', left: '0', top: '0', width: '2px', height: '2px', opacity: '0.01', pointerEvents: 'none', zIndex: '-1' });
  document.body.appendChild(v);
  const cleanup = () => { try { v.pause(); } catch {} v.remove(); };
  if (!v.videoWidth) await primeVideo(v);
  if (!v.videoWidth) { cleanup(); return original(); }

  const c = drawScaled(v, v.videoWidth, v.videoHeight, 720), g = c.getContext('2d');
  const stream = c.captureStream(30);
  let withAudio = true;
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    const actx = window.__candidActx || (window.__candidActx = new A());
    const dest = actx.createMediaStreamDestination();
    actx.createMediaElementSource(v).connect(dest); // 스피커엔 연결 안 함(녹음용)
    dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));

  const finish = () => { if (stop) return; stop = true; try { v.pause(); } catch {} if (rec.state !== 'inactive') rec.stop(); };
  const draw = () => {
    if (stop) return;
    g.drawImage(v, 0, 0, c.width, c.height);
    onProgress?.(Math.min(1, Math.max(0, (v.currentTime - start) / len)));
    if (v.currentTime >= end || v.ended) return finish();
    v.requestVideoFrameCallback ? v.requestVideoFrameCallback(draw) : requestAnimationFrame(draw);
  };
  v._unlocking = false; // 미리 받아 둔 재생 권한의 '잠깐 재생 후 멈춤'이 늦게 와도 무시
  await seek(v, start).catch(() => {});
  rec.start(250);
  v.muted = false;
  let played = false;
  try { await within(v.play(), 3000); played = true; } catch {}
  if (!played) { v.muted = true; withAudio = false; try { await within(v.play(), 3000); played = true; } catch {} } // 소리 재생이 막히면 소리 없이라도
  if (!played) { finish(); await done; cleanup(); return original(); }
  draw();
  const guard = setTimeout(finish, (len + 6) * 1000);
  await done; clearTimeout(guard); cleanup();
  const out = new Blob(chunks, { type: mime.split(';')[0] });
  if (out.size < 20000) return original();              // 거의 비어 있으면 실패로 보고 원본
  if (originalOk && out.size >= meta.file.size) return meta.file; // 이미 작은 원본이면 원본
  out.silent = !withAudio;

}

// 업로드: 경로는 랜덤 UUID라 내용이 안 바뀜 → 브라우저 캐시 1년(재방문 시 전송량 0)
async function uploadBlob(path, blob) {
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType: blob.type.split(';')[0], cacheControl: '31536000' });
  if (error) throw error;
}
const thumbUrl = p => photoUrl(p.thumb_path || p.image_path);
const isVideo = p => p.media_type === 'video';

// 정사각형으로 가운데 잘라서 축소 (프로필 사진용)
async function resizeSquare(file, size) {
  const img = await decodeFile(file), side = Math.min(img.width, img.height);
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

// 글자 단위 줄바꿈 (한글은 띄어쓰기가 적어서 글자 단위가 자연스러움), 넘치면 말줄임
function wrapLines(g, text, maxW, maxLines) {
  const lines = []; let cur = '';
  for (const ch of [...text]) {
    if (g.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch.trimStart(); } else cur += ch;
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].replace(/.$/, '…'); }
  return lines;
}

// 투표·질문 스토리: 사진 자리에 블루 카드로 내용 그리기
function drawTextCard(g, p, x, y, w, h) {
  g.fillStyle = p.media_type === 'poll' ? '#2b50ff' : '#0a0a0a'; g.fillRect(x, y, w, h);
  g.fillStyle = 'rgba(255,255,255,.6)'; g.font = '800 28px Pretendard, sans-serif'; g.fillText(p.media_type === 'poll' ? 'POLL' : 'Q&A', x + 48, y + 80);
  g.fillStyle = '#fff'; g.font = '800 54px Pretendard, sans-serif';
  const ql = wrapLines(g, (p.media_type === 'question' ? 'Q. ' : '') + p.text, w - 96, 4);
  ql.forEach((ln, i) => g.fillText(ln, x + 48, y + 170 + i * 68));
  let yy = y + 190 + ql.length * 68;
  if (p.media_type === 'poll') {
    const s = POLL.get(p.id) || { counts: p.poll_options.map(() => 0), total: 0 };
    p.poll_options.forEach((o, i) => {
      const pct = s.total ? Math.round(s.counts[i] / s.total * 100) : 0;
      g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x + 48, yy, w - 96, 72);
      g.fillStyle = 'rgba(255,255,255,.45)'; g.fillRect(x + 48, yy, (w - 96) * pct / 100, 72);
      g.fillStyle = '#fff'; g.font = '700 30px Pretendard, sans-serif'; g.fillText(wrapLines(g, o, w - 260, 1)[0], x + 72, yy + 47);
      g.textAlign = 'right'; g.fillText(pct + '%', x + w - 72, yy + 47); g.textAlign = 'left';
      yy += 86;
    });
  } else if (p.answer) {
    g.fillStyle = 'rgba(255,255,255,.75)'; g.font = '600 40px Pretendard, sans-serif';
    wrapLines(g, 'A. ' + p.answer, w - 96, 5).forEach((ln, i) => g.fillText(ln, x + 48, yy + 20 + i * 54));
  }
}

  let img = null;
  if (!isText(p)) { try { img = await loadImg(isVideo(p) ? thumbUrl(p) : photoUrl(p.image_path)); } catch { return toast(t('사진을 불러오지 못했어요. 다시 시도해 주세요')); } }
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
  const g = c.getContext('2d');
  const cover = (W, H) => { const r = Math.max(W / img.width, H / img.height), sw = W / r, sh = H / r; return [(img.width - sw) / 2, (img.height - sh) / 2, sw, sh]; };

  // 배경: 사진을 아주 작게 그렸다 키워서 블러 효과 → 사진마다 다른 톤 (모든 브라우저에서 동작)
  if (img) {
    const t = document.createElement('canvas'); t.width = 27; t.height = 48;
    t.getContext('2d').drawImage(img, ...cover(27, 48), 0, 0, 27, 48);
    g.imageSmoothingQuality = 'high'; g.drawImage(t, 0, 0, 1080, 1920);
    g.fillStyle = 'rgba(255,255,255,.72)'; g.fillRect(0, 0, 1080, 1920);
  } else { const bg = g.createLinearGradient(0, 0, 1080, 1920); bg.addColorStop(0, '#eef1ff'); bg.addColorStop(1, '#ffffff'); g.fillStyle = bg; g.fillRect(0, 0, 1080, 1920); }

  // 로고 + 부제
  g.textAlign = 'left'; g.font = '800 80px "Bricolage Grotesque", sans-serif';
  const lw = g.measureText('candid').width, dw = g.measureText('.').width, lx = 540 - (lw + dw) / 2;
  g.fillStyle = '#0a0a0a'; g.fillText('candid', lx, 330); g.fillStyle = '#2b50ff'; g.fillText('.', lx + lw, 330);
  g.textAlign = 'center'; g.fillStyle = '#3a3a3c'; g.font = '700 34px Pretendard, sans-serif';
  g.fillText(t('친구가 본 {name}', { name: S.prof.name }), 540, 392);

  // 폴라로이드 카드 (랜딩 콜라주와 같은 구조)
  g.save(); g.translate(540, 960); g.rotate(-0.02);
  g.shadowColor = 'rgba(0,0,0,.18)'; g.shadowBlur = 70; g.shadowOffsetY = 24;
  g.fillStyle = '#fff'; g.fillRect(-360, -510, 720, 1040); g.shadowColor = 'transparent';
  if (img) g.drawImage(img, ...cover(640, 800), -320, -470, 640, 800);
  else drawTextCard(g, p, -320, -470, 640, 800);
  g.textAlign = 'left'; g.fillStyle = '#2b50ff'; g.font = '800 26px Pretendard, sans-serif';
  g.fillText(p.mission || '', -320, 382);
  g.fillStyle = '#0a0a0a'; g.font = '800 44px Pretendard, sans-serif';
  const lines = p.text && !isText(p) ? wrapLines(g, p.text, 640, 2) : [];
  lines.forEach((ln, i) => g.fillText(ln, -320, 438 + i * 54));
  g.fillStyle = '#8e8e93'; g.font = '600 26px Pretendard, sans-serif';
  g.fillText(`— ${p.author_name}`, -320, lines.length > 1 ? 512 : lines.length ? 488 : 430);
  g.restore();

  // 하단 CTA 알약 — 인스타 링크 스티커를 여기에 붙이면 좋음
  g.fillStyle = '#2b50ff'; g.beginPath(); g.roundRect ? g.roundRect(170, 1560, 740, 96, 48) : g.rect(170, 1560, 740, 96); g.fill();
  g.fillStyle = '#fff'; g.font = '700 32px Pretendard, sans-serif'; g.textAlign = 'center';
  g.fillText(t('나한테도 사진 보내줘 → 링크 클릭'), 540, 1619);

  const blob = await new Promise(res => c.toBlob(res, 'image/png'));
  const file = new File([blob], 'candid-story.png', { type: 'image/png' });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch {} }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  toast(t('이미지를 저장했어요. 스토리에 올리고 링크 스티커로 내 피드 링크를 붙여 보세요'));
}
</script>
</body>
</html>
