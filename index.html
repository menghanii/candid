<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>candid.</title>
<meta name="description" content="candid. — 친구들이 만들어주는 나의 피드">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="32x32" href="brand/icon-32.png">
<link rel="apple-touch-icon" href="brand/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="candid.">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root {
    --bg:#fff; --card:#fff; --fg:#0a0a0a; --sub:#8e8e93; --line:#ececec; --soft:#f5f5f5; --accent:#2b50ff;
    --display:"Bricolage Grotesque", "Pretendard", sans-serif;
    --sans:"Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#000; --card:#111; --fg:#fafafa; --sub:#8e8e93; --line:#222; --soft:#161616; --accent:#5c7cff;
  } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font-family:var(--sans); font-size:14px; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; cursor:pointer; }
  svg { display:block; }
  .app { max-width:480px; margin:0 auto; min-height:100vh; }
  .display { font-family:var(--display); font-weight:700; letter-spacing:-.03em; }
  .logo { font-family:var(--display); font-weight:800; font-size:26px; background:none; border:0; padding:0; letter-spacing:-.05em; }
  .logo i { color:var(--accent); font-style:normal; }

  /* 상단바 */
  .top { position:sticky; top:0; z-index:5; display:flex; align-items:center; height:56px; padding:0 20px; background:color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .top .sp { flex:1; }
  .icon-btn { position:relative; background:none; border:0; padding:8px; margin-left:4px; border-radius:50%; }
  .icon-btn:hover { background:var(--soft); }
  .dot { position:absolute; top:4px; right:4px; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 2px var(--bg); }

  /* 프로필 */
  .head { text-align:center; padding:20px 20px 0; }
  .ring { display:inline-block; padding:3px; border-radius:50%; border:1.5px solid var(--accent); }
  .av { width:88px; height:88px; border-radius:50%; object-fit:cover; display:flex; align-items:center; justify-content:center; background:var(--soft); font-family:var(--display); font-weight:700; font-size:34px; color:var(--sub); }
  .av.sm { width:34px; height:34px; font-size:16px; flex:none; }
  .av-def { overflow:hidden; padding:0; }
  .av-def svg { display:block; }
  .setup { padding:12px 20px 40px; }
  .setup h1 { font-family:var(--display); font-weight:800; font-size:40px; line-height:1; letter-spacing:-.05em; margin:12px 0 10px; }
  .setup h1 em { color:var(--accent); font-style:normal; }
  .setup .hint { color:var(--sub); margin:0 0 8px; line-height:1.55; }
  .avopts { display:flex; gap:18px; margin:0 0 24px; }
  .avopt { display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:0; padding:0; font-size:12px; color:var(--sub); cursor:pointer; }
  .avopt .sel { display:block; padding:3px; border-radius:50%; border:2px solid transparent; transition:border-color .15s; }
  .avopt .av { width:64px; height:64px; overflow:hidden; color:var(--sub); }
  .avopt.on { color:var(--fg); font-weight:600; }
  .avopt.on .sel { border-color:var(--accent); }
  .name { font-family:var(--display); font-weight:700; font-size:30px; line-height:1.1; letter-spacing:-.03em; margin:14px 0 4px; }
  .desc { color:var(--sub); font-size:13px; }
  .stats { display:flex; margin:22px 0 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .stats > div { flex:1; padding:14px 0; }
  .stats > div + div { border-left:1px solid var(--line); }
  .stats b { display:block; font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:-.02em; margin-bottom:4px; line-height:1; }
  .stats span { font-size:11px; color:var(--sub); letter-spacing:.04em; }
  .actions { display:flex; gap:8px; padding:18px 20px; }
  .btn { flex:1; border:1px solid var(--line); border-radius:999px; padding:12px 16px; font-weight:600; font-size:14px; background:var(--card); transition:transform .1s; }
  .btn:active { transform:scale(.98); }
  .btn.primary { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .btn.block { display:block; width:100%; }
  .btn:disabled { opacity:.5; }

  /* 탭 */
  .tabs { display:flex; gap:24px; padding:0 20px; border-bottom:1px solid var(--line); }
  .tabs button { background:none; border:0; border-bottom:1.5px solid transparent; margin-bottom:-1px; padding:12px 0; color:var(--sub); font-size:13px; font-weight:600; }
  .tabs button.on { color:var(--fg); border-bottom-color:var(--fg); }
  .tabs .n { color:var(--accent); margin-left:3px; }

  /* 그리드 */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding-top:2px; }
  .grid button { padding:0; border:0; aspect-ratio:4/5; background:var(--soft); overflow:hidden; }
  .grid img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s, opacity .3s; }
  .grid button:hover img { transform:scale(1.03); opacity:.92; }

  /* 빈 상태 */
  .empty { padding:48px 28px 56px; text-align:center; }
  .empty h2 { font-family:var(--display); font-weight:700; font-size:28px; letter-spacing:-.04em; margin:0 0 8px; line-height:1.15; }
  .empty p { color:var(--sub); margin:0 0 24px; line-height:1.6; }
  .ideas { display:flex; flex-direction:column; gap:8px; margin:0 0 24px; text-align:left; }
  .idea { display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:14px; }
  .idea .k { font-family:var(--display); font-weight:800; color:var(--accent); font-size:18px; width:18px; }

  /* 승인함 */
  .note { padding:14px 20px; color:var(--sub); font-size:12px; }
  .row { display:flex; gap:14px; margin:0 20px 10px; padding:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .row img { width:60px; height:75px; object-fit:cover; border-radius:8px; flex:none; cursor:pointer; }
  .row .meta { flex:1; min-width:0; line-height:1.45; }
  .row .meta .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .meta small { color:var(--sub); }
  .row .ab { display:flex; flex-direction:column; gap:6px; }
  .row .ab .btn { padding:7px 14px; flex:none; font-size:13px; }
  .mtag { display:inline-block; font-size:11px; font-weight:600; color:var(--accent); letter-spacing:.02em; }

  /* 게시물 상세 */
  .overlay { position:fixed; inset:0; z-index:20; background:rgba(10,10,10,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; animation:fade .2s; }
  @keyframes fade { from { opacity:0; } }
  .post { width:100%; max-width:440px; max-height:100vh; overflow:auto; background:var(--card); }
  @media (min-width:481px) { .post { border-radius:20px; max-height:92vh; } }
  .post-h { display:flex; align-items:center; gap:10px; padding:12px 12px 12px 16px; }
  .post-h .who { flex:1; line-height:1.3; }
  .post-h .who b { display:block; font-size:14px; }
  .post-img { width:100%; aspect-ratio:4/5; object-fit:cover; display:block; background:var(--soft); }
  .post-c { padding:20px 20px 8px; }
  .quote { font-family:var(--display); font-weight:600; font-size:24px; line-height:1.3; letter-spacing:-.03em; margin:6px 0 10px; word-break:keep-all; }
  .quote::before { content:"“"; color:var(--accent); }
  .quote::after { content:"”"; color:var(--accent); }
  .by { color:var(--sub); font-size:13px; }
  .post-f { display:flex; align-items:center; padding:8px 12px 14px 20px; color:var(--sub); font-size:12px; }
  .post-f .sp { flex:1; }

  /* 바텀시트 */
  .sheet-wrap { position:fixed; inset:0; z-index:30; background:rgba(10,10,10,.45); display:flex; align-items:flex-end; justify-content:center; animation:fade .2s; }
  .sheet { width:100%; max-width:480px; max-height:94vh; overflow:auto; background:var(--bg); border-radius:24px 24px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom)); animation:up .25s cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { transform:translateY(60px); opacity:0; } }
  .grab { width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 18px; }
  .sheet h3 { font-family:var(--display); font-weight:700; font-size:28px; letter-spacing:-.04em; margin:0 0 4px; line-height:1.1; }
  .sheet .hint { color:var(--sub); margin:0 0 20px; font-size:13px; }
  .label { font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.08em; margin:0 0 8px; }
  .chips { display:flex; gap:6px; overflow-x:auto; margin:0 -20px 20px; padding:0 20px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:13px; white-space:nowrap; }
  .chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .pick { display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center; aspect-ratio:4/5; max-height:46vh; margin:0 auto 16px; border-radius:16px; border:1.5px dashed var(--line); background:var(--card); color:var(--sub); cursor:pointer; overflow:hidden; font-size:13px; }
  .pick img { width:100%; height:100%; object-fit:cover; }
  .field { width:100%; padding:14px 16px; font:inherit; font-size:16px; border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--fg); margin-bottom:10px; outline:none; }
  .field:focus { border-color:var(--fg); }
  .menu { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:10px; }
  .menu-item { display:block; width:100%; text-align:center; padding:16px; border:0; border-top:1px solid var(--line); background:none; font-size:15px; }
  .menu-item:first-child { border-top:0; }
  .menu-item.danger { color:var(--accent); font-weight:600; }

  /* 랜딩 */
  .landing { min-height:100vh; display:flex; flex-direction:column; padding:28px 24px calc(28px + env(safe-area-inset-bottom)); }
  .landing .hero { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .collage { position:relative; height:250px; margin:12px 0 36px; }
  .snap { position:absolute; width:138px; padding:8px 8px 12px; background:var(--card); border-radius:4px; box-shadow:0 10px 30px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06); }
  .snap .ph { aspect-ratio:4/5; border-radius:2px; }
  .snap p { margin:8px 2px 0; font-size:12px; font-weight:600; }
  .snap small { display:block; margin:2px 2px 0; color:var(--sub); font-size:10px; }
  .snap:nth-child(1) { left:2%; top:26px; transform:rotate(-7deg); }
  .snap:nth-child(2) { left:50%; top:0; transform:translateX(-50%) rotate(2deg); z-index:2; }
  .snap:nth-child(3) { right:2%; top:38px; transform:rotate(8deg); }
  .snap:nth-child(1) .ph { background:linear-gradient(160deg,#f6d5c4,#e9967a); }
  .snap:nth-child(2) .ph { background:linear-gradient(160deg,#d9dfe8,#8fa3bf); }
  .snap:nth-child(3) .ph { background:linear-gradient(160deg,#e8e2c8,#b8a970); }
  .landing h1 { font-family:var(--display); font-weight:800; font-size:50px; line-height:.95; margin:0 0 14px; letter-spacing:-.055em; }
  .landing h1 em, .empty h2 em { color:var(--accent); font-style:normal; }
  .landing .tagline { color:var(--sub); line-height:1.6; margin:0 0 32px; font-size:15px; }
  .social { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border-radius:999px; padding:15px; font-weight:600; font-size:15px; margin-bottom:10px; border:0; }
  .social.kakao { background:#FEE500; color:rgba(0,0,0,.85); }
  .social.google { background:var(--card); border:1px solid var(--line); }
  .fine { color:var(--sub); font-size:12px; margin:14px 0 0; text-align:center; line-height:1.6; }

  .toast { position:fixed; left:50%; bottom:32px; transform:translate(-50%, 10px); z-index:50; background:var(--fg); color:var(--bg); padding:12px 18px; border-radius:999px; font-size:13px; font-weight:600; opacity:0; transition:.25s; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; transform:translate(-50%, 0); }
  .spin { display:flex; justify-content:center; padding:120px 0; }
</style>
</head>
<body>
<div class="app" id="app"><div class="spin"><span class="logo">candid<i>.</i></span></div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
const MISSIONS = ['제일 웃긴 사진', '제일 잘 나온 사진', '몰래 찍은 사진', '우리만 아는 흑역사', '나를 한 단어로', '자유'];
const LOGO = 'candid<i>.</i>';
const sv = (d, s = 22, w = 1.6) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  inbox: s => sv('<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>', s),
  menu: sv('<path d="M4 8h16M4 16h16"/>'),
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  camera: sv('<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>', 30, 1.3),
  share: sv('<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/>', 20),
  more: sv('<circle cx="5" cy="12" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="19" cy="12" r=".6"/>', 22, 2.4),
  close: sv('<path d="M18 6 6 18M6 6l12 12"/>'),
  bell: sv('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'),
  bellOn: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" fill="none"/></svg>',
  google: '<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>',
  kakao: '<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#000" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.8 5.3 4.6 6.7l-1 3.7c-.1.3.3.6.6.4l4.4-2.9c.5.1 1 .1 1.5.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>',
};

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000); }
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return '방금 전'; if (s < 3600) return `${s / 60 | 0}분 전`;
  if (s < 86400) return `${s / 3600 | 0}시간 전`; if (s < 604800) return `${s / 86400 | 0}일 전`;
  return new Date(iso).toLocaleDateString('ko-KR', { month:'long', day:'numeric' });
}
// 기본 프로필 아이콘 (테마 색을 따라감)
const DEFAULT_AV = '<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true"><rect width="100" height="100" fill="var(--soft)"/><circle cx="50" cy="40" r="17" fill="var(--sub)" opacity=".5"/><path d="M16 96c2-20 17-31 34-31s32 11 34 31" fill="var(--sub)" opacity=".5"/></svg>';
const avatar = (p, cls = '') => p?.avatar_url
  ? `<img class="av ${cls}" src="${esc(p.avatar_url)}" alt="" referrerpolicy="no-referrer">`
  : `<div class="av av-def ${cls}">${DEFAULT_AV}</div>`;
const https = u => u ? String(u).replace(/^http:\/\//, 'https://') : u;

// ---------- 설정 확인 ----------
const cfg = window.FG_CONFIG || {};
const DEMO = !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY;
const sb = DEMO ? demoClient() : supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
const photoUrl = path => sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
const feedUrl = id => `${location.origin}${location.pathname}?u=${id}`;
let me = null, myProf = null;

(async function boot() {
  me = (await sb.auth.getSession()).data.session?.user || null;
  if (me) {
    myProf = (await sb.from('profiles').select('*').eq('id', me.id).maybeSingle()).data;
    if (myProf && !myProf.onboarded) return renderSetup(true); // 첫 로그인: 프로필 설정
  }
  route();
})();

function route() {
  const u = new URLSearchParams(location.search).get('u');
  if (u) return renderProfile(u);
  me ? location.replace(feedUrl(me.id)) : renderLanding();
}

// ---------- 프로필 설정 (첫 로그인 / 편집) ----------
function renderSetup(first) {
  const social = https(myProf.social_avatar_url || me.user_metadata?.avatar_url || me.user_metadata?.picture);
  const prov = me.app_metadata?.provider;
  const socialLabel = prov === 'kakao' ? '카카오 프로필' : prov === 'google' ? 'Google 프로필' : '소셜 프로필';
  let choice = 'default', customUrl = null, customBlob = null;
  if (!first && myProf.avatar_url) { if (myProf.avatar_url === social) choice = 'social'; else { choice = 'custom'; customUrl = myProf.avatar_url; } }

  $app.innerHTML = `
    <header class="top"><span class="logo">${LOGO}</span><div class="sp"></div>
      <button id="skip" style="background:none;border:0;padding:8px 0;color:var(--sub);font-weight:600;font-size:14px">${first ? '건너뛰기' : '취소'}</button></header>
    <div class="setup">
      <h1>${first ? 'Set up your<br><em>profile.</em>' : 'Edit <em>profile.</em>'}</h1>
      <p class="hint">친구들에게 보일 이름과 사진이에요.${first ? '<br>나중에 언제든 바꿀 수 있어요.' : ''}</p>
      <div style="text-align:center;margin:8px 0 24px"><div class="ring" id="preview"></div></div>
      <div class="label">PROFILE PHOTO</div>
      <div class="avopts">
        <button class="avopt" data-c="default"><span class="sel"><span class="av">${DEFAULT_AV}</span></span>기본</button>
        ${social ? `<button class="avopt" data-c="social"><span class="sel"><img class="av" src="${esc(social)}" alt="" referrerpolicy="no-referrer"></span>${socialLabel}</button>` : ''}
        <label class="avopt" data-c="custom"><span class="sel" id="customThumb"></span>앨범에서 선택<input type="file" accept="image/*" id="avfile" hidden></label>
      </div>
      <div class="label">NAME</div>
      <input class="field" id="nm" maxlength="20" value="${esc(myProf.name)}" placeholder="${esc(myProf.name)}">
      <div style="height:10px"></div>
      <button class="btn primary block" id="done">${first ? '시작하기' : '저장'}</button>
    </div>`;

  const $ = s => $app.querySelector(s);
  const currentUrl = () => choice === 'social' ? social : choice === 'custom' ? customUrl : null;
  const paint = () => {
    $('#preview').innerHTML = avatar({ avatar_url: currentUrl() });
    $('#customThumb').innerHTML = customUrl ? `<img class="av" src="${esc(customUrl)}" alt="">` : `<span class="av">${I.camera}</span>`;
    $app.querySelectorAll('.avopt').forEach(o => o.classList.toggle('on', o.dataset.c === choice));
  };
  paint();
  $app.querySelectorAll('button.avopt').forEach(o => o.onclick = () => { choice = o.dataset.c; paint(); });
  $('#avfile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    customBlob = await resizeSquare(f, 400);
    customUrl = URL.createObjectURL(customBlob); choice = 'custom'; paint();
  };
  $('#skip').onclick = async () => {
    if (first) { await sb.from('profiles').update({ onboarded: true }).eq('id', me.id); myProf.onboarded = true; }
    route();
  };
  $('#done').onclick = async e => {
    e.target.disabled = true; e.target.textContent = '저장 중…';
    try {
      let url = currentUrl();
      if (choice === 'custom' && customBlob) {
        const path = `${me.id}/${crypto.randomUUID()}.jpg`;
        const up = await sb.storage.from('avatars').upload(path, customBlob, { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
        url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      }
      const patch = { name: $('#nm').value.trim() || myProf.name, avatar_url: url, onboarded: true };
      const { error } = await sb.from('profiles').update(patch).eq('id', me.id);
      if (error) throw error;
      Object.assign(myProf, patch);
      toast(first ? '환영해요!' : '프로필을 저장했어요');
      route();
    } catch (err) { e.target.disabled = false; e.target.textContent = first ? '시작하기' : '저장'; toast('실패: ' + err.message); }
  };
}

// ---------- 푸시 알림 ----------
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

async function pushState() {
  if (isIOS && !isStandalone) return 'ios-install';
  if (!pushSupported || !cfg.VAPID_PUBLIC_KEY) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  return sub ? 'on' : 'off';
}
async function updateBell() {
  const b = document.getElementById('bell'); if (!b) return;
  const st = await pushState().catch(() => 'off');
  b.innerHTML = st === 'on' ? I.bellOn : I.bell + (st === 'unsupported' ? '' : '<span class="dot"></span>');
}
const b64u = s => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

async function openPush() {
  const st = await pushState().catch(() => 'unsupported');
  const msg = {
    'ios-install': `<p class="hint">iPhone은 candid.을 홈 화면에 추가해야 알림을 받을 수 있어요.</p>
      <div class="ideas">
        <div class="idea"><span class="k">1</span>Safari 아래쪽 공유 버튼(□↑)을 눌러요</div>
        <div class="idea"><span class="k">2</span>'홈 화면에 추가'를 눌러요</div>
        <div class="idea"><span class="k">3</span>홈 화면의 candid. 아이콘으로 열고 🔔을 눌러요</div>
      </div>`,
    unsupported: '<p class="hint">이 브라우저는 알림을 지원하지 않아요. 크롬이나 사파리 최신 버전에서 열어 주세요.</p>',
    denied: '<p class="hint">알림이 차단돼 있어요. 브라우저의 사이트 설정에서 candid. 알림을 허용한 뒤 다시 눌러 주세요.</p>',
    off: '<p class="hint">친구가 사진을 보내면 바로 알려드릴게요.</p><button class="btn primary block" id="pushOn">알림 켜기</button>',
    on: '<p class="hint">알림이 켜져 있어요. 친구가 사진을 보내면 이 기기로 알려드려요.</p><button class="btn block" id="pushOff">이 기기 알림 끄기</button>',
  }[st];
  const w = sheet(`<h3>Get notified.</h3>${msg}<div style="height:8px"></div><button class="btn block" onclick="closeSheet()">닫기</button>`);
  const on = w.querySelector('#pushOn'), off = w.querySelector('#pushOff');
  if (on) on.onclick = async () => {
    on.disabled = true; on.textContent = '설정 중…';
    try {
      if (await Notification.requestPermission() !== 'granted') throw new Error('알림 권한이 허용되지 않았어요');
      const reg = await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(cfg.VAPID_PUBLIC_KEY) });
      const j = sub.toJSON();
      const { error } = await sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_id: me.id });
      if (error) throw error;
      closeSheet(); toast('알림을 켰어요 🔔');
    } catch (e) { on.disabled = false; on.textContent = '알림 켜기'; toast(e.message || '알림 설정 실패'); }
    updateBell();
  };
  if (off) off.onclick = async () => {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub) { await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
    closeSheet(); toast('이 기기 알림을 껐어요'); updateBell();
  };
}

// ---------- 주인장 액션 ----------
async function approve(id) {
  const { error } = await sb.from('posts').update({ status: 'approved', approved_at: new Date().toISOString() }).eq('id', id);
  if (error) return toast(error.message);
  closeSheet(); document.querySelector('.overlay')?.remove();
  toast('피드에 올렸어요'); renderProfile(S.uid);
}
async function removePost(id, quiet) {
  const p = findPost(id);
  if (!quiet && !confirm(p.status === 'pending' ? '거절할까요?' : '피드에서 내릴까요? 사진도 삭제돼요.')) return;
  const { error } = await sb.from('posts').delete().eq('id', id);
  if (error) return toast(error.message);
  await sb.storage.from('photos').remove([p.image_path]);
  closeSheet(); document.querySelector('.overlay')?.remove();
  toast(p.status === 'pending' ? '조용히 정리했어요' : '피드에서 내렸어요'); renderProfile(S.uid);
}
function shareFeed() {
  const url = feedUrl(S.uid);
  const text = '내 피드 좀 채워줘. 네가 가진 내 사진 중에 제일 웃긴 거 하나만!';
  const w = sheet(`
    <h3>Ask your friends.</h3>
    <p class="hint">이 링크를 받은 친구는 로그인 없이 사진을 보낼 수 있어요.</p>
    <div class="field" style="font-size:14px;word-break:break-all;user-select:all;margin-bottom:12px">${esc(url)}</div>
    <button class="btn primary block" id="copy">링크 복사</button>
    ${navigator.share ? '<div style="height:8px"></div><button class="btn block" id="native">다른 앱으로 보내기</button>' : ''}`);
  w.querySelector('#copy').onclick = async () => {
    try { await navigator.clipboard.writeText(`${text}\n${url}`); toast('링크를 복사했어요'); closeSheet(); }
    catch { toast('링크를 길게 눌러 직접 복사해 주세요'); }
  };
  const n = w.querySelector('#native');
  if (n) n.onclick = () => navigator.share({ title: 'candid.', text, url }).then(closeSheet).catch(() => {});
}

// ---------- 이미지 ----------
function loadImg(src) { return new Promise((ok, no) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
async function resize(file, max) {
  const img = await loadImg(URL.createObjectURL(file));
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

// ---------- 데모 모드 (Supabase 설정 전, 샘플 데이터로 화면 확인용) ----------
function demoClient() {
  const ss = { get: k => { try { return sessionStorage.getItem(k); } catch { return null; } },
               set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} } };
  const ME = { id: 'demo', user_metadata: { name: '민수' } };
  const tones = [['#f6d5c4','#e9967a'],['#d9dfe8','#8fa3bf'],['#e8e2c8','#b8a970'],['#d8e5d3','#7fa27a'],['#ecd3df','#b9789a'],
                 ['#d4e4ea','#5f97ad'],['#efe0c9','#d08a4e'],['#e1dbef','#8a7cc0'],['#f1d9d2','#c0665a'],['#dde3d6','#95a07f'],['#e7dccd','#a88864'],['#d5dde9','#6c7fa8']];
  const art = (i) => {
    const [a, b] = tones[i % tones.length], cx = 30 + (i * 37) % 60, cy = 25 + (i * 23) % 40;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><defs><linearGradient id="g" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>`
      + `<rect width="800" height="1000" fill="url(#g)"/><circle cx="${cx * 8}" cy="${cy * 10}" r="${120 + i * 9 % 90}" fill="#fff" opacity=".35"/>`
      + `<rect y="720" width="800" height="280" fill="${b}" opacity=".45"/></svg>`);
  };
  const H = 3600e3, now = Date.now(), t = h => new Date(now - h * H).toISOString();
  const seed = [
    ['지수', MISSIONS[0], '이 표정 레전드 ㅋㅋㅋ'], ['민호', MISSIONS[1], '인생샷 인정합니다'], ['익명의 친구', MISSIONS[2], '자는 척하더니 결국 잠'],
    ['서연', MISSIONS[3], '고1 수학여행.. 기억나지?'], ['태윤', MISSIONS[4], '걸어다니는 텐션'], ['지수', MISSIONS[5], '제주도 그날'],
    ['하린', MISSIONS[1], '이건 프사 해야 됨'], ['민호', MISSIONS[0], ''], ['익명의 친구', MISSIONS[2], '집중력 1000%'],
  ].map(([author_name, mission, text], i) => ({ id: 'a' + i, owner_id: 'demo', author_name, mission, text, image_path: art(i),
      status: 'approved', created_at: t(i * 20 + 30), approved_at: t(i * 20 + 5) }));
  const pend = [['서연', MISSIONS[0], '이거 올려도 되지? ㅎㅎ'], ['익명의 친구', MISSIONS[3], '중2 때 사진 발견함'], ['하린', MISSIONS[1], '우리 학교 축제 때']]
    .map(([author_name, mission, text], i) => ({ id: 'p' + i, owner_id: 'demo', author_name, mission, text, image_path: art(9 + i),
      status: 'pending', created_at: t(i * 2 + .3), approved_at: null }));
  let db; try { db = JSON.parse(ss.get('demo_db')); } catch {}
  db = db || { profiles: [{ id: 'demo', name: '민수', avatar_url: null, onboarded: true }], posts: [...seed, ...pend] };
  const persist = () => ss.set('demo_db', JSON.stringify(db));
  const loggedIn = () => ss.get('demo_login') === '1';
  const files = {};

  function from(table) {
    let op = 'select', payload, single = false, order = null; const filters = [];
    const run = () => {
      let rows = db[table].filter(r => filters.every(([k, v]) => r[k] === v));
      if (op === 'insert') {
        const row = { id: 'x' + Math.random().toString(36).slice(2), status: 'pending', approved_at: null, created_at: new Date().toISOString(), ...payload };
        if (files[row.image_path]) row.image_path = files[row.image_path]; // 새로고침해도 사진 유지
        db[table].push(row); persist(); return { data: null, error: null };
      }
      if (op === 'update') { rows.forEach(r => Object.assign(r, payload)); persist(); return { data: null, error: null }; }
      if (op === 'delete') { db[table] = db[table].filter(r => !rows.includes(r)); persist(); return { data: null, error: null }; }
      if (table === 'posts') rows = rows.filter(r => r.status === 'approved' || (loggedIn() && r.owner_id === ME.id)); // RLS 흉내
      if (order) rows = [...rows].sort((a, b) => (a[order[0]] < b[order[0]] ? -1 : 1) * (order[1] ? 1 : -1));
      return { data: single ? rows[0] || null : rows, error: null };
    };
    const b = {
      select: () => b, eq: (k, v) => (filters.push([k, v]), b), maybeSingle: () => (single = true, b),
      order: (k, o = {}) => (order = [k, o.ascending !== false], b),
      insert: p => (op = 'insert', payload = p, b), update: p => (op = 'update', payload = p, b), delete: () => (op = 'delete', b),
      then: (res, rej) => new Promise(r => setTimeout(r, 120)).then(run).then(res, rej),
    };
    return b;
  }
  const toDataUrl = blob => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
  // 데모 전용 하단 바: 시점 전환
  setTimeout(() => {
    const bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;gap:4px;align-items:center;padding:5px 5px 5px 14px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18)';
    const on = loggedIn();
    const pill = (label, active, fn) => `<button onclick="${fn}" style="border:0;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;white-space:nowrap;background:${active ? 'var(--bg)' : 'transparent'};color:${active ? 'var(--fg)' : 'var(--bg)'}">${label}</button>`;
    bar.innerHTML = `<span style="opacity:.6;margin-right:6px">DEMO</span>${pill('주인장 시점', on, "demoView(1)")}${pill('친구 시점', !on, "demoView(0)")}${pill('↺', false, "demoReset()")}`;
    document.body.appendChild(bar);
    document.getElementById('toast').style.bottom = '76px';
    document.body.style.paddingBottom = '72px';
  });
  window.demoView = v => { ss.set('demo_login', v ? '1' : '0'); location.href = location.pathname + '?u=demo'; };
  window.demoReset = () => { try { sessionStorage.clear(); } catch {} location.href = location.pathname; };

  return {
    auth: {
      getSession: async () => ({ data: { session: loggedIn() ? { user: ME } : null } }),
      signInWithOAuth: async () => { ss.set('demo_login', '1'); location.href = location.pathname; },
      signOut: async () => ss.set('demo_login', '0'),
    },
    from,
    storage: { from: () => ({
      getPublicUrl: p => ({ data: { publicUrl: files[p] || p } }),
      upload: async (p, blob) => { files[p] = await toDataUrl(blob); return { error: null }; },
      remove: async () => ({ error: null }),
    }) },
    _files: files,
  };
}

// 정사각형으로 가운데 잘라서 축소 (프로필 사진용)
async function resizeSquare(file, size) {
  const img = await loadImg(URL.createObjectURL(file)), side = Math.min(img.width, img.height);
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

// 인스타 스토리용 1080x1920 이미지
async function makeStory(id) {
  closeSheet();
  const p = S.approved.find(x => x.id === id);
  await Promise.all([document.fonts.load('800 80px "Bricolage Grotesque"'), document.fonts.load('600 40px Pretendard')]).catch(() => {});
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 1080, 1920);
  g.textAlign = 'center';
  g.fillStyle = '#0a0a0a'; g.font = '800 76px "Bricolage Grotesque", sans-serif'; g.fillText('candid', 528, 190);
  g.fillStyle = '#2b50ff'; g.fillText('.', 528 + g.measureText('candid').width / 2 + 4, 190);
  g.fillStyle = '#8e8e93'; g.font = '600 34px Pretendard, sans-serif'; g.fillText(`친구가 본 ${S.prof.name}`, 540, 260);
  // 사진 카드
  g.save(); g.translate(540, 920); g.rotate(-0.025);
  g.shadowColor = 'rgba(0,0,0,.12)'; g.shadowBlur = 60; g.shadowOffsetY = 20;
  g.fillStyle = '#fff'; g.fillRect(-390, -500, 780, 1060); g.shadowColor = 'transparent';
  const img = await loadImg(photoUrl(p.image_path));
  const tw = 720, th = 900, r = Math.max(tw / img.width, th / img.height);
  const sw = tw / r, sh = th / r;
  g.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, -360, -470, tw, th);
  g.textAlign = 'left'; g.fillStyle = '#2b50ff'; g.font = '600 28px Pretendard, sans-serif'; g.fillText(p.mission || '', -360, 495);
  g.textAlign = 'right'; g.fillStyle = '#8e8e93'; g.fillText('— ' + p.author_name, 360, 495);
  g.restore();
  if (p.text) {
    g.textAlign = 'center'; g.fillStyle = '#0a0a0a'; g.font = '700 64px "Bricolage Grotesque", Pretendard, sans-serif';
    g.fillText(`“${p.text}”`, 540, 1600, 940);
  }
  g.fillStyle = '#8e8e93'; g.font = '500 30px Pretendard, sans-serif';
  g.fillText('너도 친구들한테 피드를 맡겨봐', 540, 1790);
  const blob = await new Promise(res => c.toBlob(res, 'image/png'));
  const file = new File([blob], 'candid-story.png', { type: 'image/png' });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch {} }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  toast('이미지를 저장했어요');
}
